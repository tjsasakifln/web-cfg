<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="outsourcing-cycle-title outsourcing-cycle-desc">
<title id="outsourcing-cycle-title">A demanda volta à equipe com revisão identificada.</title><desc id="outsourcing-cycle-desc">Fluxo conceitual entre equipe contratante e produção terceirizada, incluindo base, escopo, produção, checagem, comentários e revisão.</desc>
<defs><pattern id="grid-outsourcing-cycle" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#dce4e7" stroke-width="1"/></pattern><marker id="arrow-outsourcing-cycle" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#2d6f2d"/></marker><marker id="navy-arrow-outsourcing-cycle" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#071a31"/></marker></defs>
<style>.n{fill:none;stroke:#071a31;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.g{fill:none;stroke:#2d6f2d;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.b{fill:none;stroke:#397f94;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.dash{fill:none;stroke:#71818b;stroke-width:2;stroke-dasharray:8 7}.thin{fill:none;stroke:#71818b;stroke-width:1.5}.panel{fill:#fff;stroke:#9babb2;stroke-width:2}.soft{fill:#e7efe7;stroke:#2d6f2d;stroke-width:2}.navy{fill:#071a31}.green{fill:#2d6f2d}.lime{fill:#c8df72}.t{font:700 16px Arial,sans-serif;fill:#071a31}.s{font:14px Arial,sans-serif;fill:#405563}.q{font:12px Arial,sans-serif;fill:#526873}.k{font:700 12px Arial,sans-serif;fill:#2d6f2d;letter-spacing:1.4px}.w{font:700 14px Arial,sans-serif;fill:#fff}.dim{font:12px Arial,sans-serif;fill:#2d6f2d}</style>
<rect width="960" height="600" fill="#f4f7f6"/><rect x="36" y="32" width="888" height="536" fill="url(#grid-outsourcing-cycle)" stroke="#bcc9ce"/>
<text class="k" x="64" y="66">DEMONSTRAÇÃO TÉCNICA · TERCEIRIZAÇÃO CONTROLADA</text><text class="s" x="64" y="94">A demanda volta à equipe com revisão identificada.</text><line x1="64" y1="108" x2="896" y2="108" stroke="#9babb2"/>

<rect class="navy" x="64" y="154" width="190" height="110"/><text class="w" x="88" y="188">CONTRATANTE</text><text class="w" x="88" y="218">base R05</text><text class="w" x="88" y="242">comentários C12</text><path class="g" d="M254 194H334" marker-end="url(#arrow-outsourcing-cycle)"/><rect class="soft" x="334" y="148" width="220" height="122"/><text class="t" x="358" y="180">CONFIRMAÇÃO</text><text class="s" x="358" y="208">escopo · critérios</text><text class="s" x="358" y="234">interfaces · revisão</text><path class="g" d="M554 194H634" marker-end="url(#arrow-outsourcing-cycle)"/><rect class="panel" x="634" y="154" width="254" height="110"/><text class="t" x="658" y="188">PRODUÇÃO EXTERNA</text><text class="s" x="658" y="216">desenvolvimento + checagem</text>
<path class="g" d="M760 264V350" marker-end="url(#arrow-outsourcing-cycle)"/><rect class="panel" x="598" y="350" width="290" height="100"/><text class="t" x="622" y="384">DEVOLUÇÃO · REV B</text><text class="s" x="622" y="414">arquivos + registro de alterações</text><path class="g" d="M598 400H330" marker-end="url(#arrow-outsourcing-cycle)"/><rect class="panel" x="84" y="350" width="246" height="100"/><text class="t" x="108" y="384">LEITURA / COMENTÁRIOS</text><text class="s" x="108" y="414">nova mudança abre REV C</text><path class="dash" d="M172 350V274"/><text class="q" x="370" y="492">nenhuma revisão apaga o histórico anterior</text>
<text class="q" x="64" y="548">REPRESENTAÇÃO CONCEITUAL · SEM ESCALA</text></svg>