    <pattern id="accent" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M-1 4l5-5M0 8l8-8" stroke="#ced62a" stroke-width="1.6"/></pattern>
  </defs>
  <g fill="none" stroke="#c1d0d6" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">
<path d="m44 72 104-42 164 33-105 44z" fill="#304b5e"/>
