<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 168" role="img" aria-labelledby="title desc">
  <title id="title">Janela e viga em duas revisões</title>
  <desc id="desc">À esquerda, a janela invade a faixa hachurada da viga. À direita, a janela termina abaixo da viga e há um intervalo entre os dois elementos.</desc>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M-1 1l2-2M0 6l6-6M5 7l2-2" stroke="#90a6b0" stroke-width="1"/>
    </pattern>
    <pattern id="overlap" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#ced62a"/><path d="M0 4l4-4" stroke="#465529" stroke-width="1.6"/>
    </pattern>
    <g id="beam" fill="url(#hatch)" stroke="#abc1cb" stroke-width="1.7">
      <path d="M0 20h143v40H0z"/>
    </g>
  </defs>
  <!-- Matching crops of the eastern elevation, at 100 drawing units per metre.
       Beam soffit +2.20 m, window sill +1.40 m in both revisions. -->
  <use href="#beam" x="15"/><use href="#beam" x="202"/>
  <g fill="none" stroke="#f2f6f5" stroke-width="2.4">
    <path d="M46 50h80v90H46z M233 70h80v70h-80z"/>
  </g>
  <path d="M46 50h80v10H46z" fill="url(#overlap)" stroke="#ced62a" stroke-width="1.2"/>
  <path d="M28 60h125 M214 60h122" fill="none" stroke="#c1d0d6" stroke-dasharray="3 3"/>
  <path d="M233 70h80m6-10h10m-10 10h10m-5-10v10" fill="none" stroke="#ced62a" stroke-width="2.4"/>
  <path d="M167 96h25m-7-6 7 6-7 6" fill="none" stroke="#ced62a" stroke-width="2"/>
</svg>
