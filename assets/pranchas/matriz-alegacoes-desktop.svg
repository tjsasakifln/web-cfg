<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="matriz-alegacoes-desktop-title matriz-alegacoes-desktop-desc" font-family="Archivo Var, Arial, Helvetica, sans-serif" fill="#071a31">
<title id="matriz-alegacoes-desktop-title">Prancha P11 · Matriz de alegações da notificação · exemplo demonstrativo</title>
<desc id="matriz-alegacoes-desktop-desc">Matriz de 4 alegações de uma notificação hipotética: 2 controvertidas com prova, 1 admitida em parte, 1 sem registro localizado. Na alegação principal, 28 de 45 dias têm registro de frente bloqueada pelo órgão; 17 dias ficam para explicar. Prazo de 10 dias úteis, restam 7. Notificação sintética; exemplo demonstrativo, sem obra de cliente. Procedência: data/demonstrative/plates/matriz-alegacoes.v1.json.</desc>
<rect x="0" y="0" width="1200" height="560" fill="#ffffff"/>
<rect x="8" y="8" width="1184" height="544" fill="#ffffff" stroke="#dfe4e6"/>
<text x="28" y="40" font-size="16" font-weight="650">Matriz de alegações da notificação: o que é controvertido, admitido ou sem registro</text>
<text x="1172" y="40" font-size="11" fill="#5d6a7a" text-anchor="end">Dados demonstrativos · revisão R00</text>
<defs><pattern id="matriz-alegacoes-d-h5d6a" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V6" stroke="#5d6a7a" stroke-width="0.5"/></pattern></defs>
<text x="28" y="72" font-size="12" font-weight="650">Notificação hipotética com 4 alegações · prazo de resposta 10 dias úteis, restam 7 · cada linha confronta alegação, obrigação, fato, medida e prova</text>
<text x="78" y="104" font-size="12" fill="#5d6a7a" font-weight="650">Alegação</text>
