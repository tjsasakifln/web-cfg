<text x="78" y="238" font-size="12" font-weight="650">Equipe abaixo do mínimo contratual</text>
<text x="78" y="254" font-size="11" fill="#5d6a7a">A-02</text>
<text x="300" y="238" font-size="11">12 profissionais mobilizados</text>
<text x="520" y="238" font-size="11">9 mobilizados por 6 dias</text>
<text x="520" y="254" font-size="11" fill="#5d6a7a">Medida: reforço de equipe em 4 dias</text>
<text x="760" y="238" font-size="11">folha de ponto</text>
<text x="760" y="254" font-size="11" fill="#5d6a7a">Lacuna: nenhuma</text>
<text x="990" y="238" font-size="12" font-weight="650">Admitido em parte</text>
<line x1="28" y1="270" x2="1172" y2="270" stroke="#dfe4e6" stroke-width="1"/>
<rect x="40" y="284" width="16" height="16" fill="#ffffff" stroke="#071a31" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="78" y="296" font-size="12" font-weight="650">Material fora da especificação</text>
<text x="78" y="312" font-size="11" fill="#5d6a7a">A-03</text>
<text x="300" y="296" font-size="11">ensaio por lote recebido</text>
<text x="520" y="296" font-size="11">lote recebido sem ensaio arquivado</text>
<text x="520" y="312" font-size="11" fill="#5d6a7a">Medida: ensaio solicitado ao fornecedor</text>
<text x="760" y="296" font-size="11">nota fiscal do lote</text>
<text x="760" y="312" font-size="11" fill="#5d6a7a">Lacuna: laudo de ensaio do lote</text>
<text x="990" y="296" font-size="12" font-weight="650">Sem registro localizado</text>
<line x1="28" y1="328" x2="1172" y2="328" stroke="#dfe4e6" stroke-width="1"/>
<rect x="40" y="342" width="16" height="16" fill="#2d6f2d"/>
<text x="78" y="354" font-size="12" font-weight="650">Sinalização de segurança ausente</text>
<text x="78" y="370" font-size="11" fill="#5d6a7a">A-04</text>
<text x="300" y="354" font-size="11">sinalização conforme o PGR</text>
<text x="520" y="354" font-size="11">sinalização instalada na data apontada</text>
<text x="520" y="370" font-size="11" fill="#5d6a7a">Medida: registro fotográfico diário</text>
<text x="760" y="354" font-size="11">fotos datadas e geolocalizadas</text>
<text x="760" y="370" font-size="11" fill="#5d6a7a">Lacuna: nenhuma</text>
<text x="990" y="354" font-size="12" font-weight="650">Controvertido com prova</text>
<line x1="28" y1="386" x2="1172" y2="386" stroke="#dfe4e6" stroke-width="1"/>
