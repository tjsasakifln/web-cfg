<text x="520" y="104" font-size="12" fill="#5d6a7a" font-weight="650">Fato registrado</text>
<text x="760" y="104" font-size="12" fill="#5d6a7a" font-weight="650">Prova e lacuna</text>
<text x="990" y="104" font-size="12" fill="#5d6a7a" font-weight="650">Situação</text>
<line x1="28" y1="112" x2="1172" y2="112" stroke="#071a31" stroke-width="1.2"/>
<rect x="20" y="114" width="1160" height="96" fill="#ced62a" fill-opacity=".35"/>
<rect x="40" y="126" width="16" height="16" fill="#2d6f2d"/>
<text x="78" y="138" font-size="12" fill="#2d6f2d" font-weight="650">Atraso de 45 dias na frente 2</text>
<text x="78" y="154" font-size="11" fill="#5d6a7a">A-01</text>
<text x="300" y="138" font-size="11">prazo parcial do cronograma</text>
<text x="520" y="138" font-size="11">frente bloqueada pelo órgão por 28 dias</text>
<text x="520" y="154" font-size="11" fill="#5d6a7a">Medida: ofício de liberação protocolado</text>
<text x="760" y="138" font-size="11">diário e ofício datados</text>
<text x="760" y="154" font-size="11" fill="#5d6a7a">Lacuna: nenhuma</text>
<text x="990" y="138" font-size="12" fill="#2d6f2d" font-weight="650">Controvertido com prova</text>
<rect x="300" y="168" width="400" height="8" fill="#f3f4f5" stroke="#071a31" stroke-width="1.2"/>
<rect x="300" y="168" width="248.9" height="8" fill="#2d6f2d"/>
<rect x="548.9" y="168" width="151.1" height="8" fill="url(#matriz-alegacoes-d-h5d6a)"/>
<g stroke="#5d6a7a" stroke-width="0.6" fill="#5d6a7a"><line x1="548.9" y1="190" x2="700" y2="190"/><path d="M545.9 193L551.9 187"/><path d="M697 193L703 187"/><text x="624.4" y="203" font-size="11" text-anchor="middle">17 dias sem causa alheia documentada</text></g>
<text x="712" y="176" font-size="12" fill="#2d6f2d" font-weight="650">28 de 45 dias com registro</text>
