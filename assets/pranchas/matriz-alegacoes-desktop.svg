<g transform="translate(260 172)"><circle r="11" fill="#071a31"/><text y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text></g>
<g stroke="#5d6a7a" stroke-width="0.6"><line x1="48" y1="311" x2="48" y2="302"/><circle cx="48" cy="302" r="1.6" fill="#5d6a7a"/></g>
<g transform="translate(48 322)"><circle r="11" fill="#071a31"/><text y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text></g>
<g stroke="#5d6a7a" stroke-width="0.6"><line x1="1149" y1="232.5" x2="1120" y2="234"/><circle cx="1120" cy="234" r="1.6" fill="#5d6a7a"/></g>
<g transform="translate(1160 232)"><circle r="11" fill="#071a31"/><text y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text></g>
<text x="28" y="430" font-size="12" font-weight="650">Chamadas</text><text x="28" y="448" font-size="11"><tspan font-weight="700">1</tspan><tspan x="44">Alegação principal: Atraso de 45 dias na frente 2; o diário e o ofício documentam 28 dias de frente bloqueada pelo órgão. Restam 17 dias (45 − 28 = 17) que a resposta precisa explicar ou admitir.</tspan></text><text x="28" y="466" font-size="11"><tspan font-weight="700">2</tspan><tspan x="44">Sem registro localizado: Material fora da especificação. A lacuna (laudo de ensaio do lote) entra declarada na matriz; a resposta não afirma o que não tem prova.</tspan></text><text x="28" y="484" font-size="11"><tspan font-weight="700">3</tspan><tspan x="44">Admitido em parte: Equipe abaixo do mínimo contratual, 9 mobilizados por 6 dias, com a medida adotada (reforço de equipe em 4 dias) e a prova (folha de ponto). 4 alegações · 2 controvertidas · 1 admitida em parte · 1 sem registro.</tspan></text>
<g id="matriz-alegacoes-d-carimbo"><rect x="8" y="524" width="1184" height="28" fill="#ffffff" stroke="#dfe4e6"/><line x1="402.7" y1="524" x2="402.7" y2="552" stroke="#dfe4e6"/><line x1="797.3" y1="524" x2="797.3" y2="552" stroke="#dfe4e6"/><text x="16" y="542" font-size="11" fill="#5d6a7a">P11 · matriz-alegacoes · rev. R00</text><text x="410.7" y="542" font-size="11" fill="#5d6a7a">Matriz alegação × prova · barra proporcional em dias</text><text x="805.3" y="542" font-size="11" fill="#5d6a7a">Exemplo demonstrativo · sem obra de cliente</text></g>
</svg>
