<title id="reequilibrio-curva-desktop-title">Prancha P9 · Índice de custo, data-base e o desequilíbrio a demonstrar · exemplo demonstrativo</title>
<desc id="reequilibrio-curva-desktop-desc">Curva sintética do índice de custo de um insumo, base 100 na data-base: sobe 1 ponto por mês até o evento do mês 7 (índice 107) e chega a 130 no mês 12; a tendência anterior chegaria a 112. A área hachurada entre as duas linhas, do mês 7 ao 12, é o desequilíbrio a demonstrar, com pico de 18 pontos. Exemplo demonstrativo. Procedência: data/demonstrative/plates/reequilibrio-curva.v1.json.</desc>
