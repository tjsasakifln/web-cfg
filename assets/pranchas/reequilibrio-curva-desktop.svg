<text x="28" y="446" font-size="12" font-weight="650">Chamadas</text><text x="28" y="464" font-size="11"><tspan font-weight="700">1</tspan><tspan x="44">Evento: alta atípica do insumo no mês 7 (índice 107): é o fato posterior à proposta. Sem evento, matriz de riscos e nexo, aumento genérico de custo não é reequilíbrio.</tspan></text><text x="28" y="482" font-size="11"><tspan font-weight="700">2</tspan><tspan x="44">Desequilíbrio a demonstrar: área entre a tendência anterior e o custo observado, por item e período; no mês 12 a diferença chega a 18 pontos (130-112).</tspan></text><text x="28" y="500" font-size="11"><tspan font-weight="700">3</tspan><tspan x="44">Aniversário: reajuste ordinário no mês 12: atualiza pela fórmula da cláusula na data-base e não recompõe o que aconteceu antes dele. Não é o mesmo instituto.</tspan></text>
