<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="interfaces-versoes-desktop-title interfaces-versoes-desktop-desc" font-family="Archivo Var, Arial, Helvetica, sans-serif" fill="#071a31">
<title id="interfaces-versoes-desktop-title">Prancha PH · Como a produção conversa com a origem · exemplo demonstrativo</title>
<desc id="interfaces-versoes-desktop-desc">Diagrama de fluxo em quatro etapas: Insumos de origem → Disciplina delimitada → Interfaces → Versão devolvida. O autor da arquitetura decide o que altera no próprio projeto; nada é copiado ou adulterado. Cada encontro entre disciplinas tem um dono de cada lado; a pendência volta a quem responde. Cada ciclo registra versão, data e responsável; ciclos, prazo e preço ficam na proposta. Não fixa prazo, preço, quantidade de ciclos nem cobertura de campo. Exemplo demonstrativo, sem obra de cliente. Procedência: data/demonstrative/plates/elaboracao-complementar.v1.json.</desc>
<rect x="0" y="0" width="1200" height="460" fill="#ffffff"/>
<rect x="8" y="8" width="1184" height="444" fill="#ffffff" stroke="#dfe4e6"/>
<text x="28" y="40" font-size="16" font-weight="650">Como a produção conversa com a origem</text>
<text x="1172" y="40" font-size="11" fill="#5d6a7a" text-anchor="end">Dados demonstrativos · revisão R00</text>
<text x="28" y="72" font-size="12" font-weight="650">Cada seta é uma combinação explícita · nenhuma etapa copia ou adultera o projeto de terceiro · ciclos, prazo e preço ficam na proposta</text>
<rect x="72" y="104" width="240" height="140" fill="#ffffff" stroke="#071a31" stroke-width="1.2"/>
<text x="86" y="126" font-size="11" fill="#5d6a7a">IV-A</text>
<text x="86" y="150" font-size="13" font-weight="650">Insumos de origem</text>
<text x="86" y="176" font-size="12">Arquitetura, fase, finalidade</text>
<text x="86" y="193" font-size="12">e o que já existe do pacote.</text>
<g stroke="#5d6a7a" stroke-width="0.6" fill="none"><line x1="316" y1="174" x2="340" y2="174"/><path d="M334 170L340 174L334 178"/></g>
<g transform="translate(310 106)"><circle r="11" fill="#071a31"/><text y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text></g>
<rect x="344" y="104" width="240" height="140" fill="#ffffff" stroke="#071a31" stroke-width="1.2"/>
<text x="358" y="126" font-size="11" fill="#5d6a7a">IV-B</text>
<text x="358" y="150" font-size="13" font-weight="650">Disciplina delimitada</text>
<text x="358" y="176" font-size="12">Recorte, responsável e o que</text>
<text x="358" y="193" font-size="12">não entra neste ciclo.</text>
<g stroke="#5d6a7a" stroke-width="0.6" fill="none"><line x1="588" y1="174" x2="612" y2="174"/><path d="M606 170L612 174L606 178"/></g>
<rect x="616" y="104" width="240" height="140" fill="#ffffff" stroke="#071a31" stroke-width="1.2"/>
<text x="630" y="126" font-size="11" fill="#5d6a7a">IV-C</text>
<text x="630" y="150" font-size="13" font-weight="650">Interfaces</text>
<text x="630" y="176" font-size="12">Pontos de encontro com as</text>
<text x="630" y="193" font-size="12">demais partes, com dono de</text>
<text x="630" y="210" font-size="12">cada lado.</text>
<g stroke="#5d6a7a" stroke-width="0.6" fill="none"><line x1="860" y1="174" x2="884" y2="174"/><path d="M878 170L884 174L878 178"/></g>
<g transform="translate(854 106)"><circle r="11" fill="#071a31"/><text y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text></g>
<rect x="888" y="104" width="240" height="140" fill="#ffffff" stroke="#2d6f2d" stroke-width="2"/>
<text x="902" y="126" font-size="11" fill="#5d6a7a">IV-D</text>
<text x="902" y="150" font-size="13" fill="#2d6f2d" font-weight="650">Versão devolvida</text>
<text x="902" y="176" font-size="12">Data, responsável e o que</text>
<text x="902" y="193" font-size="12">mudou nas interfaces.</text>
<g transform="translate(1126 106)"><circle r="11" fill="#071a31"/><text y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text></g>
<text x="72" y="280" font-size="11" fill="#5d6a7a">Percurso de um ciclo: os insumos delimitam a disciplina; a disciplina nomeia as interfaces; a versão devolvida registra o que mudou e para quem cada pendência volta.</text>
<text x="72" y="316" font-size="12" font-weight="650">Chamadas</text><text x="72" y="334" font-size="11"><tspan font-weight="700">1</tspan><tspan x="88">O autor da arquitetura decide o que altera no próprio projeto; nada é copiado ou adulterado.</tspan></text><text x="72" y="352" font-size="11"><tspan font-weight="700">2</tspan><tspan x="88">Cada encontro entre disciplinas tem um dono de cada lado; a pendência volta a quem responde.</tspan></text><text x="72" y="370" font-size="11"><tspan font-weight="700">3</tspan><tspan x="88">Cada ciclo registra versão, data e responsável; ciclos, prazo e preço ficam na proposta.</tspan></text>
<g id="interfaces-versoes-d-carimbo"><rect x="8" y="424" width="1184" height="28" fill="#ffffff" stroke="#dfe4e6"/><line x1="402.7" y1="424" x2="402.7" y2="452" stroke="#dfe4e6"/><line x1="797.3" y1="424" x2="797.3" y2="452" stroke="#dfe4e6"/><text x="16" y="442" font-size="11" fill="#5d6a7a">PH · interfaces-versoes · rev. R00</text><text x="410.7" y="442" font-size="11" fill="#5d6a7a">Sem escala · diagrama de fluxo</text><text x="805.3" y="442" font-size="11" fill="#5d6a7a">Exemplo demonstrativo · sem obra de cliente</text></g>
</svg>
