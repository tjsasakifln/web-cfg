<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="sst-canteiro-desktop-title sst-canteiro-desktop-desc" font-family="Archivo Var, Arial, Helvetica, sans-serif" fill="#071a31">
<title id="sst-canteiro-desktop-title">Prancha PF · Planta do canteiro: proteções coletivas conferidas · exemplo demonstrativo</title>
<desc id="sst-canteiro-desktop-desc">Planta de um canteiro de 36,00 por 24,00 m com a edificação em execução, a circulação de pedestres, a grua e a torre de acesso, e quatro proteções coletivas numeradas: guarda-corpo de periferia conferido, bandeja de proteção pendente, isolamento da área de içamento conferido e torre de acesso com guarda-corpo conferida; 3 conferidos e 1 pendente. Exemplo demonstrativo. Procedência: data/demonstrative/plates/sst-canteiro.v1.json.</desc>
<rect x="0" y="0" width="1200" height="580" fill="#ffffff"/>
<rect x="8" y="8" width="1184" height="564" fill="#ffffff" stroke="#dfe4e6"/>
<text x="28" y="40" font-size="16" font-weight="650">Segurança do trabalho: o que foi conferido no canteiro, onde, e o que ficou pendente</text>
<text x="1172" y="40" font-size="11" fill="#5d6a7a" text-anchor="end">Dados demonstrativos · revisão R00</text>
<defs><pattern id="sst-canteiro-d-h5d6a" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V6" stroke="#5d6a7a" stroke-width="0.5"/></pattern></defs>
<text x="100" y="80" font-size="12" font-weight="650">Planta · canteiro CT-01 · proteções coletivas numeradas · norte para cima</text>
