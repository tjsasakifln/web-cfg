iddle" font-size="11" font-weight="700" fill="#ffffff">3</text></g><g stroke="#5d6a7a" stroke-width="0.6"><line x1="495.4" y1="315.9" x2="474" y2="333"/><circle cx="474" cy="333" r="1.6" fill="#5d6a7a"/></g><g transform="translate(504 309)"><circle r="11" fill="#071a31"/><text y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text></g>
<g stroke="#5d6a7a" stroke-width="0.6" fill="#5d6a7a"><line x1="110" y1="450" x2="578" y2="450"/><path d="M107 453L113 447"/><path d="M575 453L581 447"/><line x1="110" y1="424" x2="110" y2="452"/><line x1="578" y1="424" x2="578" y2="452"/><text x="344" y="463" font-size="11" text-anchor="middle">36,00 m</text><line x1="88" y1="112" x2="88" y2="424"/><path d="M85 115L91 109"/><path d="M85 427L91 421"/><line x1="110" y1="112" x2="86" y2="112"/><line x1="110" y1="424" x2="86" y2="424"/><text x="84" y="268" font-size="11" text-anchor="middle" transform="rotate(-90 84 268)">24,00 m</text></g>
<text x="740" y="128" font-size="12" font-weight="650">Checklist · 3 conferidos · 1 pendente de 4</text>
<rect x="740" y="146" width="9" height="9" fill="#2d6f2d"/>
<text x="756" y="154" font-size="11" font-weight="650">1 Guarda-corpo de periferia · 42,00 m · Conferido</text>
<text x="756" y="169" font-size="11" fill="#5d6a7a">Bordas da laje do pav. 2, lados norte, leste e oeste</text>
<text x="756" y="184" font-size="11" fill="#5d6a7a">Altura, travessa intermediária, rodapé e fixação registrados.</text>
<rect x="740" y="202" width="9" height="9" fill="none" stroke="#071a31" stroke-width="1.2"/>
<text x="756" y="210" font-size="11" fill="#5d6a7a" font-weight="650">2 Bandeja de proteção · 18,00 m · Pendente</text>
<text x="756" y="225" font-size="11" fill="#5d6a7a">Fachada sul, sobre a circulação de pedestres</text>
<text x="756" y="240" font-size="11" fill="#5d6a7a">Ausente no trecho sobre a circulação; item aberto para o responsável pela obra.</text>
<rect x="740" y="258" width="9" height="9" fill="#2d6f2d"/>
<text x="756" y="266" font-size="11" font-weight="650">3 Isolamento da área de içamento · 9,00 m · Conferido</text>
<text x="756" y="281" font-size="11" fill="#5d6a7a">Raio de giro da grua, lado leste</text>
<text x="756" y="296" font-size="11" fill="#5d6a7a">Sinalização e barreira física no raio; acesso controlado.</text>
<rect x="740" y="314" width="9" height="9" fill="#2d6f2d"/>
<text x="756" y="322" font-size="11" font-weight="650">4 Torre de acesso com guarda-corpo · 2,00 m · Conferido</text>
<text x="756" y="337" font-size="11" fill="#5d6a7a">Torre de acesso, canto sudeste da edificação</text>
<text x="756" y="352" font-size="11" fill="#5d6a7a">Guarda-corpo, patamares e fixação à estrutura registrados.</text>
<text x="740" y="399" font-size="11">Conferência documental e de campo do escopo informado, em uma data.</text><text x="740" y="416" font-size="11" fill="#5d6a7a">Não é PGR, LTCAT, AET nem laudo; não substitui o programa da obra nem ato médico.</text><text x="740" y="433" font-size="11" fill="#5d6a7a">Item pendente volta ao responsável pela obra com localização e evidência.</text>
<g id="sst-canteiro-d-carimbo"><rect x="8" y="544" width="1184" height="28" fill="#ffffff" stroke="#dfe4e6"/><line x1="402.7" y1="544" x2="402.7" y2="572" stroke="#dfe4e6"/><line x1="797.3" y1="544" x2="797.3" y2="572" stroke="#dfe4e6"/><text x="16" y="562" font-size="11" fill="#5d6a7a">PF · sst-canteiro · rev. R00</text><text x="410.7" y="562" font-size="11" fill="#5d6a7a">Escala indicativa · cotas em m</text><text x="805.3" y="562" font-size="11" fill="#5d6a7a">Exemplo demonstrativo</text></g>
</svg>
