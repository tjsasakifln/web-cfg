<title id="revisao-conferencia-desktop-title">Prancha PB · Conferência de revisão RF-01 e RF-02 sobre a elevação leste e o poço HS-01 · exemplo demonstrativo</title>
<desc id="revisao-conferencia-desktop-desc">Elevação da parede W-02 no estado R00 com a marcação RF-01: verga da WN-01 em 2,30 m invade o volume da viga B-01 com fundo em 2,20 m; ação proposta: rebaixar a verga para 2,10 m. Detalhe do poço HS-01 de 0,40 por 0,40 m com a marcação RF-02: vão livre interno e diâmetros não declarados, pedido de informação. Exemplo demonstrativo. Procedência: data/demonstrative/private-project-pilot/source.v1.json, data/demonstrative/private-project-pilot/consumption.v1.json.</desc>
