<g stroke="#5d6a7a" stroke-width="0.6"><line x1="481" y1="225" x2="519" y2="225"/><circle cx="519" cy="225" r="1.6" fill="#5d6a7a"/></g>
<g transform="translate(470 225)"><circle r="11" fill="#071a31"/><text y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text></g>
<text x="790" y="128" font-size="12" font-weight="650">Ficha de conferência · o que o relatório separa</text><text x="790" y="145" font-size="11"><tspan font-weight="700">1</tspan><tspan x="806">RF-01 · PR-ARQ-R00 · constatação sustentada</tspan></text><text x="790" y="162" font-size="11">A verga da janela WN-01 invade o volume da viga B-01 no estado original.</text><text x="790" y="179" font-size="11" fill="#5d6a7a">Base: conferência geométrica das faixas Z; verga 2,30 m × fundo 2,20 m.</text><text x="790" y="196" font-size="11" fill="#5d6a7a">Norma de dimensionamento: não examinada; pergunta ao autor, não erro.</text><text x="790" y="213" font-size="11">Ação: Rebaixar a verga para 2,10 m no recorte R01 e manter a viga na cota original.</text><text x="790" y="230" font-size="11"><tspan font-weight="700">2</tspan><tspan x="806">RF-02 · PR-HID-R00 · informação faltante</tspan></text><text x="790" y="247" font-size="11">O poço hidrossanitário HS-01 não declara vão livre interno nem diâmetros.</text><text x="790" y="264" font-size="11" fill="#5d6a7a">Base: campo do recorte vazio; ausência de informação, não falha.</text><text x="790" y="281" font-size="11">Ação: Registrar pedido de informação; não converter a lacuna em falha comprovada.</text>
<text x="100" y="493" font-size="11" fill="#5d6a7a">Cada constatação sai com peça e cota citadas, base da conferência e correção proposta; o que não pôde ser verificado fica como pergunta ao autor.</text><text x="100" y="510" font-size="11">A autoria permanece com o autor do projeto: o relatório localiza e propõe, o autor decide e corrige.</text>
