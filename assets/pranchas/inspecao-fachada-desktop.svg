<text x="720" y="128" font-size="12" font-weight="650">Registro por item · o que foi visto, medido e o que ficou em aberto</text><text x="720" y="145" font-size="11"><tspan font-weight="700">1</tspan><tspan x="736">Fissura inclinada · Painel entre J-05 e J-06, pav. 2</tspan></text><text x="720" y="162" font-size="11">1,20 m a 45°, abertura 0,40 mm · Vista, medida e fotografada; não aberta para exame.</text><text x="720" y="179" font-size="11"><tspan font-weight="700">2</tspan><tspan x="736">Mancha de umidade com borda · Painel sob J-01, pav. 1</tspan></text><text x="720" y="196" font-size="11">1,60 × 0,70 m · Vista e medida; borda definida, sem ensaio de umidade.</text><text x="720" y="213" font-size="11"><tspan font-weight="700">3</tspan><tspan x="736">Desplacamento de revestimento · Junto à laje de cobertura, entre J-08 e J-09</tspan></text><text x="720" y="230" font-size="11">0,90 × 0,40 m · Vista; som cavo ao redor não delimitado; revestimento não removido.</text><text x="720" y="247" font-size="11"><tspan font-weight="700">4</tspan><tspan x="736">Fissura horizontal junto à laje · Alinhamento da laje do pav. 3, do eixo A ao eixo B</tspan></text><text x="720" y="264" font-size="11">3,20 m, abertura 0,20 mm · Vista e medida ao longo do alinhamento da laje; sem abertura.</text><text x="720" y="281" font-size="11" fill="#5d6a7a">Causa não concluída em todos os itens: hipótese não é causa única.</text><text x="720" y="298" font-size="11" fill="#5d6a7a">Próximo exame por item: monitoramento, ensaio de umidade, percussão ou leitura do projeto.</text><text x="720" y="315" font-size="11">Inspeção visual com trena e fissurômetro; sem abertura, ensaio ou monitoramento.</text><text x="720" y="332" font-size="11">Registro de uma data; a fachada pode mudar depois dela.</text>
