<desc id="inspecao-fachada-desktop-desc">Elevação da fachada leste de 12,00 por 9,00 m, três pavimentos, com quatro manifestações numeradas: fissura inclinada M-01 de 1,20 m, mancha de umidade M-02 de 1,60 por 0,70 m, desplacamento M-03 de 0,90 por 0,40 m e fissura horizontal M-04 de 3,20 m. Cada item com localização, medida, o que foi visto e o exame seguinte; causa não concluída. Exemplo demonstrativo. Procedência: data/demonstrative/plates/inspecao-fachada.v1.json.</desc>
