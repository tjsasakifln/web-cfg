<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-labelledby="interferencia-verga-viga-mobile-title interferencia-verga-viga-mobile-desc" font-family="Archivo Var, Arial, Helvetica, sans-serif" fill="#071a31">
<title id="interferencia-verga-viga-mobile-title">Prancha PA (móvel) · Interferência WN-01 × B-01 em R00 e R01 · exemplo demonstrativo</title>
