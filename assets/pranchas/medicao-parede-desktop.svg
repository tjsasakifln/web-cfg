<g stroke="#5d6a7a" stroke-width="0.6"><line x1="307" y1="364" x2="328" y2="364"/><circle cx="328" cy="364" r="1.6" fill="#5d6a7a"/></g>
<g transform="translate(296 364)"><circle r="11" fill="#071a31"/><text y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text></g>
<text x="28" y="430" font-size="12" font-weight="650">Chamadas</text><text x="28" y="448" font-size="11"><tspan font-weight="700">1</tspan><tspan x="44">Diferença medido × executado: 120 − 90 = 30 m². Não é direito automático: o dossiê registra os dois números e o critério.</tspan></text><text x="28" y="466" font-size="11"><tspan font-weight="700">2</tspan><tspan x="44">Lacuna de prova: 90 medidos − 80 evidenciados por fotos datadas = 10 m² sem prova contemporânea.</tspan></text><text x="28" y="484" font-size="11"><tspan font-weight="700">3</tspan><tspan x="44">Critério contratual: É a régua contratual, não uma quarta medição. O órgão contratante continua responsável pelo ateste.</tspan></text>
<g id="medicao-parede-d-carimbo"><rect x="8" y="524" width="1184" height="28" fill="#ffffff" stroke="#dfe4e6"/><line x1="402.7" y1="524" x2="402.7" y2="552" stroke="#dfe4e6"/><line x1="797.3" y1="524" x2="797.3" y2="552" stroke="#dfe4e6"/><text x="16" y="542" font-size="11" fill="#5d6a7a">P3 · medicao-parede · rev. R00</text><text x="410.7" y="542" font-size="11" fill="#5d6a7a">Barras proporcionais à área em m²</text><text x="805.3" y="542" font-size="11" fill="#5d6a7a">Exemplo demonstrativo · sem obra de cliente</text></g>
