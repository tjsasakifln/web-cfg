<text x="310" y="146" font-size="11" fill="#5d6a7a" text-anchor="end">Alvenaria declarada como executada no período</text>
<text x="1058" y="137" font-size="12" font-weight="650">120 m²</text>
<rect x="330" y="180" width="540" height="44" fill="#f3f4f5" stroke="#071a31" stroke-width="1.2"/>
<text x="310" y="200" font-size="12" font-weight="650" text-anchor="end">Medido no boletim</text>
<text x="310" y="216" font-size="11" fill="#5d6a7a" text-anchor="end">Boletim de medição do período</text>
<text x="878" y="207" font-size="12" font-weight="650">90 m²</text>
<rect x="330" y="250" width="480" height="44" fill="#2d6f2d"/>
<text x="310" y="270" font-size="12" font-weight="650" text-anchor="end">Evidenciado por fotos datadas</text>
<text x="310" y="286" font-size="11" fill="#5d6a7a" text-anchor="end">Fotos contemporâneas com data e local</text>
<text x="818" y="277" font-size="12" font-weight="650">80 m²</text>
<line x1="810" y1="100" x2="810" y2="304" stroke="#5d6a7a" stroke-width="0.6" stroke-dasharray="4 3"/>
<line x1="870" y1="100" x2="870" y2="304" stroke="#5d6a7a" stroke-width="0.6" stroke-dasharray="4 3"/>
<line x1="1050" y1="100" x2="1050" y2="304" stroke="#5d6a7a" stroke-width="0.6" stroke-dasharray="4 3"/>
<g stroke="#5d6a7a" stroke-width="0.6" fill="#5d6a7a"><line x1="870" y1="320" x2="1050" y2="320"/><path d="M867 323L873 317"/><path d="M1047 323L1053 317"/><text x="960" y="333" font-size="11" text-anchor="middle">30 m²</text><line x1="810" y1="320" x2="870" y2="320"/><path d="M807 323L813 317"/><path d="M867 323L873 317"/><text x="840" y="333" font-size="11" text-anchor="middle">10 m²</text></g>
