<text x="930" y="384" font-size="11" fill="#5d6a7a" text-anchor="middle">100</text>
<line x1="1050" y1="364" x2="1050" y2="370" stroke="#071a31" stroke-width="0.6"/>
<text x="1050" y="384" font-size="11" fill="#5d6a7a" text-anchor="middle">120 m²</text>
<text x="330" y="404" font-size="12" font-weight="650">Régua · critério contratual: o contrato manda medir a área de projeção da parede</text>
