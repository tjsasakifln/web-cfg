<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="medicao-parede-desktop-title medicao-parede-desktop-desc" font-family="Archivo Var, Arial, Helvetica, sans-serif" fill="#071a31">
<title id="medicao-parede-desktop-title">Prancha P3 · Mesma parede, quatro números · exemplo demonstrativo</title>
<desc id="medicao-parede-desktop-desc">Três barras proporcionais: executado declarado 120 m², medido no boletim 90 m², evidenciado por fotos datadas 80 m². Régua do critério contratual: área de projeção da parede. Faixas anotadas: diferença medido × executado de 30 m² e lacuna de prova de 10 m². Premissas sintéticas; exemplo demonstrativo, sem obra de cliente. Procedência: data/demonstrative/plates/medicao-parede.v1.json.</desc>
<rect x="0" y="0" width="1200" height="560" fill="#ffffff"/>
<rect x="8" y="8" width="1184" height="544" fill="#ffffff" stroke="#dfe4e6"/>
<text x="28" y="40" font-size="16" font-weight="650">Mesma parede, quatro números: executado, medido, evidenciado e o critério contratual</text>
<text x="1172" y="40" font-size="11" fill="#5d6a7a" text-anchor="end">Dados demonstrativos · revisão R00</text>
<defs><pattern id="medicao-parede-d-h5d6a" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V6" stroke="#5d6a7a" stroke-width="0.5"/></pattern></defs>
<text x="28" y="72" font-size="12" font-weight="650">Alvenaria do período · premissas sintéticas · áreas em m² · o ateste permanece com o órgão contratante</text>
<rect x="870" y="100" width="180" height="204" fill="#ced62a" fill-opacity=".35"/>
<rect x="810" y="100" width="60" height="204" fill="#ced62a" fill-opacity=".35"/>
