<text x="358" y="150" font-size="13" font-weight="650">Detalhes</text>
<text x="358" y="176" font-size="12">Ligações e pontos que a</text>
<text x="358" y="193" font-size="12">planta geral não resolve</text>
<text x="358" y="210" font-size="12">sozinha.</text>
<g stroke="#5d6a7a" stroke-width="0.6" fill="none"><line x1="588" y1="179" x2="612" y2="179"/><path d="M606 175L612 179L606 183"/></g>
<g transform="translate(582 106)"><circle r="11" fill="#071a31"/><text y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text></g>
<rect x="616" y="104" width="240" height="150" fill="#ffffff" stroke="#071a31" stroke-width="1.2"/>
<text x="630" y="126" font-size="11" fill="#5d6a7a">PE-03</text>
<text x="630" y="150" font-size="13" font-weight="650">Especificações</text>
<text x="630" y="176" font-size="12">Materiais, critérios e limites</text>
<text x="630" y="193" font-size="12">nomeados para orçar e executar</text>
<text x="630" y="210" font-size="12">com a mesma referência.</text>
