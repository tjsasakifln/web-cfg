<text x="902" y="150" font-size="13" font-weight="650">Memória de cálculo</text>
<text x="902" y="176" font-size="12">Premissas, contas e recorte da</text>
<text x="902" y="193" font-size="12">disciplina contratada,</text>
<text x="902" y="210" font-size="12">conferíveis por terceiro.</text>
<g transform="translate(1126 106)"><circle r="11" fill="#071a31"/><text y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text></g>
