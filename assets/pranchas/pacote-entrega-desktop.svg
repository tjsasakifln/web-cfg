<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="pacote-entrega-desktop-title pacote-entrega-desktop-desc" font-family="Archivo Var, Arial, Helvetica, sans-serif" fill="#071a31">
<title id="pacote-entrega-desktop-title">Prancha PG · O que a elaboração devolve, por peça · exemplo demonstrativo</title>
<desc id="pacote-entrega-desktop-desc">Diagrama de estrutura com quatro peças: Plantas e cortes, Detalhes, Especificações, Memória de cálculo. A CONFENGE responde pela disciplina de engenharia expressamente contratada; a arquitetura de origem permanece com o autor. Software e modelos são método ou insumo: não ampliam atribuição profissional nem substituem ART. Não representa cliente, obra executada nem dimensionamento concluído. Exemplo demonstrativo, sem obra de cliente. Procedência: data/demonstrative/plates/elaboracao-complementar.v1.json.</desc>
<rect x="0" y="0" width="1200" height="400" fill="#ffffff"/>
<rect x="8" y="8" width="1184" height="384" fill="#ffffff" stroke="#dfe4e6"/>
<text x="28" y="40" font-size="16" font-weight="650">O que a elaboração devolve, por peça</text>
<text x="1172" y="40" font-size="11" fill="#5d6a7a" text-anchor="end">Dados demonstrativos · revisão R00</text>
<text x="28" y="72" font-size="12" font-weight="650">Quatro peças da disciplina contratada · a arquitetura de origem fica fora da autoria · sem dimensionamento nesta prancha</text>
<rect x="72" y="104" width="240" height="150" fill="#ffffff" stroke="#071a31" stroke-width="1.2"/>
<text x="86" y="126" font-size="11" fill="#5d6a7a">PE-01</text>
<text x="86" y="150" font-size="13" font-weight="650">Plantas e cortes</text>
<text x="86" y="176" font-size="12">Onde cada elemento fica e</text>
<text x="86" y="193" font-size="12">como a obra se lê no papel,</text>
<text x="86" y="210" font-size="12">na fase contratada.</text>
