<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-labelledby="interfaces-versoes-mobile-title interfaces-versoes-mobile-desc" font-family="Archivo Var, Arial, Helvetica, sans-serif" fill="#071a31">
<title id="interfaces-versoes-mobile-title">Prancha PH (móvel) · Como a produção conversa com a origem · exemplo demonstrativo</title>
<desc id="interfaces-versoes-mobile-desc">Fluxo de cima para baixo em quatro etapas: Insumos de origem → Disciplina delimitada → Interfaces → Versão devolvida. Ciclos, prazo e preço ficam na proposta. Exemplo demonstrativo, sem obra de cliente. Procedência: data/demonstrative/plates/elaboracao-complementar.v1.json.</desc>
<rect x="0" y="0" width="360" height="420" fill="#ffffff"/>
<rect x="8" y="8" width="344" height="404" fill="#ffffff" stroke="#dfe4e6"/>
<text x="28" y="40" font-size="16" font-weight="650">Insumos, disciplina, interfaces, versão</text>
<rect x="24" y="56" width="276" height="46" fill="#ffffff" stroke="#071a31" stroke-width="1.2"/>
<text x="36" y="74.4" font-size="12.5" font-weight="650">IV-A · Insumos de origem</text>
<text x="36" y="92.4" font-size="12.5" fill="#5d6a7a">Arquitetura, fase, finalidade</text>
<g stroke="#5d6a7a" stroke-width="0.6" fill="none"><line x1="162" y1="104" x2="162" y2="116"/><path d="M158 110L162 116L166 110"/></g>
<g transform="translate(314 79)"><circle r="11" fill="#071a31"/><text y="4.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text></g>
<rect x="24" y="118" width="276" height="46" fill="#ffffff" stroke="#071a31" stroke-width="1.2"/>
<text x="36" y="136.4" font-size="12.5" font-weight="650">IV-B · Disciplina delimitada</text>
<text x="36" y="154.4" font-size="12.5" fill="#5d6a7a">Recorte e responsável</text>
<g stroke="#5d6a7a" stroke-width="0.6" fill="none"><line x1="162" y1="166" x2="162" y2="178"/><path d="M158 172L162 178L166 172"/></g>
<rect x="24" y="180" width="276" height="46" fill="#ffffff" stroke="#071a31" stroke-width="1.2"/>
<text x="36" y="198.4" font-size="12.5" font-weight="650">IV-C · Interfaces</text>
<text x="36" y="216.4" font-size="12.5" fill="#5d6a7a">Um dono de cada lado</text>
<g stroke="#5d6a7a" stroke-width="0.6" fill="none"><line x1="162" y1="228" x2="162" y2="240"/><path d="M158 234L162 240L166 234"/></g>
<g transform="translate(314 203)"><circle r="11" fill="#071a31"/><text y="4.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text></g>
<rect x="24" y="242" width="276" height="46" fill="#ffffff" stroke="#2d6f2d" stroke-width="2"/>
<text x="36" y="260.4" font-size="12.5" fill="#2d6f2d" font-weight="650">IV-D · Versão devolvida</text>
<text x="36" y="278.4" font-size="12.5" fill="#5d6a7a">Data, responsável, o que mudou</text>
<text x="20" y="314" font-size="12.5" fill="#5d6a7a">1 autor de origem decide o que altera</text>
<text x="20" y="331" font-size="12.5" fill="#5d6a7a">2 pendência volta a quem responde</text>
<g id="interfaces-versoes-m-carimbo"><rect x="8" y="384" width="344" height="28" fill="#ffffff" stroke="#dfe4e6"/><line x1="72" y1="384" x2="72" y2="412" stroke="#dfe4e6"/><line x1="192" y1="384" x2="192" y2="412" stroke="#dfe4e6"/><text x="16" y="395" font-size="12.5" fill="#5d6a7a">PH-M</text><text x="16" y="408" font-size="12.5" fill="#5d6a7a">rev. R00</text><text x="80" y="395" font-size="12.5" fill="#5d6a7a">Sem escala</text><text x="80" y="408" font-size="12.5" fill="#5d6a7a">fluxo</text><text x="200" y="395" font-size="12.5" fill="#5d6a7a">Exemplo demonstrativo</text><text x="200" y="408" font-size="12.5" fill="#5d6a7a">sem obra de cliente</text></g>
