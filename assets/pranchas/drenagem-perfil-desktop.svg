<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="drenagem-perfil-desktop-title drenagem-perfil-desktop-desc" font-family="Archivo Var, Arial, Helvetica, sans-serif" fill="#071a31">
<title id="drenagem-perfil-desktop-title">Prancha P2 · Perfil de drenagem MH-01 a MH-02 e camadas da faixa PV-01 · exemplo demonstrativo</title>
<desc id="drenagem-perfil-desktop-desc">Perfil do trecho DR-01 entre os poços MH-01 (estaca 10,00 m, invert 12,80 m) e MH-02 (estaca 30,00 m, invert desenhado 12,35 m), comprimento 20,00 m. No estado R00 a planilha traz 12,50 m em MH-02, divergência de 0,15 m, marcada em faixa. Detalhe das camadas da faixa: sub-base 0,15 m, base 0,12 m, capa 0,04 m. Exemplo demonstrativo, sem obra de cliente. Procedência: data/demonstrative/infrastructure-pilot/source.v1.json, data/demonstrative/infrastructure-pilot/consumption.v1.json.</desc>
