<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="aditivo-limite-desktop-title aditivo-limite-desktop-desc" font-family="Archivo Var, Arial, Helvetica, sans-serif" fill="#071a31">
<title id="aditivo-limite-desktop-title">Prancha P5 · Linha do tempo do contrato e o limite do art. 125 · exemplo demonstrativo</title>
<desc id="aditivo-limite-desktop-desc">Linha do tempo de 24 meses de um contrato hipotético de R$ 10.000.000: TA-01 no mês 6 (12%), TA-02 no mês 11 (18%) e um aditivo proposto no mês 15 que levaria o acumulado a 27%, 2% acima do limite de 25% para obra nova; a faixa até 50% só vale para reforma. Premissas sintéticas; exemplo demonstrativo, sem obra de cliente. Procedência: data/demonstrative/plates/aditivo-limite.v1.json.</desc>
<rect x="0" y="0" width="1200" height="560" fill="#ffffff"/>
<rect x="8" y="8" width="1184" height="544" fill="#ffffff" stroke="#dfe4e6"/>
<text x="28" y="40" font-size="16" font-weight="650">Linha do tempo do contrato e o limite do art. 125</text>
<text x="1172" y="40" font-size="11" fill="#5d6a7a" text-anchor="end">Dados demonstrativos · revisão R00</text>
<defs><pattern id="aditivo-limite-d-h5d6a" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V6" stroke="#5d6a7a" stroke-width="0.5"/></pattern></defs>
<text x="28" y="72" font-size="12" font-weight="650">Contrato hipotético de obra nova · valor inicial atualizado R$ 10.000.000 · vigência 24 meses · percentuais acumulados</text>
<rect x="120" y="120" width="920" height="140" fill="#ced62a" fill-opacity=".35"/>
<line x1="120" y1="260" x2="1040" y2="260" stroke="#071a31" stroke-width="1.2"/>
<line x1="120" y1="120" x2="1040" y2="120" stroke="#5d6a7a" stroke-width="0.6" stroke-dasharray="4 3"/>
<text x="128" y="276" font-size="12" font-weight="650">25% · limite para obra, serviço ou compra</text>
<text x="128" y="136" font-size="11" fill="#5d6a7a">50% · só para reforma de edifício ou de equipamento</text>
<line x1="120" y1="400" x2="1040" y2="400" stroke="#071a31" stroke-width="1.2"/>
<line x1="120" y1="400" x2="120" y2="110" stroke="#5d6a7a" stroke-width="0.6"/>
<line x1="120" y1="400" x2="120" y2="406" stroke="#071a31" stroke-width="0.6"/>
<text x="120" y="420" font-size="11" fill="#5d6a7a" text-anchor="middle">0</text>
<line x1="350" y1="400" x2="350" y2="406" stroke="#071a31" stroke-width="0.6"/>
<text x="350" y="420" font-size="11" fill="#5d6a7a" text-anchor="middle">6</text>
<line x1="580" y1="400" x2="580" y2="406" stroke="#071a31" stroke-width="0.6"/>
<text x="580" y="420" font-size="11" fill="#5d6a7a" text-anchor="middle">12</text>
<line x1="810" y1="400" x2="810" y2="406" stroke="#071a31" stroke-width="0.6"/>
<text x="810" y="420" font-size="11" fill="#5d6a7a" text-anchor="middle">18</text>
<line x1="1040" y1="400" x2="1040" y2="406" stroke="#071a31" stroke-width="0.6"/>
<text x="1040" y="420" font-size="11" fill="#5d6a7a" text-anchor="middle">24</text>
<text x="1040" y="436" font-size="11" fill="#5d6a7a" text-anchor="end">meses desde a assinatura</text>
<line x1="114" y1="400" x2="120" y2="400" stroke="#5d6a7a" stroke-width="0.6"/>
<text x="110" y="404" font-size="11" fill="#5d6a7a" text-anchor="end">0%</text>
<line x1="114" y1="344" x2="120" y2="344" stroke="#5d6a7a" stroke-width="0.6"/>
<text x="110" y="348" font-size="11" fill="#5d6a7a" text-anchor="end">10%</text>
<line x1="114" y1="288" x2="120" y2="288" stroke="#5d6a7a" stroke-width="0.6"/>
<text x="110" y="292" font-size="11" fill="#5d6a7a" text-anchor="end">20%</text>
<line x1="114" y1="232" x2="120" y2="232" stroke="#5d6a7a" stroke-width="0.6"/>
<text x="110" y="236" font-size="11" fill="#5d6a7a" text-anchor="end">30%</text>
<line x1="114" y1="176" x2="120" y2="176" stroke="#5d6a7a" stroke-width="0.6"/>
<text x="110" y="180" font-size="11" fill="#5d6a7a" text-anchor="end">40%</text>
<line x1="114" y1="120" x2="120" y2="120" stroke="#5d6a7a" stroke-width="0.6"/>
<text x="110" y="124" font-size="11" fill="#5d6a7a" text-anchor="end">50%</text>
<rect x="695" y="248.8" width="345" height="11.2" fill="url(#aditivo-limite-d-h5d6a)" stroke="#5d6a7a" stroke-width="0.6"/>
<path d="M120 400L350 400L350 332.8L541.7 332.8L541.7 299.2" fill="none" stroke="#071a31" stroke-width="2"/>
<path d="M541.7 299.2L695 299.2L695 248.8L1040 248.8" fill="none" stroke="#2d6f2d" stroke-width="2" stroke-dasharray="6 4"/>
<circle cx="350" cy="332.8" r="4" fill="#071a31"/>
<text x="358" y="308.8" font-size="12" font-weight="650">TA-01 · +12% = 12%</text>
<text x="358" y="323.8" font-size="11" fill="#5d6a7a">mês 6 · R$ 1.200.000</text>
<circle cx="541.7" cy="299.2" r="4" fill="#071a31"/>
<text x="549.7" y="275.2" font-size="12" font-weight="650">TA-02 · +6% = 18%</text>
<text x="549.7" y="290.2" font-size="11" fill="#5d6a7a">mês 11 · R$ 600.000</text>
<circle cx="695" cy="248.8" r="4" fill="#2d6f2d"/>
<text x="703" y="224.8" font-size="12" fill="#2d6f2d" font-weight="650">TA-03 · +9% = 27%</text>
<text x="703" y="239.8" font-size="11" fill="#5d6a7a">mês 15 · R$ 900.000</text>
<g stroke="#5d6a7a" stroke-width="0.6"><line x1="663.8" y1="225.4" x2="695" y2="248.8"/><circle cx="695" cy="248.8" r="1.6" fill="#5d6a7a"/></g>
<g transform="translate(655 218.8)"><circle r="11" fill="#071a31"/><text y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text></g>
<g stroke="#5d6a7a" stroke-width="0.6"><line x1="901.1" y1="207.7" x2="867.5" y2="254.4"/><circle cx="867.5" cy="254.4" r="1.6" fill="#5d6a7a"/></g>
<g transform="translate(907.5 198.8)"><circle r="11" fill="#071a31"/><text y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text></g>
<g stroke="#5d6a7a" stroke-width="0.6"><line x1="420" y1="245" x2="420" y2="260"/><circle cx="420" cy="260" r="1.6" fill="#5d6a7a"/></g>
<g transform="translate(420 234)"><circle r="11" fill="#071a31"/><text y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text></g>
<text x="28" y="446" font-size="12" font-weight="650">Chamadas</text><text x="28" y="464" font-size="11"><tspan font-weight="700">1</tspan><tspan x="44">Aditivo proposto (TA-03): 18% formalizados + 9% pedidos = 27% do valor inicial atualizado. Não é direito automático a termo.</tspan></text><text x="28" y="482" font-size="11"><tspan font-weight="700">2</tspan><tspan x="44">Excesso sobre o limite de obra nova: 27 − 25 = 2% (R$ 200.000). O dossiê registra o excesso e pede revisão de escopo ou de enquadramento, não força o termo.</tspan></text><text x="28" y="500" font-size="11"><tspan font-weight="700">3</tspan><tspan x="44">Limites do art. 125 da Lei 14.133/2021: 25% para obra, serviço ou compra; 50% só para reforma de edifício ou de equipamento. Acréscimos e supressões em trilhas separadas.</tspan></text>
<g id="aditivo-limite-d-carimbo"><rect x="8" y="524" width="1184" height="28" fill="#ffffff" stroke="#dfe4e6"/><line x1="402.7" y1="524" x2="402.7" y2="552" stroke="#dfe4e6"/><line x1="797.3" y1="524" x2="797.3" y2="552" stroke="#dfe4e6"/><text x="16" y="542" font-size="11" fill="#5d6a7a">P5 · aditivo-limite · rev. R00</text><text x="410.7" y="542" font-size="11" fill="#5d6a7a">Meses × percentual acumulado</text><text x="805.3" y="542" font-size="11" fill="#5d6a7a">Exemplo demonstrativo · sem obra de cliente</text></g>
</svg>
