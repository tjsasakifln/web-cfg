<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-labelledby="drenagem-rede-mobile-title drenagem-rede-mobile-desc" font-family="Archivo Var, Arial, Helvetica, sans-serif" fill="#071a31">
<title id="drenagem-rede-mobile-title">Prancha PC (móvel) · Rede DR-01 e faixa PV-01 · exemplo demonstrativo</title>
<desc id="drenagem-rede-mobile-desc">Planta da faixa PV-01 de 40,00 por 7,00 m com a rede DR-01 DN 400 de 20,00 m entre MH-01 (invert 12,80 m) e MH-02 (invert 12,35 m); IN-01 sem diâmetro nem cota declarados. Exemplo demonstrativo, sem obra de cliente. Procedência: data/demonstrative/infrastructure-pilot/source.v1.json, data/demonstrative/infrastructure-pilot/consumption.v1.json.</desc>
