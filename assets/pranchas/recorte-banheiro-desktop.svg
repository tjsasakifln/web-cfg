<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="recorte-banheiro-desktop-title recorte-banheiro-desktop-desc" font-family="Archivo Var, Arial, Helvetica, sans-serif" fill="#071a31">
<title id="recorte-banheiro-desktop-title">Prancha P1 · Recorte de banheiro RM-01: planta e elevação leste W-02 · exemplo demonstrativo</title>
<desc id="recorte-banheiro-desktop-desc">Planta do recorte de 2,40 por 1,80 m com paredes W-01 a W-04, porta D-01 na parede norte, janela WN-01 e viga B-01 na parede leste, poço hidrossanitário HS-01 a oeste. Elevação leste W-02 de 1,80 por 2,60 m: janela do peitoril 1,40 m à verga 2,30 m, viga com fundo em 2,20 m, sobreposição de 0,10 m no estado R00. Memória: 21,84 menos 1,68 da porta e 0,56 da janela igual a 19,60 m², item ORC-PAR-01. Exemplo demonstrativo. Procedência: data/demonstrative/private-project-pilot/source.v1.json, data/demonstrative/private-project-pilot/consumption.v1.json.</desc>
