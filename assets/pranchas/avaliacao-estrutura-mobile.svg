<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-labelledby="avaliacao-estrutura-mobile-title avaliacao-estrutura-mobile-desc" font-family="Archivo Var, Arial, Helvetica, sans-serif" fill="#071a31">
<title id="avaliacao-estrutura-mobile-title">Prancha P4 (móvel) · Estrutura da análise de avaliação · exemplo demonstrativo</title>
<desc id="avaliacao-estrutura-mobile-desc">Fluxo de cima para baixo em cinco etapas: Objeto → Finalidade e data → Método → Dados e fontes → Conclusão delimitada. Método comparativo ou evolutivo, conforme o caso. Sem valor monetário. Exemplo demonstrativo, sem obra de cliente. Procedência: data/demonstrative/plates/avaliacao-estrutura.v1.json.</desc>
<rect x="0" y="0" width="360" height="420" fill="#ffffff"/>
<rect x="8" y="8" width="344" height="404" fill="#ffffff" stroke="#dfe4e6"/>
<text x="28" y="40" font-size="16" font-weight="650">Estrutura da análise de avaliação</text>
<rect x="24" y="52" width="276" height="42" fill="#ffffff" stroke="#071a31" stroke-width="1.2"/>
<text x="36" y="69" font-size="12.5" font-weight="650">AV-01 · Objeto</text>
<text x="36" y="86" font-size="12.5" fill="#5d6a7a">O que está sendo avaliado</text>
<g stroke="#5d6a7a" stroke-width="0.6" fill="none"><line x1="162" y1="96" x2="162" y2="106"/><path d="M158 100L162 106L166 100"/></g>
