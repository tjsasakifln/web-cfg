<g stroke="#5d6a7a" stroke-width="0.6" fill="none"><line x1="162" y1="152" x2="162" y2="162"/><path d="M158 156L162 162L166 156"/></g>
<rect x="24" y="164" width="276" height="42" fill="#ffffff" stroke="#071a31" stroke-width="1.2"/>
<text x="36" y="181" font-size="12.5" font-weight="650">AV-03 · Método</text>
<text x="36" y="198" font-size="12.5" fill="#5d6a7a">Comparativo ou evolutivo</text>
<g stroke="#5d6a7a" stroke-width="0.6" fill="none"><line x1="162" y1="208" x2="162" y2="218"/><path d="M158 212L162 218L166 212"/></g>
<g transform="translate(314 185)"><circle r="11" fill="#071a31"/><text y="4.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text></g>
