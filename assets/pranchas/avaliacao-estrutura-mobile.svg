<rect x="24" y="276" width="276" height="42" fill="#ffffff" stroke="#2d6f2d" stroke-width="2"/>
<text x="36" y="293" font-size="12.5" fill="#2d6f2d" font-weight="650">AV-05 · Conclusão delimitada</text>
<text x="36" y="310" font-size="12.5" fill="#5d6a7a">Limites, data e ressalvas</text>
<g transform="translate(314 297)"><circle r="11" fill="#071a31"/><text y="4.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text></g>
