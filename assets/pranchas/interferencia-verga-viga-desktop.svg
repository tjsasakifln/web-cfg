<title id="interferencia-verga-viga-desktop-title">Prancha PA · Interferência WN-01 × B-01 na parede leste W-02, estado R00 e R01 · exemplo demonstrativo</title>
<desc id="interferencia-verga-viga-desktop-desc">Duas elevações da parede W-02 de 1,80 por 2,60 m. No estado R00 a verga da janela WN-01 está em 2,30 m e o fundo da viga B-01 em 2,20 m, sobreposição de 0,10 m marcada em faixa. Na revisão R01 a verga desce para 2,10 m, folga de 0,10 m. Registro CF-GEO-01: Parede leste W-02, interface WN-01 × B-01; estado corrigido na revisão R01. Exemplo demonstrativo, sem obra de cliente. Procedência: data/demonstrative/private-project-pilot/source.v1.json, data/demonstrative/private-project-pilot/consumption.v1.json.</desc>
