<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="drenagem-rede-desktop-title drenagem-rede-desktop-desc" font-family="Archivo Var, Arial, Helvetica, sans-serif" fill="#071a31">
<title id="drenagem-rede-desktop-title">Prancha PC · Rede de drenagem MH-01, DR-01, MH-02 e faixa PV-01 do recorte de loteamento · exemplo demonstrativo</title>
<desc id="drenagem-rede-desktop-desc">Planta da faixa PV-01 de 40,00 por 7,00 m com a rede DR-01 DN 400 de 20,00 m entre os poços MH-01 (estaca 10,00, invert 12,80 m) e MH-02 (estaca 30,00, invert 12,35 m), declive geométrico 0,0225 m/m. Boca de lobo IN-01 na estaca 20,00 sem diâmetro nem cota declarados. Camadas da faixa: sub-base 0,15, base 0,12, capa 0,04 m. Exemplo demonstrativo, sem obra de cliente. Procedência: data/demonstrative/infrastructure-pilot/source.v1.json, data/demonstrative/infrastructure-pilot/consumption.v1.json.</desc>
<rect x="0" y="0" width="1200" height="600" fill="#ffffff"/>
<rect x="8" y="8" width="1184" height="584" fill="#ffffff" stroke="#dfe4e6"/>
<text x="28" y="40" font-size="16" font-weight="650">Projeto complementar: rede e pavimento com cada elemento identificado, cotado e ligado à planilha</text>
<text x="1172" y="40" font-size="11" fill="#5d6a7a" text-anchor="end">Dados demonstrativos · revisão R01</text>
<defs><pattern id="drenagem-rede-d-h5d6a" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V6" stroke="#5d6a7a" stroke-width="0.5"/></pattern></defs>
<text x="100" y="80" font-size="12" font-weight="650">Planta · faixa PV-01 e rede DR-01 · elementos identificados · norte para cima</text>
<rect x="110" y="130" width="600" height="210" fill="#f3f4f5" stroke="#071a31" stroke-width="1.2"/><rect x="110" y="130" width="600" height="12" fill="url(#drenagem-rede-d-h5d6a)"/><rect x="110" y="328" width="600" height="12" fill="url(#drenagem-rede-d-h5d6a)"/><line x1="260" y1="235" x2="560" y2="235" stroke="#2d6f2d" stroke-width="2"/><circle cx="260" cy="235" r="9" fill="#ffffff" stroke="#071a31" stroke-width="1.2"/><text x="260" y="124" font-size="12" font-weight="650" text-anchor="middle">MH-01</text><circle cx="560" cy="235" r="9" fill="#ffffff" stroke="#071a31" stroke-width="1.2"/><text x="560" y="124" font-size="12" font-weight="650" text-anchor="middle">MH-02</text><rect x="405" y="325" width="10" height="15" fill="none" stroke="#5d6a7a" stroke-width="1.2" stroke-dasharray="3 2"/><line x1="410" y1="235" x2="410" y2="325" stroke="#5d6a7a" stroke-width="0.6" stroke-dasharray="3 2"/><text x="410" y="357" font-size="12" fill="#5d6a7a" font-weight="650" text-anchor="middle">IN-01</text><text x="410" y="322" font-size="12" font-weight="650" text-anchor="middle">PV-01</text><g stroke="#5d6a7a" stroke-width="0.6"><line x1="110" y1="340" x2="110" y2="345"/><line x1="260" y1="340" x2="260" y2="345"/><line x1="410" y1="340" x2="410" y2="345"/><line x1="560" y1="340" x2="560" y2="345"/><line x1="710" y1="340" x2="710" y2="345"/></g>
<text x="410" y="223" font-size="12" font-weight="650" text-anchor="middle">DR-01 · DN 400 · 20,00 m · i 0,0225 m/m</text>
<text x="260" y="259" font-size="11" text-anchor="middle">inv. 12,80</text>
<text x="560" y="259" font-size="11" text-anchor="middle">inv. 12,35</text>
<g stroke="#5d6a7a" stroke-width="0.6" fill="#5d6a7a"><line x1="110" y1="380" x2="260" y2="380"/><path d="M107 383L113 377"/><path d="M257 383L263 377"/><line x1="110" y1="340" x2="110" y2="382"/><line x1="260" y1="340" x2="260" y2="382"/><text x="185" y="393" font-size="11" text-anchor="middle">10,00</text><line x1="260" y1="380" x2="410" y2="380"/><path d="M257 383L263 377"/><path d="M407 383L413 377"/><text x="335" y="393" font-size="11" text-anchor="middle">10,00</text><line x1="410" y1="380" x2="560" y2="380"/><path d="M407 383L413 377"/><path d="M557 383L563 377"/><text x="485" y="393" font-size="11" text-anchor="middle">10,00</text><line x1="560" y1="380" x2="710" y2="380"/><path d="M557 383L563 377"/><path d="M707 383L713 377"/><text x="635" y="393" font-size="11" text-anchor="middle">10,00</text><line x1="110" y1="404" x2="710" y2="404"/><path d="M107 407L113 401"/><path d="M707 407L713 401"/><text x="410" y="417" font-size="11" text-anchor="middle">40,00 m · estaqueamento</text><line x1="90" y1="130" x2="90" y2="340"/><path d="M87 133L93 127"/><path d="M87 343L93 337"/><line x1="110" y1="130" x2="88" y2="130"/><line x1="110" y1="340" x2="88" y2="340"/><text x="86" y="235" font-size="11" text-anchor="middle" transform="rotate(-90 86 235)">7,00 m</text></g>
<text x="118" y="326" font-size="11" fill="#5d6a7a">greide 100,00</text>
<text x="702" y="326" font-size="11" fill="#5d6a7a" text-anchor="end">greide 99,40</text>
<g stroke="#5d6a7a" stroke-width="0.6"><line x1="223.7" y1="271.1" x2="253" y2="241"/><circle cx="253" cy="241" r="1.6" fill="#5d6a7a"/></g>
<g transform="translate(216 279)"><circle r="11" fill="#071a31"/><text y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text></g>
<g stroke="#5d6a7a" stroke-width="0.6"><line x1="450" y1="347.4" x2="416" y2="332"/><circle cx="416" cy="332" r="1.6" fill="#5d6a7a"/></g>
<g transform="translate(460 352)"><circle r="11" fill="#071a31"/><text y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text></g>
<g stroke="#5d6a7a" stroke-width="0.6"><line x1="739" y1="265" x2="708" y2="265"/><circle cx="708" cy="265" r="1.6" fill="#5d6a7a"/></g>
<g transform="translate(750 265)"><circle r="11" fill="#071a31"/><text y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text></g>
<text x="790" y="128" font-size="12" font-weight="650">Elementos da disciplina entregue</text><text x="790" y="145" font-size="11"><tspan font-weight="700">1</tspan><tspan x="806">Rede: MH-01 est. 10,00 (inv. 12,80) → DR-01 DN 400, 20,00 m,</tspan></text><text x="790" y="162" font-size="11" fill="#5d6a7a">i 0,0225 m/m → MH-02 est. 30,00 (inv. 12,35). Declive geométrico.</text><text x="790" y="179" font-size="11"><tspan font-weight="700">2</tspan><tspan x="806">IN-01 est. 20,00: boca de lobo sem diâmetro nem cota declarados;</tspan></text><text x="790" y="196" font-size="11" fill="#5d6a7a">permanece pedido de informação, não falha comprovada.</text><text x="790" y="213" font-size="11"><tspan font-weight="700">3</tspan><tspan x="806">Faixa PV-01 40,00 × 7,00 m = 280,00 m²: sub-base 0,15,</tspan></text><text x="790" y="230" font-size="11" fill="#5d6a7a">base 0,12 e capa 0,04 m; greide 100,00 → 99,40, i 0,0150 m/m.</text><text x="790" y="247" font-size="11">Cada elemento tem id, cota e prancha (INF-DR-R01, INF-PV-R01);</text><text x="790" y="264" font-size="11">quantidades e planilha saem da mesma fonte (Q-TUB-01, Q-PAV-01).</text>
<text x="100" y="487" font-size="11" fill="#5d6a7a">Volumes e comprimentos são geométricos: espessura não é dimensionamento de pavimento e declive não é capacidade hidráulica.</text><text x="100" y="504" font-size="11">A disciplina sai com plantas, cotas, memória e a matriz de interfaces com a arquitetura de origem, que permanece com o autor.</text>
<g id="drenagem-rede-d-carimbo"><rect x="8" y="564" width="1184" height="28" fill="#ffffff" stroke="#dfe4e6"/><line x1="402.7" y1="564" x2="402.7" y2="592" stroke="#dfe4e6"/><line x1="797.3" y1="564" x2="797.3" y2="592" stroke="#dfe4e6"/><text x="16" y="582" font-size="11" fill="#5d6a7a">PC · drenagem-rede · rev. R01</text><text x="410.7" y="582" font-size="11" fill="#5d6a7a">Escala indicativa · cotas em m · DN em mm</text><text x="805.3" y="582" font-size="11" fill="#5d6a7a">Exemplo demonstrativo · sem obra de cliente</text></g>
</svg>
