<text x="446" y="416" font-size="11" fill="#5d6a7a">janela causal alheia à contratada</text>
<rect x="640" y="408" width="18" height="9" fill="url(#janela-causal-d-h5d6a)"/>
<text x="666" y="416" font-size="11" fill="#5d6a7a">causa concorrente da contratada</text>
<g stroke="#5d6a7a" stroke-width="0.6"><line x1="310.1" y1="181.2" x2="430.2" y2="194"/><circle cx="430.2" cy="194" r="1.6" fill="#5d6a7a"/></g>
<g transform="translate(299.2 180)"><circle r="11" fill="#071a31"/><text y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text></g>
<g stroke="#5d6a7a" stroke-width="0.6"><line x1="440.4" y1="118.4" x2="404.4" y2="134"/><circle cx="404.4" cy="134" r="1.6" fill="#5d6a7a"/></g>
<g transform="translate(450.4 114)"><circle r="11" fill="#071a31"/><text y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text></g>
<g stroke="#5d6a7a" stroke-width="0.6"><line x1="1154.2" y1="274.9" x2="1128" y2="288"/><circle cx="1128" cy="288" r="1.6" fill="#5d6a7a"/></g>
<g transform="translate(1164 270)"><circle r="11" fill="#071a31"/><text y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text></g>
<text x="28" y="440" font-size="12" font-weight="650">Chamadas</text><text x="28" y="458" font-size="11"><tspan font-weight="700">1</tspan><tspan x="44">Janela causal: Frente indisponível: desapropriação pendente do dia 41 ao dia 69 (28 dias), no caminho crítico, com ofícios e diário datados. Fundações só começam quando a frente é liberada.</tspan></text><text x="28" y="476" font-size="11"><tspan font-weight="700">2</tspan><tspan x="44">Causa concorrente: Mobilização parcial da contratada do dia 55 ao 62 (7 dias) dentro da janela; entra na conta contra a contratada. Dias imputáveis ao órgão: 21 (28 − 7 = 21).</tspan></text><text x="28" y="494" font-size="11"><tspan font-weight="700">3</tspan><tspan x="44">Atraso observado de 34 dias no fim: 28 explicados pela janela e 6 da própria execução (34 − 28 = 6). O pedido de prorrogação pede os 21 dias, não os 34.</tspan></text>
<g id="janela-causal-d-carimbo"><rect x="8" y="524" width="1184" height="28" fill="#ffffff" stroke="#dfe4e6"/><line x1="402.7" y1="524" x2="402.7" y2="552" stroke="#dfe4e6"/><line x1="797.3" y1="524" x2="797.3" y2="552" stroke="#dfe4e6"/><text x="16" y="542" font-size="11" fill="#5d6a7a">P12 · janela-causal · rev. R00</text><text x="410.7" y="542" font-size="11" fill="#5d6a7a">Cronograma base × executado · dias corridos</text><text x="805.3" y="542" font-size="11" fill="#5d6a7a">Exemplo demonstrativo</text></g>
</svg>
