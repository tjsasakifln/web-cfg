<text x="339.2" y="100" font-size="11" fill="#5d6a7a" text-anchor="middle">dia 41</text>
<line x1="434.2" y1="106" x2="434.2" y2="330" stroke="#dfe4e6" stroke-width="1"/>
<text x="434.2" y="100" font-size="11" fill="#5d6a7a" text-anchor="middle">dia 69</text>
<line x1="1014.6" y1="106" x2="1014.6" y2="330" stroke="#dfe4e6" stroke-width="1"/>
<text x="1014.6" y="100" font-size="11" fill="#5d6a7a" text-anchor="middle">dia 240</text>
<line x1="1130" y1="106" x2="1130" y2="330" stroke="#dfe4e6" stroke-width="1"/>
<text x="1130" y="100" font-size="11" fill="#5d6a7a" text-anchor="middle">dia 274</text>
<line x1="28" y1="108" x2="1172" y2="108" stroke="#071a31" stroke-width="1.2"/>
<rect x="339.2" y="110" width="95" height="210" fill="#ced62a" fill-opacity=".35"/>
<rect x="386.7" y="110" width="23.8" height="210" fill="url(#janela-causal-d-h5d6a)"/>
<text x="40" y="140" font-size="12" font-weight="650">Terraplenagem</text>
<text x="40" y="156" font-size="11" fill="#5d6a7a">AT-01</text>
<rect x="203.4" y="128" width="132.4" height="9" fill="#ffffff" stroke="#071a31" stroke-width="1.2"/>
<rect x="203.4" y="142" width="132.4" height="9" fill="#2d6f2d"/>
<text x="40" y="188" font-size="12" font-weight="650">Fundações</text>
<text x="40" y="204" font-size="11" fill="#5d6a7a">AT-02</text>
<rect x="339.2" y="176" width="183.3" height="9" fill="#ffffff" stroke="#071a31" stroke-width="1.2"/>
<rect x="434.2" y="190" width="203.6" height="9" fill="#2d6f2d"/>
<text x="40" y="236" font-size="12" font-weight="650">Estrutura</text>
<text x="40" y="252" font-size="11" fill="#5d6a7a">AT-03</text>
<rect x="525.8" y="224" width="251.2" height="9" fill="#ffffff" stroke="#071a31" stroke-width="1.2"/>
<rect x="641.2" y="238" width="251.2" height="9" fill="#2d6f2d"/>
<text x="40" y="284" font-size="12" font-weight="650">Acabamentos</text>
<text x="40" y="300" font-size="11" fill="#5d6a7a">AT-04</text>
<rect x="780.4" y="272" width="234.2" height="9" fill="#ffffff" stroke="#071a31" stroke-width="1.2"/>
<rect x="895.8" y="286" width="234.2" height="9" fill="#2d6f2d"/>
<g stroke="#5d6a7a" stroke-width="0.6" fill="#5d6a7a"><line x1="339.2" y1="336" x2="434.2" y2="336"/><path d="M336.2 339L342.2 333"/><path d="M431.2 339L437.2 333"/><text x="386.7" y="349" font-size="11" text-anchor="middle">janela causal 28 dias (órgão)</text><line x1="386.7" y1="362" x2="410.4" y2="362"/><path d="M383.7 365L389.7 359"/><path d="M407.4 365L413.4 359"/><line x1="1014.6" y1="336" x2="1130" y2="336"/><path d="M1011.6 339L1017.6 333"/><path d="M1127 339L1133 333"/><text x="1072.3" y="349" font-size="11" text-anchor="middle">atraso observado 34 dias</text></g>
<text x="418.4" y="366" font-size="11" fill="#5d6a7a">concorrente 7 dias (contratada)</text>
<text x="200" y="396" font-size="12" fill="#2d6f2d" font-weight="650">Dias imputáveis ao órgão: 21 (28 − 7 = 21) · restam 6 dias da contratada (34 − 28 = 6)</text>
