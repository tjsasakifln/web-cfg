<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="janela-causal-desktop-title janela-causal-desktop-desc" font-family="Archivo Var, Arial, Helvetica, sans-serif" fill="#071a31">
<title id="janela-causal-desktop-title">Prancha P12 · Janela causal do atraso no caminho crítico · exemplo demonstrativo</title>
<desc id="janela-causal-desktop-desc">Cronograma de base e executado de uma obra hipotética com prazo de 240 dias: uma janela causal de 28 dias (frente indisponível, órgão) sobre o caminho crítico, 7 dias concorrentes da contratada, 21 dias imputáveis (28 − 7 = 21); atraso observado de 34 dias, 6 da própria execução. Exemplo demonstrativo. Procedência: data/demonstrative/plates/janela-causal.v1.json.</desc>
<rect x="0" y="0" width="1200" height="560" fill="#ffffff"/>
<rect x="8" y="8" width="1184" height="544" fill="#ffffff" stroke="#dfe4e6"/>
<text x="28" y="40" font-size="16" font-weight="650">Janela causal do atraso no caminho crítico: quantos dias são imputáveis</text>
<text x="1172" y="40" font-size="11" fill="#5d6a7a" text-anchor="end">Dados demonstrativos · revisão R00</text>
<defs><pattern id="janela-causal-d-h5d6a" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V6" stroke="#5d6a7a" stroke-width="0.5"/></pattern></defs>
<text x="28" y="72" font-size="12" font-weight="650">Obra hipotética · linha de base contra o executado, em dias corridos desde a ordem de serviço · prazo contratual 240 dias · atraso observado 34 dias</text>
<text x="40" y="100" font-size="12" fill="#5d6a7a" font-weight="650">Atividade</text>
