<text x="20" y="346" font-size="12.5" fill="#5d6a7a">Meses desde a assinatura · art. 125 da Lei 14.133/2021</text>
<text x="20" y="364" font-size="12.5" fill="#5d6a7a">Premissas sintéticas · o órgão decide o termo</text>
