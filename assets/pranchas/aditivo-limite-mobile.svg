<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-labelledby="aditivo-limite-mobile-title aditivo-limite-mobile-desc" font-family="Archivo Var, Arial, Helvetica, sans-serif" fill="#071a31">
<title id="aditivo-limite-mobile-title">Prancha P5 (móvel) · Linha do tempo do contrato e o limite do art. 125 · exemplo demonstrativo</title>
<desc id="aditivo-limite-mobile-desc">Percentual acumulado de aditivos ao longo de 24 meses: 12%, 18% e um aditivo proposto que chegaria a 27%, 2% acima do limite de 25% para obra nova. Exemplo demonstrativo, sem obra de cliente. Procedência: data/demonstrative/plates/aditivo-limite.v1.json.</desc>
