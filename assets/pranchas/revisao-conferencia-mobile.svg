<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-labelledby="revisao-conferencia-mobile-title revisao-conferencia-mobile-desc" font-family="Archivo Var, Arial, Helvetica, sans-serif" fill="#071a31">
<title id="revisao-conferencia-mobile-title">Prancha PB (móvel) · Conferência RF-01 e RF-02 · exemplo demonstrativo</title>
<desc id="revisao-conferencia-mobile-desc">Elevação da parede W-02 no estado R00 com a marcação RF-01 (verga 2,30 m invade a viga com fundo em 2,20 m; ação: verga a 2,10 m em R01) e a ficha RF-02 (HS-01 sem vão livre interno nem diâmetros; pedido de informação). Exemplo demonstrativo. Procedência: data/demonstrative/private-project-pilot/source.v1.json, data/demonstrative/private-project-pilot/consumption.v1.json.</desc>
<rect x="0" y="0" width="360" height="420" fill="#ffffff"/>
