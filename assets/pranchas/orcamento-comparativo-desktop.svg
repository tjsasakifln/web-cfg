<title id="orcamento-comparativo-desktop-title">Prancha P6 · Referência e proposta, item a item · exemplo demonstrativo</title>
<desc id="orcamento-comparativo-desktop-desc">Barras proporcionais, item a item, do orçamento de referência e da proposta: Escavação mecânica 240 contra 194 (−19%); Concreto estrutural 864 contra 846 (−2%); Administração local 180 contra 96 (−47%). O item em foco, Administração local, concentra o risco de exequibilidade. Premissas sintéticas; exemplo demonstrativo, sem obra de cliente. Procedência: data/demonstrative/plates/orcamento-comparativo.v1.json.</desc>
