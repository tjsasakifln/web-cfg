<text x="680" y="128" font-size="12" font-weight="650">Quesito · evidência · conclusão delimitada</text><text x="680" y="145" font-size="10.5">Q-01 · itens M-01, M-04</text><text x="680" y="162" font-size="10.5" fill="#5d6a7a">Quesito: As fissuras M-01 e M-04 têm geometria compatível com movimentação da estrutura?</text><text x="680" y="179" font-size="10.5" fill="#5d6a7a">Evidência: Fotos datadas; comprimento e abertura medidos; sem monitoramento.</text><text x="680" y="196" font-size="10.5">Conclusão delimitada: Geometria registrada. Origem não afirmada sem monitoramento e sem o projeto.</text><text x="680" y="213" font-size="10.5">Q-02 · itens M-02</text><text x="680" y="230" font-size="10.5" fill="#5d6a7a">Quesito: A mancha M-02 decorre de infiltração pela fachada ou por instalação interna?</text><text x="680" y="247" font-size="10.5" fill="#5d6a7a">Evidência: Foto datada e dimensão; sem ensaio de umidade.</text><text x="680" y="264" font-size="10.5">Conclusão delimitada: Umidade registrada. Fonte não afirmada sem ensaio ou abertura.</text><text x="680" y="281" font-size="10.5">Q-03 · itens M-03</text><text x="680" y="298" font-size="10.5" fill="#5d6a7a">Quesito: O desplacamento M-03 indica falha de aderência generalizada?</text><text x="680" y="315" font-size="10.5" fill="#5d6a7a">Evidência: Foto datada e área medida; percussão não realizada ao redor.</text><text x="680" y="332" font-size="10.5">Conclusão delimitada: Área registrada. Extensão não afirmada sem percussão.</text><text x="680" y="349" font-size="10.5" fill="#5d6a7a">Assistente da parte: organiza a evidência e formula o quesito.</text><text x="680" y="366" font-size="10.5">Perito do juízo: nomeado pelo juiz, produz o laudo. Advogado: tese e peças.</text>
