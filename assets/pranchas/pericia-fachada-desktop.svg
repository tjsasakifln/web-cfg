<title id="pericia-fachada-desktop-title">Prancha PE · Mapa de manifestações na fachada leste: quesito, evidência e conclusão delimitada · exemplo demonstrativo</title>
<desc id="pericia-fachada-desktop-desc">Elevação da fachada leste de 12,00 por 9,00 m com as quatro manifestações M-01 a M-04 e três quesitos: Q-01 sobre as fissuras M-01 e M-04, Q-02 sobre a mancha M-02, Q-03 sobre o desplacamento M-03, cada um com a evidência disponível e a conclusão delimitada ao que a evidência sustenta. O laudo é do perito do juízo. Exemplo demonstrativo. Procedência: data/demonstrative/plates/inspecao-fachada.v1.json.</desc>
