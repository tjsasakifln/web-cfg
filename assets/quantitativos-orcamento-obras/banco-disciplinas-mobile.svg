<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1420" role="img" aria-labelledby="title desc">
  <title id="title">Banco de quantitativos por disciplina e memória de medição comum</title>
  <desc id="desc">Quatro grupos mostram estrutura, arquitetura, instalações hidrossanitárias e instalações elétricas. Cada elemento identificado segue para uma memória com origem, revisão, critério, unidade e item de planilha.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2d6f2d"/></marker>
    <style>
      .bg{fill:#f3f7f8}.panel{fill:#fff;stroke:#14334d;stroke-width:1.5}.head{fill:#14334d}.link{fill:none;stroke:#2d6f2d;stroke-width:3;marker-end:url(#arrow)}.rule{stroke:#b9c8ce;stroke-width:1}.tag{fill:#e4f0e4;stroke:#2d6f2d;stroke-width:1.25}.h{font:700 17px Arial,sans-serif;fill:#fff}.t{font:700 18px Arial,sans-serif;fill:#102d46}.s{font:17px Arial,sans-serif;fill:#415965}.code{font:700 17px Consolas,monospace;fill:#245c24}.meta{font:17px Arial,sans-serif;fill:#536a75}.inv{font:17px Arial,sans-serif;fill:#dce7eb}
    </style>
  </defs>
  <rect class="bg" width="360" height="1420"/>
  <text class="t" x="20" y="34">ELEMENTOS POR DISCIPLINA</text>

  <g transform="translate(20 54)">
    <rect class="panel" width="320" height="142" rx="5"/><rect class="head" width="320" height="58" rx="5"/>
    <text class="h" x="14" y="25">ESTRUTURAS · P07</text>
    <text class="inv" x="14" y="48">ORIGEM E-STR-R02</text>
    <text class="s" x="14" y="84">pilar identificado</text>
    <text class="s" x="14" y="109">concreto · m³ | fôrma · m²</text>
    <text class="s" x="14" y="134">armadura · kg</text>
  </g>
  <g transform="translate(20 210)">
    <rect class="panel" width="320" height="142" rx="5"/><rect class="head" width="320" height="58" rx="5"/>
    <text class="h" x="14" y="25">ARQUITETURA · W12</text>
    <text class="inv" x="14" y="48">ORIGEM ARQ-R04</text>
    <text class="s" x="14" y="84">parede e aberturas</text>
    <text class="s" x="14" y="109">revestimento · m² | rodapé · m</text>
    <text class="s" x="14" y="134">esquadria · un</text>
  </g>
  <g transform="translate(20 366)">
    <rect class="panel" width="320" height="142" rx="5"/><rect class="head" width="320" height="58" rx="5"/>
    <text class="h" x="14" y="25">HIDROSSANITÁRIO · TQ-04</text>
    <text class="inv" x="14" y="48">ORIGEM HID-R03</text>
    <text class="s" x="14" y="84">trecho identificado</text>
    <text class="s" x="14" y="109">tubulação · m | conexão · un</text>
    <text class="s" x="14" y="134">equipamento · un</text>
  </g>
  <g transform="translate(20 522)">
    <rect class="panel" width="320" height="142" rx="5"/><rect class="head" width="320" height="58" rx="5"/>
    <text class="h" x="14" y="25">ELÉTRICA · QD-02 / C07</text>
    <text class="inv" x="14" y="48">ORIGEM ELE-R03</text>
    <text class="s" x="14" y="84">quadro e circuito</text>
    <text class="s" x="14" y="109">ponto · un | eletroduto · m</text>
    <text class="s" x="14" y="134">condutor · m</text>
  </g>

  <path class="link" d="M180 674V714"/>
  <text class="t" x="20" y="748">MEMÓRIA CONFERÍVEL</text>
  <g transform="translate(20 766)">
    <rect class="panel" width="320" height="494" rx="6"/>
    <rect class="head" width="320" height="50" rx="6"/>
    <text class="h" x="14" y="21">P07 · origem E-STR-R02</text>
    <text class="inv" x="14" y="42">revisão R02</text>
    <text class="s" x="14" y="80">1 · Concreto</text><text class="meta" x="24" y="104">b × h × H → m³</text><line class="rule" x1="14" y1="116" x2="306" y2="116"/>
    <text class="s" x="14" y="140">2 · Fôrma</text><text class="meta" x="24" y="164">Σ faces medidas × H → m²</text><line class="rule" x1="14" y1="176" x2="306" y2="176"/>
    <text class="s" x="14" y="200">3 · Armadura</text><text class="meta" x="24" y="224">Σ(n × comp. × kg/m) → kg</text><line class="rule" x1="14" y1="236" x2="306" y2="236"/>
    <text class="s" x="14" y="260">4 · Critério</text><text class="meta" x="24" y="284">seção, faces e barras do projeto</text><line class="rule" x1="14" y1="296" x2="306" y2="296"/>
    <text class="s" x="14" y="320">5 · Resultado</text><text class="meta" x="24" y="344">por elemento e por revisão</text><line class="rule" x1="14" y1="356" x2="306" y2="356"/>
    <text class="s" x="14" y="380">6 · Planilha</text><text class="meta" x="24" y="404">Q-STR-P07 + itens vinculados</text>
    <rect class="tag" x="14" y="425" width="292" height="25" rx="12"/><text class="code" x="25" y="444">ORIGEM · REVISÃO · CRITÉRIO</text>
    <rect class="tag" x="14" y="459" width="292" height="25" rx="12"/><text class="code" x="25" y="478">UNIDADE · ITEM DE PLANILHA</text>
  </g>
  <text class="meta" x="20" y="1290">A planilha mantém o item vinculado</text>
  <text class="meta" x="20" y="1315">à origem e à revisão.</text>
  <text class="meta" x="20" y="1344">Mudança de projeto abre nova memória.</text>
  <text class="meta" x="20" y="1373">Quantidades e composições dependem</text>
  <text class="meta" x="20" y="1398">dos documentos do empreendimento.</text>
</svg>
