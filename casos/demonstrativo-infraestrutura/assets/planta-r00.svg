<rect x="40.0" y="162.8" width="280.0" height="7.2" fill="url(#plan-R00-hatch)"/>
<text x="180.0" y="95.0" text-anchor="middle" font-size="12.5" font-weight="650" fill="#2d6f2d">DR-01 · 20,00 m · diâm. 400,00 mm</text>
<line x1="110.0" y1="107.0" x2="250.0" y2="107.0" stroke="#2d6f2d" stroke-width="2"/>
