<text x="40.0" y="34.0" font-size="12.5" fill="#5d6a7a">E0+000</text>
<text x="320.0" y="34.0" text-anchor="end" font-size="12.5" fill="#5d6a7a">E0+040</text>
<rect x="40.0" y="44.0" width="280.0" height="126.0" fill="#f3f4f5" stroke="#071a31" stroke-width="1.6"/>
