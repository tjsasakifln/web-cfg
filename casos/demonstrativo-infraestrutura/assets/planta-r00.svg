<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 324" role="img" aria-labelledby="plan-R00-title plan-R00-desc">
<title id="plan-R00-title">Planta do acesso PV-01 · estado original · R00</title>
<desc id="plan-R00-desc">Faixa PV-01 de 40,00 m por 7,00 m. Poço MH-01 em E0+010, boca IN-01 em E0+020, poço MH-02 em E0+030, trecho DR-01 com 20,00 m. R00: cota desenhada de MH-02 12,35 m; planilha 12,50 m. Exemplo demonstrativo, revisão R00.</desc>
