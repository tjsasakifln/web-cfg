<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 582 264" role="img" font-family="Archivo Var, Arial, Helvetica, sans-serif" aria-labelledby="prf-R01-title prf-R01-desc">
<title id="prf-R01-title">Perfil de invert DR-01 · versão demonstrativa corrigida · R01</title>
<desc id="prf-R01-desc">Trecho DR-01 de E0+010 a E0+030. Invert de montante 12,80 m. R01: desenho e planilha em 12,35 m na conexão MH-02. Declive geométrico, não capacidade hidráulica. Exemplo demonstrativo.</desc>
