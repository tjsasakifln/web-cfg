<text x="440.0" y="169.0" font-size="11" fill="#2d6f2d">desenho e planilha 12,35 m</text>
<line x1="72.0" y1="80.0" x2="432.0" y2="179.0" stroke="#071a31" stroke-width="2"/>
<circle cx="72.0" cy="80.0" r="6" fill="#ffffff" stroke="#071a31" stroke-width="1.2"/>
<circle cx="432.0" cy="179.0" r="6" fill="#edf5ec" stroke="#2d6f2d" stroke-width="1.2"/>
<text x="64.0" y="84.0" text-anchor="end" font-size="11" fill="#071a31">12,80</text>
<text x="440.0" y="195.0" font-size="11" fill="#2d6f2d">desenho 12,35 m</text>
<text x="72.0" y="230.0" font-size="11" fill="#071a31">E0+010 MH-01</text>
<text x="432.0" y="230.0" text-anchor="end" font-size="11" fill="#071a31">E0+030 MH-02</text>
<text x="72" y="252" font-size="11" fill="#5d6a7a">R01: desenho e planilha em 12,35 m na conexão MH-02. Exemplo demonstrativo.</text>
