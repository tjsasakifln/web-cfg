<line x1="56.0" y1="30.0" x2="56.0" y2="190.0" stroke="#dfe4e6" stroke-width="1"/>
<text x="285.0" y="156.0" font-size="12.5" fill="#2d6f2d">desenho e</text><text x="285.0" y="171.0" font-size="12.5" fill="#2d6f2d">planilha</text><text x="285.0" y="186.0" font-size="12.5" fill="#2d6f2d">12,35 m</text>
<line x1="56.0" y1="70.0" x2="276.0" y2="160.0" stroke="#071a31" stroke-width="2.4"/>
<circle cx="56.0" cy="70.0" r="6" fill="#ffffff" stroke="#071a31" stroke-width="1.4"/>
<circle cx="276.0" cy="160.0" r="6" fill="#edf5ec" stroke="#2d6f2d" stroke-width="1.4"/>
<text x="48.0" y="74.0" text-anchor="end" font-size="12.5" fill="#071a31">12,80</text>
<text x="166.0" y="52.0" text-anchor="middle" font-size="13" font-weight="650" fill="#071a31">DR-01 · invert de montante a jusante</text>
<text x="56.0" y="208.0" font-size="12.5" fill="#071a31">E0+010 MH-01</text>
<text x="276.0" y="208.0" text-anchor="end" font-size="12.5" fill="#071a31">E0+030 MH-02</text>
<text x="48.0" y="230.0" font-size="12.5" fill="#5d6a7a">R01: desenho e planilha em 12,35 m</text>
<text x="48.0" y="247.0" font-size="12.5" fill="#5d6a7a">na conexão MH-02. Exemplo demonstrativo.</text>
</svg>
