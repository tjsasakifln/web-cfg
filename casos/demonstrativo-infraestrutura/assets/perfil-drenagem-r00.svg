<title id="prf-R00-title">Perfil de invert DR-01 · estado original · R00</title>
<desc id="prf-R00-desc">Trecho DR-01 de E0+010 a E0+030. Invert de montante 12,80 m. R00: desenho 12,35 m versus planilha 12,50 m em MH-02, diferença 0,15 m. Exemplo demonstrativo. Declive geométrico, não capacidade hidráulica.</desc>
