<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 324" role="img" font-family="Archivo Var, Arial, Helvetica, sans-serif" aria-labelledby="plan-R01-title plan-R01-desc">
<title id="plan-R01-title">Planta do acesso PV-01 · versão demonstrativa corrigida · R01</title>
<desc id="plan-R01-desc">Faixa PV-01 de 40,00 m por 7,00 m. Poço MH-01 em E0+010, boca IN-01 em E0+020, poço MH-02 em E0+030, trecho DR-01 com 20,00 m. R01: cota de MH-02 alinhada em 12,35 m no desenho e na planilha. Exemplo demonstrativo, revisão R01.</desc>
<defs><pattern id="plan-R01-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V6" stroke="#5d6a7a" stroke-width="0.5"/></pattern></defs>
<rect x="64.0" y="48.0" width="560.0" height="196.0" fill="#f3f4f5" stroke="#071a31" stroke-width="2"/>
<rect x="64.0" y="48.0" width="560.0" height="11.2" fill="url(#plan-R01-hatch)"/>
<rect x="64.0" y="232.8" width="560.0" height="11.2" fill="url(#plan-R01-hatch)"/>
<text x="344.0" y="150.0" text-anchor="middle" font-size="13" font-weight="650" fill="#071a31">PV-01 · 40,00 m × 7,00 m</text>
<line x1="204.0" y1="146.0" x2="484.0" y2="146.0" stroke="#2d6f2d" stroke-width="2"/>
<text x="344.0" y="132.0" text-anchor="middle" font-size="11" font-weight="650" fill="#2d6f2d">DR-01 · 20,00 m · diâm. 400,00 mm</text>
<circle cx="204.0" cy="146.0" r="10" fill="#ffffff" stroke="#071a31" stroke-width="1.2"/>
<text x="204.0" y="178.0" text-anchor="middle" font-size="11" fill="#071a31">MH-01 E0+010</text>
<rect x="336.0" y="218.8" width="16" height="25.2" fill="#ffffff" stroke="#5d6a7a" stroke-width="1.2" stroke-dasharray="3 2"/>
<text x="344.0" y="252.2" text-anchor="middle" font-size="11" fill="#5d6a7a">IN-01 E0+020</text>
<circle cx="484.0" cy="146.0" r="10" fill="#edf5ec" stroke="#2d6f2d" stroke-width="1.2"/>
<text x="484.0" y="178.0" text-anchor="middle" font-size="11" fill="#071a31">MH-02 E0+030</text>
<text x="64.0" y="38.0" font-size="11" fill="#5d6a7a">E0+000</text>
<text x="624.0" y="38.0" text-anchor="end" font-size="11" fill="#5d6a7a">E0+040</text>
<text x="344.0" y="308" text-anchor="middle" font-size="11" fill="#5d6a7a">R01: cota de MH-02 alinhada em 12,35 m no desenho e na planilha. Exemplo demonstrativo.</text>
