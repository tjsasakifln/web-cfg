<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 419 384" role="img" font-family="Archivo Var, Arial, Helvetica, sans-serif" aria-labelledby="plan-R01-title plan-R01-desc">
<title id="plan-R01-title">Planta do recorte · versão demonstrativa corrigida · R01</title>
<desc id="plan-R01-desc">Banheiro 2,40 m por 1,80 m. Porta D-01 na parede norte, janela WN-01 na parede leste, poço hidrossanitário HS-01 na parede oeste, viga B-01 na parede leste. R01: verga WN-01 em 2,10 m, folga de 0,10 m até B-01. Exemplo demonstrativo, revisão R01.</desc>
<rect x="48.0" y="66.0" width="324.0" height="252.0" fill="#dfe4e6" stroke="#071a31" stroke-width="2"/>
<rect x="66.0" y="66.0" width="288.0" height="216.0" fill="#fff" stroke="#071a31" stroke-width="1.2"/>
<!-- door opening north -->
<rect x="126.0" y="48.0" width="96.0" height="18.0" fill="#fff" stroke="#071a31" stroke-width="1.2"/>
<text x="174.0" y="42.0" text-anchor="middle" font-size="11" fill="#071a31">D-01</text>
<!-- window east -->
<rect x="354.0" y="126.0" width="18.0" height="96.0" fill="#edf5ec" stroke="#2d6f2d" stroke-width="1.2"/>
<text x="376.0" y="174.0" font-size="11" font-weight="650" fill="#2d6f2d">WN-01</text>
<!-- beam along east interior -->
<rect x="339.6" y="66.0" width="14.4" height="216.0" fill="none" stroke="#2d6f2d" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="332.4" y="174.0" font-size="11" font-weight="650" fill="#2d6f2d" transform="rotate(-90 332.4 174.0)">B-01</text>
<!-- shaft west exterior -->
<rect x="18.0" y="150.0" width="48.0" height="48.0" fill="#f3f4f5" stroke="#071a31" stroke-width="1.2"/>
<text x="42.0" y="178.0" text-anchor="middle" font-size="11" fill="#071a31">HS-01</text>
<text x="210.0" y="174.0" text-anchor="middle" font-size="12" font-weight="650" fill="#071a31">RM-01</text>
<text x="210.0" y="328.0" text-anchor="middle" font-size="11" fill="#5d6a7a">2,40 m</text>
<text x="40.0" y="174.0" text-anchor="middle" font-size="11" fill="#5d6a7a" transform="rotate(-90 40.0 174.0)">1,80 m</text>
<text x="48" y="372" font-size="11" fill="#5d6a7a">PR-ARQ · R01 · escala indicativa · exemplo demonstrativo</text>
