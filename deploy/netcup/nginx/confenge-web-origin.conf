# Loopback-only origin used for candidate/live identity checks before cutover.
# This file is packaged as a reviewed contract; releases never install it.
server {
    listen 127.0.0.1:8088;
    listen [::1]:8088;
    server_name confenge.com.br;

    root /opt/confenge-web/current/_site;
    index index.html;

    location = /.well-known/build-info.json {
        try_files $uri =503;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
