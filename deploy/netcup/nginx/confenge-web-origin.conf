# Loopback-only origin used for candidate/live identity checks before cutover.
# Include confenge-web-http.conf from nginx's http context first. Behavior is
# consumed only from immutable snippets generated from canonical repository inputs.
server {
    listen 127.0.0.1:8088;
    listen [::1]:8088;
    server_name confenge.com.br;

    access_log /var/log/nginx/confenge-web-origin-access.log confenge_minimized buffer=16k flush=5s;
    error_log /dev/null crit;

    root /opt/confenge-web/current/_site;
    index index.html;

    add_header X-Confenge-Host-Architecture-Version "confenge-nginx-node/v2" always;
    include /opt/confenge-web/current/nginx/generated/redirects.generated.conf;
    include /opt/confenge-web/current/nginx/generated/runtime-locations.generated.conf;
    include /opt/confenge-web/current/nginx/generated/locations.generated.conf;
}
