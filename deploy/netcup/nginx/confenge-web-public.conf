# CONFENGE public web edge (confenge.com.br + www).
#
# Install once at /etc/nginx/sites-available/confenge.com.br and symlink it into
# sites-enabled. It is deliberately free of any release SHA: every path follows
# /opt/confenge-web/current, so promote-release and rollback swap the public site
# atomically. A vhost pinned to a literal SHA silently keeps serving the old
# release after a promotion and makes rollback a config edit instead of a symlink.
#
# Include deploy/netcup/nginx/confenge-web-http.conf from the http context first;
# it carries the generated header maps and the runtime upstream.

server {
    listen 80;
    listen [::]:80;
    server_name confenge.com.br www.confenge.com.br;

    # Keep an HTTP-01 path available as a fallback even though renewal is DNS-01.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    location / {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        return 301 https://confenge.com.br$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.confenge.com.br;

    ssl_certificate     /etc/letsencrypt/live/confenge.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/confenge.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Single hop to the apex, matching the current public contract.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    return 301 https://confenge.com.br$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name confenge.com.br;

    ssl_certificate     /etc/letsencrypt/live/confenge.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/confenge.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Transport compression, scoped to this vhost so it cannot collide with the
    # distribution's own http-context `gzip on` or alter the ops/api vhosts.
    #
    # The public contract on Netlify compresses every text response, CSS and JS
    # included. Debian's nginx defaults to `gzip_types text/html` only, so this
    # origin was serving the 115 KB stylesheet and the 47 KB bundle uncompressed
    # on every cold visit — a regression that a status-code parity check cannot
    # see. gzip_vary is mandatory, not cosmetic: without it a shared cache can
    # hand a gzipped body to a client that never asked for one.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;

    # Netlify labels every text response with a charset; nginx does not unless
    # asked. The origin was serving `text/html` where the public contract says
    # `text/html; charset=UTF-8`, which leaves the encoding to the browser to
    # guess — and a status-code parity check cannot see it. text/html is always
    # covered by `charset`; the rest are named explicitly.
    charset utf-8;
    charset_types
        text/css
        text/plain
        text/xml
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/rss+xml
        image/svg+xml;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/xml+rss
        application/rss+xml
        image/svg+xml;

    root /opt/confenge-web/current/_site;
    index index.html;

    add_header X-Confenge-Host-Architecture-Version "confenge-nginx-node/v2" always;

    include /opt/confenge-web/current/nginx/generated/redirects.generated.conf;
    include /opt/confenge-web/current/nginx/generated/runtime-locations.generated.conf;
    include /opt/confenge-web/current/nginx/generated/locations.generated.conf;
}
