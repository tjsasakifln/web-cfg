# Loopback origin dependencies for the nginx http context.
# Generated files are part of the immutable current release and are never hand-copied.
include /opt/confenge-web/current/nginx/generated/headers.generated.conf;
include /opt/confenge-web/current/nginx/generated/runtime-upstream.generated.conf;

# Privacy boundary for request telemetry. Every value written by
# confenge_minimized is either generated by nginx or reduced to a finite class;
# no client address, forwarding chain, user agent, referer, cookie, query string
# or free-form URI is persisted. The finite route classes preserve useful
# availability/latency aggregates without making the access log an identity
# store.
map $uri $confenge_route_class {
    default                         other;
    =/                              root;
    ~^/\.well-known/                well-known;
    ~^/(?:api/web|\.netlify/functions)/ runtime;
    ~^/conteudos/                   editorial;
    ~^/entregas/                    commercial;
    ~^/ferramentas/                 tool;
}

map $request_method $confenge_method_class {
    default other;
    GET     get;
    HEAD    head;
    POST    post;
    OPTIONS options;
}

map $status $confenge_status_class {
    default other;
    ~^2     2xx;
    ~^3     3xx;
    ~^4     4xx;
    ~^5     5xx;
}

map $sent_http_content_type $confenge_content_class {
    default                   other;
    ~^text/html               html;
    ~^text/css                css;
    ~^(?:text|application)/javascript javascript;
    ~^application/json        json;
    ~^image/                  image;
    ~^font/                   font;
}

map $upstream_status $confenge_upstream_class {
    default other;
    ""      none;
    ~^2     2xx;
    ~^3     3xx;
    ~^4     4xx;
    ~^5     5xx;
}

log_format confenge_minimized escape=json
    '{"ts":"$time_iso8601",'
    '"route_class":"$confenge_route_class",'
    '"method_class":"$confenge_method_class",'
    '"status_class":"$confenge_status_class",'
    '"status":$status,'
    '"content_class":"$confenge_content_class",'
    '"bytes":$bytes_sent,'
    '"request_seconds":$request_time,'
    '"upstream_class":"$confenge_upstream_class",'
    '"upstream_seconds":"$upstream_response_time"}';
