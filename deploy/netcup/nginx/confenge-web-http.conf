# Loopback origin dependencies for the nginx http context.
# Generated files are part of the immutable current release and are never hand-copied.
include /opt/confenge-web/current/nginx/generated/headers.generated.conf;
include /opt/confenge-web/current/nginx/generated/runtime-upstream.generated.conf;

# Use the transport peer, even after the public vhost restores the visitor IP.
# Keep the Cloudflare ranges in sync with confenge-web-public.conf and
# https://www.cloudflare.com/ips/. Loopback is reserved for host-local checks.
geo $realip_remote_addr $confenge_edge_peer {
    default         0;
    127.0.0.0/8     1;
    ::1/128         1;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22   1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15  1;
    104.16.0.0/13   1;
    104.24.0.0/14   1;
    172.64.0.0/13   1;
    131.0.72.0/22   1;
    2400:cb00::/32  1;
    2606:4700::/32  1;
    2803:f800::/32  1;
    2405:b500::/32  1;
    2405:8100::/32  1;
    2a06:98c0::/29  1;
    2c0f:f248::/32  1;
}

# An empty key skips accounting, so the limits do not affect static pages or
# unrelated API routes. Client keys use nginx's restored visitor address.
map "$request_method:$uri" $confenge_correction_bucket {
    default                                                "";
    ~^POST:/(?:api/web|\.netlify/functions)/correction$     correction;
}
map $confenge_correction_bucket $confenge_correction_client {
    default     "";
    correction  $binary_remote_addr;
}
limit_req_zone $confenge_correction_bucket zone=confenge_correction_total:1m rate=60r/m;
limit_req_zone $confenge_correction_client zone=confenge_correction_ip:2m rate=6r/m;

# Bound storage diagnostics across both route aliases while the application
# also enforces its own readiness and authorization checks.
map "$request_method:$uri" $confenge_health_bucket {
    default                                              "";
    ~^(?:GET|HEAD):/ready$                                health;
    ~^(?:GET|HEAD):/(?:api/web|\.netlify/functions)/collect$ health;
    ~^[A-Z]+:/(?:api/web|\.netlify/functions)/(?:ops|nurture)$ health;
}
limit_req_zone $confenge_health_bucket zone=confenge_health_total:1m rate=180r/m;

# Privacy boundary for request telemetry. Every value written by
# confenge_minimized is either generated by nginx or reduced to a finite class;
# no client address, forwarding chain, user agent, referer, cookie, query string
# or free-form URI is persisted. The finite route classes preserve useful
# availability/latency aggregates without making the access log an identity
# store.
map $uri $confenge_route_class {
    default                         other;
    =/                              root;
    ~^/\.well-known/                well-known;
    ~^/(?:api/web|\.netlify/functions)/ runtime;
    ~^/conteudos/                   editorial;
    ~^/entregas/                    commercial;
    ~^/ferramentas/                 tool;
}

map $request_method $confenge_method_class {
    default other;
    GET     get;
    HEAD    head;
    POST    post;
    OPTIONS options;
}

map $status $confenge_status_class {
    default other;
    ~^2     2xx;
    ~^3     3xx;
    ~^4     4xx;
    ~^5     5xx;
}

map $sent_http_content_type $confenge_content_class {
    default                   other;
    ~^text/html               html;
    ~^text/css                css;
    ~^(?:text|application)/javascript javascript;
    ~^application/json        json;
    ~^image/                  image;
    ~^font/                   font;
}

map $upstream_status $confenge_upstream_class {
    default other;
    ""      none;
    ~^2     2xx;
    ~^3     3xx;
    ~^4     4xx;
    ~^5     5xx;
}

log_format confenge_minimized escape=json
    '{"ts":"$time_iso8601",'
    '"route_class":"$confenge_route_class",'
    '"method_class":"$confenge_method_class",'
    '"status_class":"$confenge_status_class",'
    '"status":$status,'
    '"content_class":"$confenge_content_class",'
    '"bytes":$bytes_sent,'
    '"request_seconds":$request_time,'
    '"upstream_class":"$confenge_upstream_class",'
    '"upstream_seconds":"$upstream_response_time"}';
