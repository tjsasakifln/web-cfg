version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      dev-tooling:
        patterns:
          - "lighthouse"
          - "puppeteer-core"
          - "axe-core"
          - "chrome-launcher"
    # No Node-floor ignores. The three majors that used to be blocked here
    # (lighthouse@13 >=22.19, puppeteer-core@25 >=22.12, @netlify/blobs@11
    # >=22.12) were unlanded only because the repository, CI and Netlify were
    # pinned to Node 20. Issue #149 lifted every surface to Node 22 in one
    # coordinated change (netlify.toml NODE_VERSION=22, engines ">=22.19 <23",
    # .nvmrc 22, node-version "22" in all workflows), so those engines are now
    # satisfied and the ignores were removed together as that issue instructed.
    #
    # `npm ci --engine-strict` in the merge workflows and the scheduled RevOps
    # install keeps the guarantee that replaced these ignores: a dependency
    # declaring a Node floor above the runner hard-fails instead of passing
    # green. Prove each remaining major on its own Dependabot PR, never as a
    # drive-by bump.

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github_actions
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
