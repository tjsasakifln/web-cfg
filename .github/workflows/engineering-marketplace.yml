name: engineering-marketplace

on:
  pull_request:
    paths:
      - 'apps/engineering-marketplace/**'
      - 'runtime/marketplace/**'
      - 'netlify/functions/engineering-marketplace*.cjs'
      - 'profissionais/**'
      - 'assets/marketplace/**'
      - 'tests/marketplace/**'
      - 'deploy/netcup/marketplace/**'
      - '.github/workflows/engineering-marketplace.yml'
  push:
    branches: [main]
    paths:
      - 'apps/engineering-marketplace/**'
      - 'runtime/marketplace/**'
      - 'netlify/functions/engineering-marketplace*.cjs'
      - 'profissionais/**'
      - 'assets/marketplace/**'
      - 'tests/marketplace/**'
      - 'deploy/netcup/marketplace/**'
      - '.github/workflows/engineering-marketplace.yml'

permissions:
  contents: read

concurrency:
  group: engineering-marketplace-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  marketplace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: marketplace_test
          POSTGRES_PASSWORD: ci_disposable_only
          POSTGRES_DB: marketplace_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U marketplace_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7.2.17-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      NODE_ENV: test
      MEDUSA_DISABLE_TELEMETRY: 'true'
      MERCUR_DISABLE_TELEMETRY: 'true'
      DO_NOT_TRACK: '1'
      DATABASE_URL: postgres://marketplace_test:ci_disposable_only@127.0.0.1:5432/marketplace_test
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET: ci-only-disposable-jwt-not-a-deployment-secret
      COOKIE_SECRET: ci-only-disposable-cookie-not-a-deployment-secret
      MARKETPLACE_GATEWAY_KEY: ci-only-disposable-gateway-not-a-deployment-secret
      MARKETPLACE_PAYMENTS_ENABLED: 'false'
      MARKETPLACE_COMMISSION_BPS: '1000'
      MARKETPLACE_INTEGRATION_TEST: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/engineering-marketplace/package-lock.json
      - name: Install the public-site and private-application dependencies
        run: |
          npm ci --engine-strict --ignore-scripts --no-audit --no-fund
          npm ci --prefix apps/engineering-marketplace --engine-strict --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Verify permissions, financial rules and the actual database integration
        run: |
          npm run test:marketplace
          npm --prefix apps/engineering-marketplace run typecheck
          npm --prefix apps/engineering-marketplace test
          npm --prefix apps/engineering-marketplace run build
          npm --prefix apps/engineering-marketplace run test:integration
      - name: Resolve the site's existing Chrome contract
        id: browser-contract
        run: node scripts/site/resolve_chrome_version.mjs >> "$GITHUB_OUTPUT"
      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        with:
          chrome-version: ${{ steps.browser-contract.outputs.version }}
      - name: Verify customer and provider journeys in the browser
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:marketplace:browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: engineering-marketplace-browser
          path: build/reports/marketplace/
          if-no-files-found: ignore
          retention-days: 14

  production-container:
    # Independent of the source/browser checks: build and boot the exact private
    # production recipe on a disposable runner, without deployment credentials.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.22.2'
      - name: Build, migrate and verify the restricted production Compose
        run: node tests/marketplace/container.mjs
