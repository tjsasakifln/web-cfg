name: ready-project-first-fold-refresh

# Temporary evidence producer for PR #832. Remove when importing its two JSONs.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  refresh:
    if: >-
      github.event.pull_request.head.ref == 'feat/projetos-prontos-20261112' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIRST_FOLD_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --engine-strict
      - name: Resolve contracted Chrome version
        id: browser_contract
        run: node scripts/site/resolve_chrome_version.mjs >> "$GITHUB_OUTPUT"
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        id: setup-chrome
        with:
          chrome-version: ${{ steps.browser_contract.outputs.version }}
      - name: Measure source from the clean PR head
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FIRST_FOLD_HEAD_SHA"
          source_status="$(git status --porcelain)"
          if [ -n "$source_status" ]; then
            printf '%s\n' "$source_status"
            exit 1
          fi
          node scripts/site/measure_first_fold.mjs --write
          node tests/commercial/test_first_fold_contract.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const evidence = JSON.parse(readFileSync('data/commercial/first-fold-measurements.v1.json', 'utf8'));
          const contract = JSON.parse(readFileSync('data/commercial/first-fold-contract.v1.json', 'utf8'));
          assert.equal(evidence.commit_sha, process.env.FIRST_FOLD_HEAD_SHA);
          assert.equal(evidence.surface, 'source');
          assert.equal(evidence.tree_dirty, false);
          assert.equal(evidence.routes.length, 25);
          assert.deepEqual(evidence.viewports, ['1366x768', '390x844']);
          const passed = contract.census.filter(row => row.evidence_state === 'MEASURED_PASS').length;
          assert.equal(passed, 25);
          console.log('FIRST_FOLD_SOURCE_REFRESH ' + JSON.stringify({ commit: evidence.commit_sha, routes: evidence.routes.length, viewports: evidence.viewports, passed, tree_dirty: evidence.tree_dirty }));
          JS
      - name: Preserve the original source evidence and census
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: first-fold-source-${{ github.event.pull_request.head.sha }}
          path: |
            data/commercial/first-fold-measurements.v1.json
            data/commercial/first-fold-contract.v1.json
          if-no-files-found: error
