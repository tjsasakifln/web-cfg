name: site-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded in-flight runs of the same ref. Does not skip the full
# gate set on pull_request/push to main — no path filters.
concurrency:
  group: site-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        # Hard fail on lock desync — never soft-fallback to npm install.
        run: npm ci
      - name: Lint gates
        run: |
          npm run test:workflow-gates
          npm run test:inbound-gates
          npm run editorial:truth
          npm run test:brand
          npm run test:copy
          npm run test:design
          npm run test:env-example

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        # Hard fail on lock desync — never soft-fallback to npm install.
        run: |
          npm ci
          pip install pytest
      - name: Unit gates
        run: |
          npm run editorial:test
          npm run editorial:build
          npm run pseo:test
          npm run test:analytics
          npm run test:form-funnel
          npm run test:lead-function
          npm run test:lead-store-production
          npm run test:ops-auth
          npm run test:epic-td
          npm run test:script-modules
          npm run test:cta-whatsapp
          npm run test:release-filters
          npm run test:pseo-attribution
          npm run test:revops
          npm run test:schedules
          npm run test:tools
          npm run test:nurture

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        # Hard fail on lock desync — never soft-fallback to npm install.
        run: npm ci
      - name: Build public site
        run: npm run build:site
      - name: Upload _site
        uses: actions/upload-artifact@v7
        with:
          name: site-ci-site
          path: _site
          if-no-files-found: error
          retention-days: 1
          # .well-known/pseo-build.json is required by audit:public-artifact
          include-hidden-files: true

  security:
    name: security
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        # Hard fail on lock desync — never soft-fallback to npm install.
        run: npm ci
      - name: Download _site
        uses: actions/download-artifact@v7
        with:
          name: site-ci-site
          path: _site
      - name: Security and public-artifact gates
        run: |
          npm run test:secrets-scan
          npm run pseo:validate
          npm run pseo:audit
          npm run audit:public-artifact
          npm run validate:seo
          npm run audit:css-usage
          npm run test:redirects
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: site-ci-reports-security
          path: |
            seo/pseo-*.json
          if-no-files-found: ignore

  e2e:
    name: e2e
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        # Hard fail on lock desync — never soft-fallback to npm install.
        run: npm ci
      - name: Download _site
        uses: actions/download-artifact@v7
        with:
          name: site-ci-site
          path: _site
      - name: UI geometry
        run: npm run test:ui
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2
        id: setup-chrome
      - name: axe accessibility
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run audit:axe
      - name: Tools UI/UX E2E
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run test:tools-uiux-e2e
      - name: Upload e2e reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: site-ci-reports-e2e
          path: |
            docs/uiux-evidence/axe-report.json
            docs/uiux-tools-remediation/evidence/
          if-no-files-found: ignore

  performance:
    name: performance
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        # Hard fail on lock desync — never soft-fallback to npm install.
        run: npm ci
      - name: Download _site
        uses: actions/download-artifact@v7
        with:
          name: site-ci-site
          path: _site
      - name: Setup Chrome for Lighthouse
        uses: browser-actions/setup-chrome@v2
        id: setup-chrome
      - name: Lighthouse local (_site)
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          LH_PAGES: "/,/diretoria-b2g/,/conteudos/"
        run: npm run test:lighthouse
        continue-on-error: false
      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: site-ci-reports-performance
          path: |
            docs/lighthouse-runs/
          if-no-files-found: ignore

  gates:
    # Stable GitHub check context — require this name in branch protection
    name: site-ci
    if: ${{ always() }}
    needs: [lint, unit, build, security, e2e, performance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Fail closed on required child results
        env:
          SITE_CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/site/site_ci_aggregator.py
