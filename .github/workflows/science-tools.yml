name: scientific-tools

on:
  pull_request:
    paths:
      - runtime/science-tools/**
      - netlify/functions/science-tools.cjs
      - assets/js/science-tools.mjs
      - assets/css/science-tools.css
      - ferramentas/memorial-de-calculo/**
      - ferramentas/propriedades-de-secoes/**
      - ferramentas/secao-de-concreto-armado/**
      - ferramentas/trelicas-e-porticos/**
      - ferramentas/geotecnia-cpt-estacas/**
      - ferramentas/conforto-termico/**
      - ferramentas/energia-solar-fotovoltaica/**
      - .github/workflows/science-tools.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calculations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Build the hash-locked Python runtime
        run: python3 -B runtime/science-tools/build_runtime.py
      - name: Adversarial request and mesher checks
        run: |
          node --test runtime/science-tools/tests/platform.test.cjs
          OPENBLAS_NUM_THREADS=1 runtime/science-tools/python/bin/python3.12 -B runtime/science-tools/tests/test_mesh.py
      - name: Real calculations with limits
        run: python3 -B runtime/science-tools/tests/validate_runtime.py
      - name: Browser calculations and result lifecycle
        run: |
          npm ci --ignore-scripts
          node runtime/science-tools/tests/browser.mjs
      - name: Relocated runtime proof
        run: |
          relocated=$(mktemp -d)
          tar --exclude='__pycache__' --exclude='*.pyc' -cf - runtime/science-tools | tar -xf - -C "$relocated"
          python3 -B "$relocated/runtime/science-tools/tests/validate_runtime.py"
          rm -rf "$relocated"
