name: navigation-discovery-qa

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: navigation-discovery-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  navigation-review:
    name: Navigation discovery review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Review the actual PR revision. Required site-ci still evaluates
          # the merge candidate and the complete generated public artifact.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize source review evidence
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if sha != os.environ["EXPECTED_HEAD_SHA"]:
              raise SystemExit("checkout does not match the pull request revision")
          output = Path("build/reports/convergence/navigation-discovery")
          output.mkdir(parents=True, exist_ok=True)
          (output / "provenance.json").write_text(json.dumps({
              "source_sha": sha,
              "surface": "source",
              "site_root": ".",
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "scope": "Navigation review evidence; required publication gates remain unchanged"
          }, indent=2) + "\n")
          PY
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        id: dependencies
        run: npm ci --engine-strict
      - name: Resolve contracted Chrome version
        id: browser-contract
        run: node scripts/site/resolve_chrome_version.mjs >> "$GITHUB_OUTPUT"
      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        with:
          chrome-version: ${{ steps.browser-contract.outputs.version }}
      - name: Review navigation on the source revision
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          NAVIGATION_EVIDENCE_DIR: build/reports/convergence/navigation-discovery
        run: |
          set -o pipefail
          node scripts/site/test_navigation_discovery_browser.mjs . 2>&1 | tee build/reports/convergence/navigation-discovery/navigation.log
      - name: Verify navigation and commercial event semantics
        if: always() && steps.dependencies.outcome == 'success' && steps.chrome.outcome == 'success'
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          SITE_ROOT: .
          EVENT_SEMANTICS_REPORT: build/reports/convergence/navigation-discovery/event-semantics.json
        run: |
          set -o pipefail
          node scripts/site/test_event_semantics.mjs 2>&1 | tee build/reports/convergence/navigation-discovery/event-semantics.log
      - name: Measure first fold on the clean source revision
        id: first-fold
        if: always() && steps.dependencies.outcome == 'success' && steps.chrome.outcome == 'success'
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain)"
          node scripts/site/measure_first_fold.mjs --write --report "$RUNNER_TEMP/navigation-first-fold/report.json"
      - name: Collect fresh first-fold contracts and provenance
        id: first-fold-evidence
        if: always() && steps.dependencies.outcome == 'success' && steps.chrome.outcome == 'success'
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Never package a previous commit's measurements after a browser
          # failure. Fresh failed measurements remain diagnostic evidence;
          # the normal first-fold gate below still rejects every failure.
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { copyFileSync, mkdirSync, readFileSync } from 'node:fs';
          import { firstFoldInputHashes } from './scripts/site/first_fold_identity.mjs';
          const files = ['data/commercial/first-fold-contract.v1.json', 'data/commercial/first-fold-measurements.v1.json'];
          const reportPath = process.env.RUNNER_TEMP + '/navigation-first-fold/report.json';
          const report = JSON.parse(readFileSync(reportPath, 'utf8'));
          const contract = JSON.parse(readFileSync(files[0], 'utf8'));
          const measured = JSON.parse(readFileSync(files[1], 'utf8'));
          const original = JSON.parse(execFileSync('git', ['show', process.env.EXPECTED_HEAD_SHA + ':' + files[0]], { encoding: 'utf8' }));
          for (const evidence of [report, measured]) {
            assert.equal(evidence.schema, 'confenge.first-fold-measurements/1.0');
            assert.equal(evidence.commit_sha, process.env.EXPECTED_HEAD_SHA);
            assert.equal(evidence.surface, 'source');
            assert.equal(evidence.tree_dirty, false);
            assert.ok(evidence.routes.length > 0);
          }
          assert.deepEqual(contract.census.map(row => row.route), original.census.map(row => row.route));
          assert.equal(report.planned, report.executed);
          assert.equal(report.executed, contract.census.length);
          assert.equal(report.executed, measured.routes.length);
          assert.deepEqual(report.input_hashes, measured.input_hashes);
          assert.deepEqual(report.input_hashes, firstFoldInputHashes(process.cwd(), contract.census.map(row => row.route)));
          assert.deepEqual(report.routes, measured.routes);
          const changed = execFileSync('git', ['diff', '--name-only'], { encoding: 'utf8' }).trim().split('\n').filter(Boolean);
          assert.ok(changed.every(file => files.includes(file)), 'measurement may change only its two derived contracts');
          const output = 'build/reports/convergence/navigation-discovery/first-fold';
          mkdirSync(output + '/contracts', { recursive: true });
          copyFileSync(reportPath, output + '/report.json');
          for (const file of files) copyFileSync(file, output + '/contracts/' + file.split('/').at(-1));
          JS
      - name: Verify measured first-fold contract without exceptions
        if: always() && steps.first-fold-evidence.outcome == 'success'
        run: npm run test:first-fold-contract
      # Evidence can be inspected before an approved editorial recapture.
      # This workflow does not rebuild frozen hashes, deploy or replace site-ci.
      - name: Preserve navigation review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: navigation-discovery-qa
          path: build/reports/convergence/navigation-discovery/
          if-no-files-found: error
          retention-days: 14
