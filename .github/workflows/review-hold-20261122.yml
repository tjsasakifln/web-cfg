name: One-time SmartLic HOLD review regeneration
on:
  push:
    branches:
      - feat/ferramentas-pareto-24-mvp
    paths:
      - scripts/legacy_equity/build_inventory.py
      - docs/migrations/smartlic/HOLD-REVIEW-2026-11-22.md

permissions:
  contents: write

jobs:
  regenerate-verified-hold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Regenerate immutable inventory with documented review and pins
        run: python3 scripts/legacy_equity/review_hold_20261122.py
      - name: Validate inventory, 410 controls and expiration tests
        run: |
          python3 -m pip install --disable-pip-version-check pytest
          python3 -m pytest scripts/migration/tests scripts/legacy_equity/tests -q
      - name: Remove one-time generator, commit checked artifacts and retain audit
        run: |
          git rm -f .github/workflows/review-hold-20261122.yml scripts/legacy_equity/review_hold_20261122.py
          git add data/migrations/smartlic-url-map data/migration/smartlic-confenge docs/migrations/smartlic docs/migration/smartlic-confenge
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(legacy-equity): pin reviewed 54 HOLD without promoting redirects"
          git push origin HEAD:feat/ferramentas-pareto-24-mvp
