# Read-only proof of the private market-intelligence consumer (#413).
# The producer runs in revops-scheduled. This workflow never syncs, publishes,
# restores or mutates storage: it only accepts a versioned host-owned snapshot
# when the authenticated consumer reports CURRENT with exact manifest parity.
name: market-answer-freshness

on:
  schedule:
    # Every 6 hours — strictly more frequent than max_age_hours=48.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-answer-freshness
  cancel-in-progress: false

jobs:
  verify-private-consumer:
    name: verify-private-consumer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: Prove fixture polarity
        run: node --test scripts/revops/test_gsc_freshness_probe.mjs
      - name: Read authenticated durable consumer
        env:
          BASE_URL: https://confenge.com.br
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
        run: node scripts/revops/verify_gsc_freshness.mjs
