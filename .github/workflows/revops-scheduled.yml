# Primary operational scheduler for CONFENGE RevOps.
# One mechanism: GitHub Actions (versioned, testable, secrets in env).
#
# Daily (11:15 UTC ≈ 08:15 America/Sao_Paulo):
#   health, isolated probe, GSC sync, analytics, uncontacted reals,
#   Resend/storage signals, deploy-vs-main, critical URLs, nurture tick
# Weekly (Monday 12:00 UTC):
#   real-only weekly report email via ops
#
# Manual: Actions → revops-scheduled → Run workflow
name: revops-scheduled

on:
  schedule:
    # Daily ops — 11:15 UTC
    - cron: "15 11 * * *"
    # Weekly report — Mondays 12:00 UTC
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - weekly
          - nurture
          - gsc
          - inbound-proof
          - all

concurrency:
  group: revops-scheduled-${{ github.event.inputs.job || github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  daily:
    name: daily-ops
    if: >
      github.event_name == 'schedule' && github.event.schedule == '15 11 * * *'
      || github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'daily' || github.event.inputs.job == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          npm ci --engine-strict
          python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Daily scheduled run
        env:
          BASE_URL: https://confenge.com.br
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
          REVOPS_TOKEN: ${{ secrets.REVOPS_TOKEN }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GSC_CREDENTIALS_JSON: ${{ secrets.GSC_CREDENTIALS_JSON }}
          GITHUB_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/revops/scheduled_daily.mjs
      - name: Upload daily report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: revops-daily-${{ github.run_id }}
          path: |
            data/revops/gsc/last_sync.json
            data/revops/schedule-runs/
          if-no-files-found: error

  inbound_proof:
    name: inbound-counters-proof
    if: >
      github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'inbound-proof' || github.event.inputs.job == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: Read-only authenticated inbound counters proof
        env:
          BASE_URL: https://confenge.com.br
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
        run: node scripts/revops/inbound_counters_proof.mjs
      - name: Upload inbound counters proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: inbound-counters-proof-${{ github.run_id }}
          path: data/revops/inbound-proof-runs/
          if-no-files-found: error

  nurture:
    name: nurture-tick
    if: >
      github.event_name == 'schedule' && github.event.schedule == '15 11 * * *'
      || github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'nurture' || github.event.inputs.job == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: Nurture tick
        env:
          BASE_URL: https://confenge.com.br
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
          REVOPS_TOKEN: ${{ secrets.REVOPS_TOKEN }}
        run: node scripts/revops/scheduled_nurture.mjs

  gsc:
    name: gsc-sync
    if: >
      github.event_name == 'schedule' && github.event.schedule == '15 11 * * *'
      || github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'gsc' || github.event.inputs.job == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: gsc-private-snapshot-producer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: Restore authenticated durable GSC history
        env:
          BASE_URL: https://confenge.com.br
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
        run: node scripts/revops/publish_gsc_insights.mjs --restore-history
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install GSC dependency
        run: |
          if python -m pip install --disable-pip-version-check -r requirements-ci.txt; then
            echo "GSC dependency available"
          else
            echo "GSC_DEPENDENCY_UNAVAILABLE=1" >> "$GITHUB_ENV"
          fi
      - name: GSC incremental sync
        id: gsc_sync
        env:
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GSC_CREDENTIALS_JSON: ${{ secrets.GSC_CREDENTIALS_JSON }}
          GSC_CLIENT_SECRETS_JSON: ${{ secrets.GSC_CLIENT_SECRETS_JSON }}
          GSC_TOKEN_JSON: ${{ secrets.GSC_TOKEN_JSON }}
        run: |
          # Write service account file if secret is JSON content
          if [ -n "$GSC_CREDENTIALS_JSON" ] && [ "${GSC_CREDENTIALS_JSON:0:1}" = "{" ]; then
            echo "$GSC_CREDENTIALS_JSON" > /tmp/gsc-sa.json
            export GSC_CREDENTIALS_JSON=/tmp/gsc-sa.json
          fi
          set +e
          python3 scripts/revops/search_demand_observatory.py sync --days 28 --reprocess-days 3
          sync_exit=$?
          echo "exit_code=$sync_exit" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist private GSC history and redacted insights
        env:
          BASE_URL: https://confenge.com.br
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
        run: node scripts/revops/publish_gsc_insights.mjs
      - name: Enforce GSC readiness fail-closed
        run: exit "${{ steps.gsc_sync.outputs.exit_code }}"
      - name: Upload GSC state
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gsc-sync-${{ github.run_id }}
          path: |
            data/revops/gsc/last_sync.json
            data/revops/gsc/history.json
            data/revops/gsc/publish_receipt.json
          if-no-files-found: error

  weekly:
    name: weekly-report
    if: >
      github.event_name == 'schedule' && github.event.schedule == '0 12 * * 1'
      || github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'weekly' || github.event.inputs.job == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: Weekly real-only report + email
        env:
          BASE_URL: https://confenge.com.br
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
          REVOPS_TOKEN: ${{ secrets.REVOPS_TOKEN }}
        run: node scripts/revops/scheduled_weekly.mjs
