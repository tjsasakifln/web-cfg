name: R04 Lighthouse evidence

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lighthouse-evidence:
    if: github.event.pull_request.head.ref == 'codex/r04-lighthouse-evidence-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXTRA_CLI_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fa9a3313be6da70cca969ca91eaefbfbf379146d
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve contracted producer revision
        id: producer-contract
        shell: bash
        run: |
          set -euo pipefail
          sha="$(python3 -c 'import json; print(json.load(open("data/pseo/manifest.json"))["source_commit_sha"])')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout contracted producer fixture
        env:
          EXTRA_CLI_ROOT: ${{ runner.temp }}/extra-cli-contract
          EXTRA_CLI_SHA: ${{ steps.producer-contract.outputs.sha }}
        run: |
          set -euo pipefail
          test ! -e "$EXTRA_CLI_ROOT"
          git init --quiet "$EXTRA_CLI_ROOT"
          git -C "$EXTRA_CLI_ROOT" fetch --no-tags --depth=1 https://github.com/tjsasakifln/extra-cli.git "$EXTRA_CLI_SHA"
          git -C "$EXTRA_CLI_ROOT" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$EXTRA_CLI_ROOT" rev-parse HEAD)" = "$EXTRA_CLI_SHA"
          echo "EXTRA_CLI_ROOT=$EXTRA_CLI_ROOT" >> "$GITHUB_ENV"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Build public site
        run: npm run build:site

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2

      - name: Collect Lighthouse matrix
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: node scripts/site/run_lighthouse.mjs

      - name: Validate raw Lighthouse evidence and thresholds
        env:
          LH_REQUIRE_RAW_EVIDENCE: "1"
        run: npm run test:lighthouse-gates

      - name: Record collector provenance
        if: always()
        run: |
          mkdir -p build/reports
          node --input-type=module - <<'JS'
          import { writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { createRequire } from 'node:module';
          const require = createRequire(import.meta.url);
          const sourceSha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const provenance = { source_sha: sourceSha, runner: process.platform, node: process.version,
            lighthouse: require('lighthouse/package.json').version, chrome: '${{ steps.setup-chrome.outputs.chrome-version }}',
            run_id: '${{ github.run_id }}', mode: 'package', collection: 'one complete native matrix',
            workflow: 'ephemeral evidence bootstrap; never a release authorization' };
          writeFileSync('build/reports/collector-provenance.json', JSON.stringify(provenance, null, 2) + '\n');
          JS

      - name: Upload Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: r04-lighthouse-evidence-${{ github.sha }}
          path: |
            docs/lighthouse-runs/**
            _site/.well-known/build-info.json
            build/reports/**
            seo/visible-parity.json
            seo/PUBLIC-ARTIFACT-MANIFEST.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
