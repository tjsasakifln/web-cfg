name: netcup-release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: Package only, stage/verify, or manually gated cutover promotion
        required: true
        default: package_only
        type: choice
        options:
          - package_only
          - stage_verify
          - promote
      expected_sha:
        description: Full main SHA observed by the operator before dispatch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: netcup-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preflight:
    name: exact main release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require canonical main SHA
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha || '' }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_REF" != "refs/heads/main" ]; then
            echo "NETCUP_RELEASE_BLOCKED: dispatch must target main" >&2
            exit 1
          fi
          if ! [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "NETCUP_RELEASE_BLOCKED: GitHub did not provide a full commit SHA" >&2
            exit 1
          fi
          if [ "$RELEASE_EVENT" = "workflow_dispatch" ]; then
            if ! [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "NETCUP_RELEASE_BLOCKED: manual dispatch requires the full expected main SHA" >&2
              exit 1
            fi
            if [ "$EXPECTED_SHA" != "$RELEASE_SHA" ]; then
              echo "NETCUP_RELEASE_BLOCKED: expected SHA no longer matches main" >&2
              exit 1
            fi
          elif [ "$RELEASE_EVENT" != "push" ]; then
            echo "NETCUP_RELEASE_BLOCKED: unsupported release event" >&2
            exit 1
          fi

  gates:
    name: exact SHA through site-ci
    needs: preflight
    uses: ./.github/workflows/site-ci.yml
    with:
      export_public_artifact: true
    permissions:
      contents: read
      actions: read

  pseo_gates:
    name: exact SHA through pSEO
    needs: preflight
    uses: ./.github/workflows/pseo.yml
    permissions:
      contents: read

  package:
    name: immutable release package and attestation
    needs: [gates, pseo_gates]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Download the exact public artifact exported by site-ci
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: site-ci-public-${{ github.sha }}
          path: _site
      - name: Package without rebuilding
        env:
          RELEASE_SHA: ${{ github.sha }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ] || \
             ! git diff --quiet || ! git diff --cached --quiet; then
            echo "NETCUP_PACKAGE_ERROR: checkout is not the exact clean gated SHA" >&2
            exit 1
          fi
          source_date_epoch=$(git show -s --format=%ct "$RELEASE_SHA")
          node_version=$(node --version)
          python_version=$(python3 --version | awk '{print $2}')
          # This job starts from a fresh checkout. Bind the canonical host CSP
          # to the exact downloaded HTML without rebuilding or changing _site.
          python3 scripts/site/csp_contract.py --write _headers --root _site
          python3 scripts/site/test_csp_contract.py
          node scripts/migration/netcup/render.mjs \
            --root . \
            --output build/netcup-host-contract
          python3 deploy/netcup/package_release.py \
            --site _site \
            --host-contract build/netcup-host-contract \
            --output "dist/netcup/$RELEASE_SHA" \
            --sha "$RELEASE_SHA" \
            --node-version "$node_version" \
            --python-version "$python_version" \
            --ci-run-id "$CI_RUN_ID" \
            --ci-run-url "$CI_RUN_URL" \
            --source-date-epoch "$source_date_epoch"
          (
            cd "dist/netcup/$RELEASE_SHA"
            sha256sum --check "confenge-web-$RELEASE_SHA.tar.gz.sha256"
          )
      - name: Attest immutable deploy artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/netcup/${{ github.sha }}/confenge-web-${{ github.sha }}.tar.gz
      - name: Store release candidate independently of Netlify
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: netcup-release-${{ github.sha }}
          path: dist/netcup/${{ github.sha }}/
          if-no-files-found: error
          retention-days: 30

  stage:
    name: Netcup stage and host-local verify
    if: github.event_name == 'push' || inputs.operation == 'stage_verify' || inputs.operation == 'promote'
    needs: package
    outputs:
      expected_current: ${{ steps.stage_control.outputs.expected_current }}
      recovery_target: ${{ steps.stage_control.outputs.recovery_target }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: netcup-stage
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download attested release bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: netcup-release-${{ github.sha }}
          path: dist/netcup/${{ github.sha }}
      - name: Require pinned SSH inputs
        env:
          NETCUP_DEPLOY_HOST: ${{ secrets.NETCUP_DEPLOY_HOST }}
          NETCUP_DEPLOY_PORT: ${{ vars.NETCUP_DEPLOY_PORT }}
          NETCUP_DEPLOY_USER: ${{ secrets.NETCUP_DEPLOY_USER }}
          NETCUP_SSH_PRIVATE_KEY: ${{ secrets.NETCUP_SSH_PRIVATE_KEY }}
          NETCUP_SSH_KNOWN_HOSTS: ${{ secrets.NETCUP_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$NETCUP_DEPLOY_HOST" ] || [ -z "$NETCUP_DEPLOY_PORT" ] || \
             [ -z "$NETCUP_DEPLOY_USER" ] || \
             [ -z "$NETCUP_SSH_PRIVATE_KEY" ] || [ -z "$NETCUP_SSH_KNOWN_HOSTS" ]; then
            echo "NETCUP_RELEASE_BLOCKED: configure the SSH host, port, user, key and pinned host keys; no fallback is allowed" >&2
            exit 1
          fi
          if ! [[ "$NETCUP_DEPLOY_HOST" =~ ^[A-Za-z0-9.:-]+$ ]] || \
             ! [[ "$NETCUP_DEPLOY_PORT" =~ ^[1-9][0-9]{0,4}$ ]] || \
             ! [[ "$NETCUP_DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || \
             (( NETCUP_DEPLOY_PORT > 65535 )); then
            echo "NETCUP_RELEASE_BLOCKED: invalid SSH host/port/user shape" >&2
            exit 1
          fi
          install -d -m 0700 "$RUNNER_TEMP/netcup-ssh"
          printf '%s\n' "$NETCUP_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/netcup-ssh/id_ed25519"
          printf '%s\n' "$NETCUP_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/netcup-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/netcup-ssh/id_ed25519" "$RUNNER_TEMP/netcup-ssh/known_hosts"
          known_host="$NETCUP_DEPLOY_HOST"
          if [ "$NETCUP_DEPLOY_PORT" != "22" ]; then
            known_host="[$NETCUP_DEPLOY_HOST]:$NETCUP_DEPLOY_PORT"
          fi
          ssh-keygen -F "$known_host" -f "$RUNNER_TEMP/netcup-ssh/known_hosts" >/dev/null || {
            echo "NETCUP_RELEASE_BLOCKED: pinned known_hosts has no entry for NETCUP_DEPLOY_HOST:NETCUP_DEPLOY_PORT" >&2
            exit 1
          }
      - name: Upload, stage, and verify without changing current
        id: stage_control
        env:
          NETCUP_DEPLOY_HOST: ${{ secrets.NETCUP_DEPLOY_HOST }}
          NETCUP_DEPLOY_PORT: ${{ vars.NETCUP_DEPLOY_PORT }}
          NETCUP_DEPLOY_USER: ${{ secrets.NETCUP_DEPLOY_USER }}
          RELEASE_SHA: ${{ github.sha }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          ssh_options=(
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/netcup-ssh/known_hosts"
            -p "$NETCUP_DEPLOY_PORT"
            -i "$RUNNER_TEMP/netcup-ssh/id_ed25519"
          )
          target="$NETCUP_DEPLOY_USER@$NETCUP_DEPLOY_HOST"
          current_link="$(ssh "${ssh_options[@]}" "$target" "readlink /opt/confenge-web/current")"
          if ! [[ "$current_link" =~ ^(releases/|/opt/confenge-web/releases/)[0-9a-f]{40}$ ]]; then
            echo "NETCUP_RELEASE_BLOCKED: current release identity is missing or unsafe" >&2
            exit 1
          fi
          expected_current="${current_link##*/}"
          echo "expected_current=$expected_current" >> "$GITHUB_OUTPUT"
          recovery_target="$expected_current"
          if [ "$expected_current" = "$RELEASE_SHA" ]; then
            rollback_link="$(ssh "${ssh_options[@]}" "$target" "readlink /opt/confenge-web/rollback")"
            if ! [[ "$rollback_link" =~ ^(releases/|/opt/confenge-web/releases/)[0-9a-f]{40}$ ]]; then
              echo "NETCUP_RELEASE_BLOCKED: idempotent recovery needs a verified predecessor" >&2
              exit 1
            fi
            recovery_target="${rollback_link##*/}"
          fi
          if [ "$recovery_target" = "$RELEASE_SHA" ]; then
            echo "NETCUP_RELEASE_BLOCKED: recovery target must differ from candidate" >&2
            exit 1
          fi
          echo "recovery_target=$recovery_target" >> "$GITHUB_OUTPUT"
          upload="/opt/confenge-web/incoming/.upload-$RELEASE_SHA-$CI_RUN_ID-$CI_RUN_ATTEMPT"
          ssh "${ssh_options[@]}" "$target" "install -d -m 0750 '$upload'"
          rsync -a --delay-updates --chmod=F640,D750 \
            -e "ssh -p $NETCUP_DEPLOY_PORT -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/netcup-ssh/known_hosts -i $RUNNER_TEMP/netcup-ssh/id_ed25519" \
            "dist/netcup/$RELEASE_SHA/" "$target:$upload/"
          controller_ssh=()
          for option in "${ssh_options[@]}"; do controller_ssh+=("--ssh-option=$option"); done
          python3 deploy/netcup/run_bundle_control.py \
            --bundle-directory "dist/netcup/$RELEASE_SHA" --sha "$RELEASE_SHA" \
            --target "$target" "${controller_ssh[@]}" --operation stage --upload-dir "$upload"
          python3 deploy/netcup/run_bundle_control.py \
            --bundle-directory "dist/netcup/$RELEASE_SHA" --sha "$RELEASE_SHA" \
            --target "$target" "${controller_ssh[@]}" --operation verify

  qualify:
    # The barrier. Until this job produces a qualification bound to THIS
    # candidate's identity and this run, `promote` refuses to change `current`.
    #
    # Five consecutive releases (34400752543, 34422538162, 34501989732,
    # 34517284468, 34532136335) were promoted first and verified afterwards
    # against the public domain; every one of them was rolled back. The
    # candidate is now exercised, with a real browser and the exact gated
    # artifact, while it is still a candidate.
    #
    # What this job deliberately does NOT prove is recorded inside the
    # qualification as `residual_differences`: the candidate cannot be served
    # through the real nginx contract or the real runtime before the symlink
    # swap, so edge latency, Cloudflare, the runtime-served endpoints and the
    # overlay branch remain verified after promotion, by the steps that already
    # do so and that stay blocking.
    name: Pre-promotion candidate qualification
    if: github.event_name == 'push' || inputs.operation == 'promote'
    needs: stage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - name: Install the gated Lighthouse toolchain
        run: npm ci --ignore-scripts
      - name: Download the exact gated public artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: site-ci-public-${{ github.sha }}
          path: _site
      - name: Download the attested release bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: netcup-release-${{ github.sha }}
          path: dist/netcup/${{ github.sha }}
      - name: Setup Chrome for candidate qualification
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        id: qualify_chrome
      - name: Confirm the candidate carries the release identity
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          carried="$(python3 -c 'import json,sys; print(json.load(open("_site/.well-known/build-info.json"))["commit"])')"
          if [ "$carried" != "$RELEASE_SHA" ]; then
            echo "NETCUP_QUALIFICATION_BLOCKED: the artifact carries $carried, not $RELEASE_SHA" >&2
            exit 1
          fi
      - name: Measure the candidate with the release verifier
        id: candidate_acceptance
        env:
          CHROME_PATH: ${{ steps.qualify_chrome.outputs.chrome-path }}
          LH_HOME_RUNS: "3"
        run: |
          set -euo pipefail
          # The checkout ships a committed summary from a previous release. It
          # is removed first so a run that dies before writing its own cannot
          # have the gap filled by an older report.
          rm -f docs/lighthouse-runs/summary.json
          # The runner's own server over the exact gated tree, the same
          # thresholds, the same counts. A candidate that cannot be measured to
          # a passing terminal state does not reach the visitors.
          node scripts/site/run_lighthouse.mjs
      - name: Emit the qualification bound to this candidate and this run
        if: always()
        env:
          RELEASE_SHA: ${{ github.sha }}
          MEASURED: ${{ steps.candidate_acceptance.outcome }}
        run: |
          set -euo pipefail
          mkdir -p build/reports
          state="INVALID_OR_INCOMPLETE"
          result="FAILED"
          if [ -f docs/lighthouse-runs/summary.json ]; then
            # A summary without a terminal state predates this contract and is
            # not evidence about this run.
            state="$(python3 -c 'import json;print(json.load(open("docs/lighthouse-runs/summary.json")).get("terminal_state") or "INVALID_OR_INCOMPLETE")')"
          else
            echo "no summary was produced by this run; the candidate stays unqualified" >&2
          fi
          if [ "$MEASURED" = "success" ] && [ "$state" = "MEASURED_PASS" ]; then result="PASSED"; fi
          bundle_digest="$(cut -d" " -f1 < "dist/netcup/$RELEASE_SHA/confenge-web-$RELEASE_SHA.tar.gz.sha256")"
          node scripts/site/release_qualification.mjs --emit \
            --sha="$RELEASE_SHA" \
            --site=_site \
            --bundle-digest="$bundle_digest" \
            --out="build/reports/release-qualification-$RELEASE_SHA.json" \
            --terminal-state="$state" \
            --acceptance-result="$result" \
            --run-id="$GITHUB_RUN_ID" \
            --run-attempt="$GITHUB_RUN_ATTEMPT" \
            --base="local-candidate" \
            --evidence="docs/lighthouse-runs/summary.json" \
            --toolchain="node=$(node --version),chrome=${{ steps.qualify_chrome.outputs.chrome-version }},lighthouse=$(node -p "require('lighthouse/package.json').version")" \
            --residual="real edge network latency and RTT;Cloudflare edge caching and transforms;the production nginx contract and its headers;the Node runtime endpoints (/.well-known/runtime-info.json);the live-intelligence overlay published at stage"
      - name: Store the qualification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: netcup-qualification-${{ github.sha }}
          path: |
            build/reports/release-qualification-${{ github.sha }}.json
            docs/lighthouse-runs/summary.json
          if-no-files-found: error
          retention-days: 30

  promote:
    name: Authorized atomic promote
    if: github.event_name == 'push' || inputs.operation == 'promote'
    needs: [stage, qualify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: netcup-production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download the same attested controller bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: netcup-release-${{ github.sha }}
          path: dist/netcup/${{ github.sha }}
      - name: Require an explicit post-ADR cutover authorization
        env:
          CUTOVER_AUTHORIZATION: ${{ vars.NETCUP_CUTOVER_AUTHORIZED }}
        run: |
          set -euo pipefail
          if [ "$CUTOVER_AUTHORIZATION" != "CONFENGE_NETCUP_CUTOVER_APPROVED" ]; then
            echo "NETCUP_PROMOTE_BLOCKED: production cutover is not authorized; stage remains safe" >&2
            exit 1
          fi
      - name: Require pinned SSH inputs
        env:
          NETCUP_DEPLOY_HOST: ${{ secrets.NETCUP_DEPLOY_HOST }}
          NETCUP_DEPLOY_PORT: ${{ vars.NETCUP_DEPLOY_PORT }}
          NETCUP_DEPLOY_USER: ${{ secrets.NETCUP_DEPLOY_USER }}
          NETCUP_SSH_PRIVATE_KEY: ${{ secrets.NETCUP_SSH_PRIVATE_KEY }}
          NETCUP_SSH_KNOWN_HOSTS: ${{ secrets.NETCUP_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$NETCUP_DEPLOY_HOST" ] || [ -z "$NETCUP_DEPLOY_PORT" ] || \
             [ -z "$NETCUP_DEPLOY_USER" ] || \
             [ -z "$NETCUP_SSH_PRIVATE_KEY" ] || [ -z "$NETCUP_SSH_KNOWN_HOSTS" ]; then
            echo "NETCUP_PROMOTE_BLOCKED: production environment SSH secrets are incomplete" >&2
            exit 1
          fi
          if ! [[ "$NETCUP_DEPLOY_HOST" =~ ^[A-Za-z0-9.:-]+$ ]] || \
             ! [[ "$NETCUP_DEPLOY_PORT" =~ ^[1-9][0-9]{0,4}$ ]] || \
             ! [[ "$NETCUP_DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || \
             (( NETCUP_DEPLOY_PORT > 65535 )); then
            echo "NETCUP_PROMOTE_BLOCKED: invalid SSH host/port/user shape" >&2
            exit 1
          fi
          install -d -m 0700 "$RUNNER_TEMP/netcup-ssh"
          printf '%s\n' "$NETCUP_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/netcup-ssh/id_ed25519"
          printf '%s\n' "$NETCUP_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/netcup-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/netcup-ssh/id_ed25519" "$RUNNER_TEMP/netcup-ssh/known_hosts"
          known_host="$NETCUP_DEPLOY_HOST"
          if [ "$NETCUP_DEPLOY_PORT" != "22" ]; then
            known_host="[$NETCUP_DEPLOY_HOST]:$NETCUP_DEPLOY_PORT"
          fi
          ssh-keygen -F "$known_host" -f "$RUNNER_TEMP/netcup-ssh/known_hosts" >/dev/null || {
            echo "NETCUP_PROMOTE_BLOCKED: pinned known_hosts has no entry for NETCUP_DEPLOY_HOST:NETCUP_DEPLOY_PORT" >&2
            exit 1
          }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - name: Install the gated Lighthouse toolchain
        run: npm ci --ignore-scripts
      - name: Download the same gated public artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: site-ci-public-${{ github.sha }}
          path: _site
      - name: Setup Chrome for public runtime verification
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        id: runtime_chrome
      - name: Download this candidate's qualification
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: netcup-qualification-${{ github.sha }}
          path: qualification
      - name: Confirm the public verification uses the qualified toolchain
        env:
          RELEASE_SHA: ${{ github.sha }}
          PROMOTE_CHROME: ${{ steps.runtime_chrome.outputs.chrome-version }}
        run: |
          set -euo pipefail
          record="qualification/build/reports/release-qualification-$RELEASE_SHA.json"
          # An unset resolution must FAIL, not match everything: a glob over the
          # whole toolchain string turns an empty version into `*chrome=*`, and
          # a truncated one into a prefix match. Compare exact, parsed fields.
          if [ -z "${PROMOTE_CHROME:-}" ]; then
            echo "NETCUP_PROMOTE_BLOCKED: the browser version for the public verification is unknown" >&2
            exit 1
          fi
          qualified_chrome="$(python3 -c 'import json,sys; t=json.load(open(sys.argv[1])).get("toolchain") or ""; print(dict(p.split("=",1) for p in t.split(",") if "=" in p).get("chrome",""))' "$record")"
          echo "qualified with chrome=$qualified_chrome; verifying with chrome=$PROMOTE_CHROME"
          if [ -z "$qualified_chrome" ]; then
            echo "NETCUP_PROMOTE_BLOCKED: the qualification records no browser version" >&2
            exit 1
          fi
          if [ "$qualified_chrome" != "$PROMOTE_CHROME" ]; then
            echo "NETCUP_PROMOTE_BLOCKED: the candidate was qualified with a different browser than this verification uses" >&2
            echo "  qualified: chrome=$qualified_chrome" >&2
            echo "  verifying: chrome=$PROMOTE_CHROME" >&2
            exit 1
          fi
      - name: Refuse to promote a candidate that is not qualified
        # The barrier, enforced immediately before `current` can change. The
        # qualification must exist, be readable, and match this candidate's
        # SHA, artifact hash, manifest hash, verifier version and this exact
        # run and attempt, and it must record MEASURED_PASS. Absent, stale,
        # mismatched or failing evidence stops the release here, with
        # production untouched. The refusal path is proved by
        # scripts/site/test_release_qualification.mjs.
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bundle_digest="$(cut -d" " -f1 < "dist/netcup/$RELEASE_SHA/confenge-web-$RELEASE_SHA.tar.gz.sha256")"
          node scripts/site/release_qualification.mjs --require \
            --sha="$RELEASE_SHA" \
            --site=_site \
            --bundle-digest="$bundle_digest" \
            --record="qualification/build/reports/release-qualification-$RELEASE_SHA.json" \
            --run-id="$GITHUB_RUN_ID"
      - name: Atomic promote and live identity confirmation
        id: atomic_promote
        env:
          GH_TOKEN: ${{ github.token }}
          NETCUP_DEPLOY_HOST: ${{ secrets.NETCUP_DEPLOY_HOST }}
          NETCUP_DEPLOY_PORT: ${{ vars.NETCUP_DEPLOY_PORT }}
          NETCUP_DEPLOY_USER: ${{ secrets.NETCUP_DEPLOY_USER }}
          RELEASE_SHA: ${{ github.sha }}
          EXPECTED_CURRENT: ${{ needs.stage.outputs.expected_current }}
        run: |
          set -euo pipefail
          current_main_sha="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha
          )"
          if [ "$current_main_sha" != "$RELEASE_SHA" ]; then
            echo "NETCUP_PROMOTE_BLOCKED: release SHA is no longer the tip of main" >&2
            exit 1
          fi
          ssh_options=(
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/netcup-ssh/known_hosts"
            -p "$NETCUP_DEPLOY_PORT"
            -i "$RUNNER_TEMP/netcup-ssh/id_ed25519"
          )
          target="$NETCUP_DEPLOY_USER@$NETCUP_DEPLOY_HOST"
          controller_ssh=()
          for option in "${ssh_options[@]}"; do controller_ssh+=("--ssh-option=$option"); done
          python3 deploy/netcup/run_bundle_control.py \
            --bundle-directory "dist/netcup/$RELEASE_SHA" --sha "$RELEASE_SHA" \
            --target "$target" "${controller_ssh[@]}" --operation promote \
            --expected-current "$EXPECTED_CURRENT"
          promoted_main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$promoted_main_sha" != "$RELEASE_SHA" ]; then
            echo "NETCUP_PROMOTE_SUPERSEDED: main advanced during promotion; restoring predecessor" >&2
            exit 1
          fi
          ssh "${ssh_options[@]}" "$target" "tail -n 1 /opt/confenge-web/evidence/deploy.ndjson"

      - name: Reconcile every served HTML against the exact artifact
        id: served_coverage
        env:
          RELEASE_SHA: ${{ github.sha }}
          NETCUP_DEPLOY_HOST: ${{ secrets.NETCUP_DEPLOY_HOST }}
          NETCUP_DEPLOY_PORT: ${{ vars.NETCUP_DEPLOY_PORT }}
          NETCUP_DEPLOY_USER: ${{ secrets.NETCUP_DEPLOY_USER }}
        run: |
          set -euo pipefail
          python3 deploy/netcup/run_bundle_control.py \
            --bundle-directory "dist/netcup/$RELEASE_SHA" --sha "$RELEASE_SHA" \
            --target "$NETCUP_DEPLOY_USER@$NETCUP_DEPLOY_HOST" \
            --ssh-option=-o --ssh-option=BatchMode=yes \
            --ssh-option=-o --ssh-option=IdentitiesOnly=yes \
            --ssh-option=-o --ssh-option=StrictHostKeyChecking=yes \
            --ssh-option=-o --ssh-option="UserKnownHostsFile=$RUNNER_TEMP/netcup-ssh/known_hosts" \
            --ssh-option=-p --ssh-option="$NETCUP_DEPLOY_PORT" \
            --ssh-option=-i --ssh-option="$RUNNER_TEMP/netcup-ssh/id_ed25519" \
            --operation inventory --output "build/reports/server-inventory-$RELEASE_SHA.json"
          python3 scripts/site/public_server_acceptance.py \
            --site _site --expected-sha "$RELEASE_SHA" --base https://confenge.com.br \
            --server-inventory "build/reports/server-inventory-$RELEASE_SHA.json" \
            --report-dir build/reports/served-public-acceptance
      - name: Verify the served runtime family and its applicable behavior
        id: runtime_acceptance
        env:
          RELEASE_SHA: ${{ github.sha }}
          CHROME_PATH: ${{ steps.runtime_chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          node scripts/site/runtime_lighthouse_acceptance.mjs \
            https://confenge.com.br \
            --expected-sha="$RELEASE_SHA" \
            --report="build/reports/runtime-public-acceptance-$RELEASE_SHA.json"
      - name: Confirm accepted release still matches main
        id: accepted_matches_main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          accepted_main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$accepted_main_sha" != "$RELEASE_SHA" ]; then
            echo "NETCUP_ACCEPTANCE_SUPERSEDED: main advanced during public verification; restoring predecessor" >&2
            exit 1
          fi
      - name: Name the acceptance terminal state
        # Fail-closed is preserved: a measured failure and inconclusive evidence
        # both still restore the predecessor. What this step adds is that the
        # run says WHICH of the two happened. "The site is defective" and "the
        # instrument could not conclude" demand different next actions, and the
        # absence of mandatory evidence must never be filed as an accessory
        # error.
        if: always()
        env:
          RELEASE_SHA: ${{ github.sha }}
          COVERAGE: ${{ steps.served_coverage.outcome }}
          ACCEPTANCE: ${{ steps.runtime_acceptance.outcome }}
          PROMOTED: ${{ steps.atomic_promote.outcome }}
        run: |
          set -uo pipefail
          summary="docs/lighthouse-runs/summary-$RELEASE_SHA.json"
          state="EVIDENCE_ABSENT"
          if [ -f "$summary" ]; then
            state="$(python3 -c "import json;print(json.load(open('$summary')).get('terminal_state') or 'INVALID_OR_INCOMPLETE')" 2>/dev/null || echo INVALID_OR_INCOMPLETE)"
          fi
          echo "NETCUP_ACCEPTANCE_TERMINAL_STATE promoted=$PROMOTED served_coverage=$COVERAGE runtime_acceptance=$ACCEPTANCE lighthouse=$state"
          {
            echo "### Release acceptance terminal state"
            echo ""
            echo "| signal | value |"
            echo "| --- | --- |"
            echo "| release | \`$RELEASE_SHA\` |"
            echo "| promotion | $PROMOTED |"
            echo "| served coverage | $COVERAGE |"
            echo "| runtime acceptance | $ACCEPTANCE |"
            echo "| lighthouse terminal state | $state |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Assert every mandatory evidence file was persisted
        # `if-no-files-found: error` performs ONE search across all path entries
        # and fires only when the total match count is zero. Because the runtime
        # acceptance report is written unconditionally in a finally, the upload
        # would pass with the Lighthouse summary or the server inventory
        # missing. "Mandatory" then over-claims what is enforced.
        #
        # Missing mandatory evidence is diagnosed here and fails the run, so it
        # is never mistaken for a green release. It is deliberately NOT a
        # material failure: the release itself was accepted by the checks above,
        # so the recovery is limited to failing loudly rather than withdrawing a
        # release that was proven healthy.
        if: always() && steps.atomic_promote.outcome == 'success'
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          missing=0
          for required in \
            "build/reports/server-inventory-$RELEASE_SHA.json" \
            "build/reports/runtime-public-acceptance-$RELEASE_SHA.json" \
            "docs/lighthouse-runs/summary-$RELEASE_SHA.json"; do
            if [ ! -s "$required" ]; then
              echo "NETCUP_EVIDENCE_MISSING $required" >&2
              missing=$((missing+1))
            fi
          done
          if [ ! -d "build/reports/served-public-acceptance" ]; then
            echo "NETCUP_EVIDENCE_MISSING build/reports/served-public-acceptance/" >&2
            missing=$((missing+1))
          fi
          if [ "$missing" -gt 0 ]; then
            echo "NETCUP_EVIDENCE_INCOMPLETE $missing mandatory artefact(s) absent; the release stays as accepted and this run is not green" >&2
            exit 1
          fi
          echo "NETCUP_EVIDENCE_COMPLETE"
      - name: Store mandatory post-promote evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: netcup-runtime-acceptance-${{ github.sha }}
          path: |
            build/reports/server-inventory-${{ github.sha }}.json
            build/reports/served-public-acceptance/
            build/reports/runtime-public-acceptance-${{ github.sha }}.json
            docs/lighthouse-runs/summary-${{ github.sha }}.json
            docs/lighthouse-runs/*-${{ github.sha }}*.json
          if-no-files-found: error
          retention-days: 30
      - name: Restore the predecessor after a cancelled or timed-out promotion
        # `failure()` does not evaluate on cancellation, and a job that exceeds
        # its timeout is cancelled. Without this, a promotion interrupted after
        # the swap but before acceptance concluded would leave an UNVERIFIED
        # release serving visitors with nothing to withdraw it. Best effort by
        # nature — the runner may be torn down first — which is why the
        # measurement budget above is ordered to expire well inside the job.
        if: cancelled() && steps.atomic_promote.outcome == 'success' && steps.runtime_acceptance.outcome != 'success'
        env:
          RELEASE_SHA: ${{ github.sha }}
          PREVIOUS_SHA: ${{ needs.stage.outputs.recovery_target }}
          NETCUP_DEPLOY_HOST: ${{ secrets.NETCUP_DEPLOY_HOST }}
          NETCUP_DEPLOY_PORT: ${{ vars.NETCUP_DEPLOY_PORT }}
          NETCUP_DEPLOY_USER: ${{ secrets.NETCUP_DEPLOY_USER }}
        run: |
          set -euo pipefail
          echo "NETCUP_PROMOTE_INTERRUPTED: restoring the predecessor of an unverified release" >&2
          ssh_options=(
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/netcup-ssh/known_hosts"
            -p "$NETCUP_DEPLOY_PORT" -i "$RUNNER_TEMP/netcup-ssh/id_ed25519"
          )
          target="$NETCUP_DEPLOY_USER@$NETCUP_DEPLOY_HOST"
          current_link="$(ssh "${ssh_options[@]}" "$target" "readlink /opt/confenge-web/current")"
          if [ "$current_link" != "releases/$RELEASE_SHA" ] && [ "$current_link" != "/opt/confenge-web/releases/$RELEASE_SHA" ]; then
            echo "NETCUP_ROLLBACK_BLOCKED: another release is current; refusing to replace it" >&2
            exit 1
          fi
          controller_ssh=()
          for option in "${ssh_options[@]}"; do controller_ssh+=("--ssh-option=$option"); done
          python3 deploy/netcup/run_bundle_control.py \
            --bundle-directory "dist/netcup/$RELEASE_SHA" --sha "$RELEASE_SHA" \
            --target "$target" "${controller_ssh[@]}" \
            --operation rollback --rollback-target "$PREVIOUS_SHA" --expected-current "$RELEASE_SHA"
      - name: Restore the predecessor after material public acceptance failure
        # A failed idempotent retry did not install the already-current release.
        # Do not roll it back merely because a prerequisite/API/SSH call failed.
        #
        # `failure()` is job-wide, and two steps run AFTER acceptance has fully
        # passed: naming the terminal state, and uploading the evidence. Either
        # can fail for reasons that say nothing about the release — an artifact
        # service error, throttling, a same-name conflict on "Re-run failed
        # jobs". With `failure()` alone, that withdrew a release that had just
        # been proven healthy, and on a re-run it did so every attempt: promote,
        # accept, fail the upload, roll back, repeat.
        #
        # Recovery therefore also requires a MATERIAL failure: the promotion
        # itself, the served-HTML reconciliation, the runtime acceptance, or the
        # final main-tip check. This is strictly fail-closed — every one of those
        # must have SUCCEEDED for recovery to be skipped, so an inconclusive or
        # skipped material step still restores the predecessor.
        if: >-
          failure()
          && (steps.atomic_promote.outcome == 'success' || (steps.atomic_promote.outcome == 'failure' && needs.stage.outputs.expected_current != github.sha))
          && (steps.atomic_promote.outcome != 'success'
              || steps.served_coverage.outcome != 'success'
              || steps.runtime_acceptance.outcome != 'success'
              || steps.accepted_matches_main.outcome != 'success')
        env:
          RELEASE_SHA: ${{ github.sha }}
          PREVIOUS_SHA: ${{ needs.stage.outputs.recovery_target }}
          NETCUP_DEPLOY_HOST: ${{ secrets.NETCUP_DEPLOY_HOST }}
          NETCUP_DEPLOY_PORT: ${{ vars.NETCUP_DEPLOY_PORT }}
          NETCUP_DEPLOY_USER: ${{ secrets.NETCUP_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh_options=(
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/netcup-ssh/known_hosts"
            -p "$NETCUP_DEPLOY_PORT" -i "$RUNNER_TEMP/netcup-ssh/id_ed25519"
          )
          target="$NETCUP_DEPLOY_USER@$NETCUP_DEPLOY_HOST"
          current_link="$(ssh "${ssh_options[@]}" "$target" "readlink /opt/confenge-web/current")"
          if [ "$current_link" != "releases/$RELEASE_SHA" ] && [ "$current_link" != "/opt/confenge-web/releases/$RELEASE_SHA" ]; then
            echo "NETCUP_ROLLBACK_BLOCKED: another release is current; refusing to replace it" >&2
            exit 1
          fi
          controller_ssh=()
          for option in "${ssh_options[@]}"; do controller_ssh+=("--ssh-option=$option"); done
          python3 deploy/netcup/run_bundle_control.py \
            --bundle-directory "dist/netcup/$RELEASE_SHA" --sha "$RELEASE_SHA" \
            --target "$target" "${controller_ssh[@]}" \
            --operation rollback --rollback-target "$PREVIOUS_SHA" --expected-current "$RELEASE_SHA"
          ssh "${ssh_options[@]}" "$target" "tail -n 1 /opt/confenge-web/evidence/deploy.ndjson"
