name: projetos-prontos-lighthouse-evidence

# Temporary evidence acquisition for PR #832. Remove after importing the real
# measurements. This does not replace site-ci, pSEO or release qualification.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  lighthouse-evidence:
    name: Lighthouse evidence for PR 832
    if: github.event.pull_request.number == 832 && github.head_ref == 'feat/projetos-prontos-20261112' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # A PR event's GITHUB_SHA is its synthetic merge. The canonical builder
      # explicitly prefers COMMIT_REF, which must identify the measured head.
      COMMIT_REF: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout the exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source identity and discard inherited evidence
        id: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMMIT_REF"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
          # Nothing committed in this directory may satisfy the new run.
          rm -rf docs/lighthouse-runs
          mkdir -p docs/lighthouse-runs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install the canonical dependencies
        run: |
          rm -rf node_modules
          npm ci --engine-strict
          rm -rf node_modules
          npm ci --engine-strict
          python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Resolve contracted Chrome version
        id: browser_contract
        run: node scripts/site/resolve_chrome_version.mjs >> "$GITHUB_OUTPUT"
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        id: setup-chrome
        with:
          chrome-version: ${{ steps.browser_contract.outputs.version }}
      - name: Build the canonical public artifact
        id: build
        env:
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: npm run build:site
      - name: Verify built identity and complete coverage
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          import { deriveCoverage, loadPolicy, resolveSiteRoot } from './scripts/site/interface_coverage.mjs';
          import { CRITICAL_MONEY_PATHS } from './scripts/site/lighthouse_thresholds.mjs';
          assert.equal(resolveSiteRoot(), resolve('_site'), 'Lighthouse must measure the built artifact');
          const build = JSON.parse(readFileSync('_site/.well-known/build-info.json', 'utf8'));
          assert.equal(build.commit, process.env.COMMIT_REF, 'built artifact must identify the PR head');
          const coverage = deriveCoverage({ policy: loadPolicy(), siteRoot: resolve('_site') });
          assert.equal(coverage.lighthouse.pages.length, 66);
          for (const route of ['/projetos-prontos/', '/projetos-prontos/condicoes/', '/projetos-prontos/pedidos/']) {
            assert(coverage.lighthouse.pages.includes(route), `missing new representative: ${route}`);
          }
          const measurements = coverage.lighthouse.pages.reduce((total, route) => total + (CRITICAL_MONEY_PATHS.has(route) ? 3 : 1), 0);
          console.log(JSON.stringify({ commit: build.commit, pages: coverage.lighthouse.pages.length, measurements }));
          JS
      - name: Lighthouse local (_site)
        id: lighthouse
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          # Preserve the canonical three runs on critical routes. The complete
          # policy derives 66 routes and 82 measurements for this PR.
          LH_HOME_RUNS: "3"
        run: |
          rm -f docs/lighthouse-runs/summary.json
          npm run test:lighthouse
      - name: Verify the real Lighthouse evidence
        id: lighthouse_gates
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: LH_REQUIRE_RAW_EVIDENCE=1 npm run test:lighthouse-gates
      - name: Record evidence provenance
        if: always() && steps.source.outcome == 'success'
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          LIGHTHOUSE_OUTCOME: ${{ steps.lighthouse.outcome }}
          LIGHTHOUSE_GATES_OUTCOME: ${{ steps.lighthouse_gates.outcome }}
          CONTRACTED_CHROME_VERSION: ${{ steps.browser_contract.outputs.version }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def sha256(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          head = git('rev-parse', 'HEAD')
          if head != os.environ['COMMIT_REF']:
              raise SystemExit('source changed after checkout')
          summary_path = Path('docs/lighthouse-runs/summary.json')
          summary = json.loads(summary_path.read_text()) if summary_path.is_file() else None
          build_path = Path('_site/.well-known/build-info.json')
          build = json.loads(build_path.read_text()) if build_path.is_file() else {}
          if build and build.get('commit') != head:
              raise SystemExit('built artifact identity does not match the measured source')
          if build_path.is_file():
              shutil.copyfile(build_path, 'docs/lighthouse-runs/build-info.json')
          policy_path = 'data/quality/interface-coverage-policy.json'
          registry_path = 'data/organic/public-family-registry.json'
          for path in (policy_path, registry_path):
              committed = subprocess.check_output(['git', 'show', f'{head}:{path}'])
              if hashlib.sha256(committed).hexdigest() != sha256(path):
                  raise SystemExit(f'coverage input changed after checkout: {path}')
          payload = {
              'schema': 'confenge.lighthouse-evidence-provenance/1',
              'purpose': 'temporary evidence acquisition for PR #832; not release approval',
              'source_sha': head,
              'source_tree': git('rev-parse', 'HEAD^{tree}'),
              'workflow_sha': os.environ.get('GITHUB_WORKFLOW_SHA'),
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'run_url': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'recorded_at': datetime.now(timezone.utc).isoformat(),
              'chrome_version': os.environ['CONTRACTED_CHROME_VERSION'],
              'build': {key: build.get(key) for key in ('commit', 'artifact_hash', 'manifest_hash', 'environment')},
              'build_info_path': 'build-info.json' if build_path.is_file() else None,
              'build_info_sha256': sha256(build_path) if build_path.is_file() else None,
              'policy_path': policy_path,
              'policy_sha256': sha256(policy_path),
              'registry_path': registry_path,
              'registry_sha256': sha256(registry_path),
              'build_outcome': os.environ['BUILD_OUTCOME'],
              'measurement_outcome': os.environ['LIGHTHOUSE_OUTCOME'],
              'gates_outcome': os.environ['LIGHTHOUSE_GATES_OUTCOME'],
              'summary_sha256': sha256(summary_path) if summary is not None else None,
              'terminal_state': summary.get('terminal_state') if summary is not None else 'NO_MEASUREMENT_SUMMARY',
              'measured_pages': summary.get('coverage', {}).get('measured_pages', []) if summary is not None else [],
              'repeated_runs': summary.get('coverage', {}).get('repeated_runs') if summary is not None else None,
          }
          Path('docs/lighthouse-runs/provenance.json').write_text(json.dumps(payload, indent=2) + '\n')
          PY
      - name: Upload measurement evidence only
        if: always() && steps.source.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: projetos-prontos-lighthouse-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs/lighthouse-runs/
          if-no-files-found: error
          retention-days: 7
