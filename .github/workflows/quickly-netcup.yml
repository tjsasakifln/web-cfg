name: quickly-netcup

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Quickly/Netcup operation
        required: true
        default: inventory
        type: choice
        options:
          - inventory
          - root_probe
          - capabilities
          - temp_key_install
          - temp_key_remove
          - deploy_quickly
      source_ref:
        description: Immutable Quickly fork commit SHA containing deploy/confenge
        required: false
        type: string
      image_ref:
        description: Immutable ghcr.io/tjsasakifln/quickly-confenge image digest
        required: false
        type: string
      public_key:
        description: Temporary reconciliation SSH public key (never the private key)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: quickly-netcup-confenge
  cancel-in-progress: false

jobs:
  inventory:
    name: Read-only Netcup inventory
    if: inputs.operation == 'inventory'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: netcup-stage
    steps:
      - name: Configure pinned SSH identity
        env:
          NETCUP_DEPLOY_HOST: ${{ secrets.NETCUP_DEPLOY_HOST }}
          NETCUP_DEPLOY_PORT: ${{ vars.NETCUP_DEPLOY_PORT }}
          NETCUP_DEPLOY_USER: ${{ secrets.NETCUP_DEPLOY_USER }}
          NETCUP_SSH_PRIVATE_KEY: ${{ secrets.NETCUP_SSH_PRIVATE_KEY }}
          NETCUP_SSH_KNOWN_HOSTS: ${{ secrets.NETCUP_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$NETCUP_DEPLOY_HOST"
          test -n "$NETCUP_DEPLOY_PORT"
          test -n "$NETCUP_DEPLOY_USER"
          test -n "$NETCUP_SSH_PRIVATE_KEY"
          test -n "$NETCUP_SSH_KNOWN_HOSTS"
          install -d -m 0700 "$RUNNER_TEMP/quickly-ssh"
          printf '%s\n' "$NETCUP_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/quickly-ssh/id_ed25519"
          printf '%s\n' "$NETCUP_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/quickly-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/quickly-ssh/id_ed25519" "$RUNNER_TEMP/quickly-ssh/known_hosts"
          known_host="$NETCUP_DEPLOY_HOST"
          if [ "$NETCUP_DEPLOY_PORT" != "22" ]; then
            known_host="[$NETCUP_DEPLOY_HOST]:$NETCUP_DEPLOY_PORT"
          fi
          ssh-keygen -F "$known_host" -f "$RUNNER_TEMP/quickly-ssh/known_hosts" >/dev/null

      - name: Inspect host without changing it
        env:
          NETCUP_DEPLOY_HOST: ${{ secrets.NETCUP_DEPLOY_HOST }}
          NETCUP_DEPLOY_PORT: ${{ vars.NETCUP_DEPLOY_PORT }}
          NETCUP_DEPLOY_USER: ${{ secrets.NETCUP_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh_options=(
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/quickly-ssh/known_hosts"
            -p "$NETCUP_DEPLOY_PORT"
            -i "$RUNNER_TEMP/quickly-ssh/id_ed25519"
          )
          target="$NETCUP_DEPLOY_USER@$NETCUP_DEPLOY_HOST"
          ssh "${ssh_options[@]}" "$target" 'bash -se' <<'REMOTE'
          set -euo pipefail
          echo '=== identity ==='
          hostname
          date -Is
          id
          uname -a
          echo '=== capacity ==='
          df -h / /opt 2>/dev/null || df -h /
          free -h || true
          echo '=== tools ==='
          command -v docker || true
          docker --version 2>/dev/null || sudo -n docker --version 2>/dev/null || true
          docker compose version 2>/dev/null || sudo -n docker compose version 2>/dev/null || true
          command -v nginx || true
          command -v caddy || true
          command -v traefik || true
          echo '=== listeners ==='
          ss -lntup 2>/dev/null || ss -lnt 2>/dev/null || true
          echo '=== services ==='
          systemctl is-active docker nginx caddy traefik 2>/dev/null || true
          systemctl list-units --type=service --state=running --no-legend 2>/dev/null \
            | awk '{print $1}' \
            | grep -Ei 'docker|nginx|caddy|traefik|warmbly|extra|confenge|quickly' || true
          echo '=== opt directories ==='
          find /opt -maxdepth 2 -mindepth 1 -type d -printf '%p\n' 2>/dev/null | sort | head -n 250 || true
          echo '=== protected project presence ==='
          for path in /opt/confenge-web /opt/extra-consultoria /opt/warmbly-confenge /opt/quickly-confenge; do
            if [ -e "$path" ]; then
              printf 'present %s\n' "$path"
            else
              printf 'absent %s\n' "$path"
            fi
          done
          echo '=== compose projects ==='
          docker compose ls 2>/dev/null || sudo -n docker compose ls 2>/dev/null || true
          echo '=== containers ==='
          docker ps --format '{{.Names}}|{{.Image}}|{{.Status}}|{{.Ports}}' 2>/dev/null \
            || sudo -n docker ps --format '{{.Names}}|{{.Image}}|{{.Status}}|{{.Ports}}' 2>/dev/null \
            || true
          echo '=== networks ==='
          docker network ls --format '{{.Name}}|{{.Driver}}|{{.Scope}}' 2>/dev/null \
            || sudo -n docker network ls --format '{{.Name}}|{{.Driver}}|{{.Scope}}' 2>/dev/null \
            || true
          echo '=== volumes ==='
          docker volume ls --format '{{.Name}}|{{.Driver}}' 2>/dev/null \
            || sudo -n docker volume ls --format '{{.Name}}|{{.Driver}}' 2>/dev/null \
            || true
          echo '=== proxy configuration names ==='
          find /etc/nginx /etc/caddy /opt -maxdepth 3 -type f \
            \( -name '*.conf' -o -name 'Caddyfile' -o -name 'docker-compose.yml' -o -name 'compose.yml' \) \
            -printf '%p\n' 2>/dev/null | sort | head -n 250 || true
          echo '=== proxy validation ==='
          sudo -n nginx -t 2>&1 || nginx -t 2>&1 || true
          echo '=== noninteractive sudo rules ==='
          sudo -n -l 2>&1 || true
          REMOTE

  root_probe:
    name: Probe authorized root SSH
    if: inputs.operation == 'root_probe'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: netcup-stage
    steps:
      - name: Configure pinned SSH identity
        env:
          NETCUP_DEPLOY_HOST: ${{ secrets.NETCUP_DEPLOY_HOST }}
          NETCUP_DEPLOY_PORT: ${{ vars.NETCUP_DEPLOY_PORT }}
          NETCUP_SSH_PRIVATE_KEY: ${{ secrets.NETCUP_SSH_PRIVATE_KEY }}
          NETCUP_SSH_KNOWN_HOSTS: ${{ secrets.NETCUP_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/quickly-ssh"
          printf '%s\n' "$NETCUP_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/quickly-ssh/id_ed25519"
          printf '%s\n' "$NETCUP_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/quickly-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/quickly-ssh/id_ed25519" "$RUNNER_TEMP/quickly-ssh/known_hosts"

      - name: Test root identity without changing the host
        env:
          NETCUP_DEPLOY_HOST: ${{ secrets.NETCUP_DEPLOY_HOST }}
          NETCUP_DEPLOY_PORT: ${{ vars.NETCUP_DEPLOY_PORT }}
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/quickly-ssh/known_hosts" \
            -p "$NETCUP_DEPLOY_PORT" \
            -i "$RUNNER_TEMP/quickly-ssh/id_ed25519" \
            "root@$NETCUP_DEPLOY_HOST" 'id -u; hostname; test -d /opt'

  capabilities:
    name: Inspect deploy-user capabilities
    if: inputs.operation == 'capabilities'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: netcup-stage
    steps:
      - name: Configure pinned SSH identity
        env:
          NETCUP_DEPLOY_HOST: ${{ secrets.NETCUP_DEPLOY_HOST }}
          NETCUP_DEPLOY_PORT: ${{ vars.NETCUP_DEPLOY_PORT }}
          NETCUP_SSH_PRIVATE_KEY: ${{ secrets.NETCUP_SSH_PRIVATE_KEY }}
          NETCUP_SSH_KNOWN_HOSTS: ${{ secrets.NETCUP_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/quickly-ssh"
          printf '%s\n' "$NETCUP_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/quickly-ssh/id_ed25519"
          printf '%s\n' "$NETCUP_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/quickly-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/quickly-ssh/id_ed25519" "$RUNNER_TEMP/quickly-ssh/known_hosts"

      - name: Inspect only paths and capabilities relevant to an isolated deploy
        env:
          NETCUP_DEPLOY_HOST: ${{ secrets.NETCUP_DEPLOY_HOST }}
          NETCUP_DEPLOY_PORT: ${{ vars.NETCUP_DEPLOY_PORT }}
          NETCUP_DEPLOY_USER: ${{ secrets.NETCUP_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh_options=(
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/quickly-ssh/known_hosts"
            -p "$NETCUP_DEPLOY_PORT" -i "$RUNNER_TEMP/quickly-ssh/id_ed25519"
          )
          ssh "${ssh_options[@]}" "$NETCUP_DEPLOY_USER@$NETCUP_DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          echo '=== home and groups ==='
          printf 'home=%s\n' "$HOME"
          id
          getent passwd "$(id -un)" | cut -d: -f1,6,7
          echo '=== relevant permissions ==='
          for path in /opt /opt/confenge-web /opt/confenge-web/shared /opt/confenge-web/pending-nginx \
                      /etc/nginx /etc/nginx/conf.d /etc/nginx/confenge-public-edge /run/docker.sock; do
            stat -c '%A|%U|%G|%n' "$path" 2>/dev/null || printf 'missing|%s\n' "$path"
            test -w "$path" && printf 'writable|%s\n' "$path" || true
          done
          echo '=== rootless container prerequisites ==='
          for tool in dockerd-rootless-setuptool.sh dockerd-rootless.sh rootlesskit newuidmap newgidmap podman slirp4netns; do
            command -v "$tool" || true
          done
          grep -E "^$(id -un):" /etc/subuid /etc/subgid 2>/dev/null || true
          loginctl show-user "$(id -un)" -p Linger -p State -p RuntimePath 2>/dev/null || true
          echo '=== existing runtime unit ==='
          systemctl cat confenge-web-runtime.service 2>/dev/null || true
          echo '=== active nginx conf content ==='
          sed -n '1,240p' /etc/nginx/conf.d/confenge-web-http.conf 2>/dev/null || true
          sed -n '1,260p' /etc/nginx/conf.d/confenge-web-origin.conf 2>/dev/null || true
          echo '=== public-edge includes ==='
          grep -RInE 'include|proxy_pass|server_name|listen' /etc/nginx/nginx.conf /etc/nginx/conf.d \
            /etc/nginx/confenge-public-edge 2>/dev/null | head -n 300 || true
          REMOTE

  temporary_reconciliation_key:
    name: Manage temporary reconciliation SSH key
    if: inputs.operation == 'temp_key_install' || inputs.operation == 'temp_key_remove'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: netcup-production
    steps:
      - name: Validate temporary public key
        env:
          TEMP_PUBLIC_KEY: ${{ inputs.public_key }}
        run: |
          set -euo pipefail
          expected_comment='codex-quickly-reconcile-20260928'
          test -n "$TEMP_PUBLIC_KEY"
          [[ "$TEMP_PUBLIC_KEY" != *$'\n'* && "$TEMP_PUBLIC_KEY" != *$'\r'* ]] || {
            echo 'public_key must contain exactly one line.' >&2
            exit 1
          }
          [[ "$TEMP_PUBLIC_KEY" =~ ^ssh-ed25519[[:space:]][A-Za-z0-9+/]+={0,3}[[:space:]]$expected_comment$ ]] || {
            echo 'public_key must be an Ed25519 key with the dedicated reconciliation comment.' >&2
            exit 1
          }
          umask 077
          printf '%s\n' "$TEMP_PUBLIC_KEY" > "$RUNNER_TEMP/reconciliation-key.pub"
          ssh-keygen -lf "$RUNNER_TEMP/reconciliation-key.pub"

      - name: Configure pinned SSH identity
        env:
          NETCUP_DEPLOY_HOST: ${{ secrets.NETCUP_DEPLOY_HOST }}
          NETCUP_DEPLOY_PORT: ${{ vars.NETCUP_DEPLOY_PORT }}
          NETCUP_DEPLOY_USER: ${{ secrets.NETCUP_DEPLOY_USER }}
          NETCUP_SSH_PRIVATE_KEY: ${{ secrets.NETCUP_SSH_PRIVATE_KEY }}
          NETCUP_SSH_KNOWN_HOSTS: ${{ secrets.NETCUP_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for required in NETCUP_DEPLOY_HOST NETCUP_DEPLOY_PORT NETCUP_DEPLOY_USER \
                          NETCUP_SSH_PRIVATE_KEY NETCUP_SSH_KNOWN_HOSTS; do
            test -n "${!required}" || { echo "missing required value: $required" >&2; exit 1; }
          done
          install -d -m 0700 "$RUNNER_TEMP/quickly-ssh"
          printf '%s\n' "$NETCUP_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/quickly-ssh/id_ed25519"
          printf '%s\n' "$NETCUP_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/quickly-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/quickly-ssh/id_ed25519" "$RUNNER_TEMP/quickly-ssh/known_hosts"
          known_host="$NETCUP_DEPLOY_HOST"
          if [ "$NETCUP_DEPLOY_PORT" != "22" ]; then
            known_host="[$NETCUP_DEPLOY_HOST]:$NETCUP_DEPLOY_PORT"
          fi
          ssh-keygen -F "$known_host" -f "$RUNNER_TEMP/quickly-ssh/known_hosts" >/dev/null

      - name: Upload key material and apply requested operation
        env:
          KEY_OPERATION: ${{ inputs.operation }}
          NETCUP_DEPLOY_HOST: ${{ secrets.NETCUP_DEPLOY_HOST }}
          NETCUP_DEPLOY_PORT: ${{ vars.NETCUP_DEPLOY_PORT }}
          NETCUP_DEPLOY_USER: ${{ secrets.NETCUP_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh_options=(
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/quickly-ssh/known_hosts"
            -p "$NETCUP_DEPLOY_PORT" -i "$RUNNER_TEMP/quickly-ssh/id_ed25519"
          )
          scp_options=(
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/quickly-ssh/known_hosts"
            -P "$NETCUP_DEPLOY_PORT" -i "$RUNNER_TEMP/quickly-ssh/id_ed25519"
          )
          target="$NETCUP_DEPLOY_USER@$NETCUP_DEPLOY_HOST"
          remote_key="/opt/quickly-confenge/.codex-reconciliation-key-${GITHUB_RUN_ID}.pub"
          cleanup_remote_public_key() {
            ssh "${ssh_options[@]}" "$target" "rm -f -- '$remote_key'" >/dev/null 2>&1 || true
          }
          trap cleanup_remote_public_key EXIT
          scp "${scp_options[@]}" "$RUNNER_TEMP/reconciliation-key.pub" "$target:$remote_key"
          ssh "${ssh_options[@]}" "$target" \
            "KEY_OPERATION='$KEY_OPERATION' REMOTE_KEY='$remote_key' bash -se" <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = 'confenge-deploy'
          test -r "$REMOTE_KEY"
          key=$(tr -d '\r\n' < "$REMOTE_KEY")
          rm -f -- "$REMOTE_KEY"
          [[ "$key" =~ ^ssh-ed25519[[:space:]][A-Za-z0-9+/]+={0,3}[[:space:]]codex-quickly-reconcile-20260928$ ]]

          install -d -m 0700 "$HOME/.ssh"
          authorized_keys="$HOME/.ssh/authorized_keys"
          touch "$authorized_keys"
          chmod 0600 "$authorized_keys"
          marker='codex-quickly-reconcile-20260928'

          replace_dedicated_key() {
            replacement=$(mktemp "$HOME/.ssh/authorized_keys.XXXXXX")
            awk -v marker="$marker" '$0 !~ ("[[:space:]]" marker "$") { print }' \
              "$authorized_keys" > "$replacement"
            if [ "$KEY_OPERATION" = 'temp_key_install' ]; then
              expiry=$(date -u -d '+4 hours' '+%Y%m%d%H%M%SZ')
              printf 'restrict,expiry-time="%s" %s\n' "$expiry" "$key" >> "$replacement"
            fi
            chmod 0600 "$replacement"
            mv -f -- "$replacement" "$authorized_keys"
          }

          case "$KEY_OPERATION" in
            temp_key_install)
              replace_dedicated_key
              count=$(awk -v marker="$marker" '$0 ~ ("[[:space:]]" marker "$") { count++ } END { print count + 0 }' "$authorized_keys")
              test "$count" -eq 1
              echo 'Temporary reconciliation key installed with a four-hour authentication expiry.'
              ;;
            temp_key_remove)
              replace_dedicated_key
              count=$(awk -v marker="$marker" '$0 ~ ("[[:space:]]" marker "$") { count++ } END { print count + 0 }' "$authorized_keys")
              test "$count" -eq 0
              echo 'Temporary reconciliation key removed.'
              ;;
            *)
              echo 'Unsupported key operation.' >&2
              exit 1
              ;;
          esac
          REMOTE

  deploy_quickly:
    name: Deploy isolated Quickly service
    if: inputs.operation == 'deploy_quickly'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: netcup-production
    steps:
      - name: Validate immutable deploy inputs
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          IMAGE_REF: ${{ inputs.image_ref }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'source_ref must be a full 40-character commit SHA.' >&2
            exit 1
          }
          [[ "$IMAGE_REF" =~ ^ghcr\.io/tjsasakifln/quickly-confenge@sha256:[0-9a-f]{64}$ ]] || {
            echo 'image_ref must be the immutable Quickly Confenge GHCR digest.' >&2
            exit 1
          }

      - name: Fetch the exact Quickly deployment bundle
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: tjsasakifln/Quickly
          ref: ${{ inputs.source_ref }}
          path: quickly-source
          persist-credentials: false

      - name: Package only the deployment bundle
        run: |
          set -euo pipefail
          test -f quickly-source/deploy/confenge/compose.yml
          test -f quickly-source/deploy/confenge/scripts/bootstrap-admin.sh
          tar \
            --directory=quickly-source/deploy/confenge \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='app-backups' \
            --create --gzip --file="$RUNNER_TEMP/quickly-confenge-bundle.tgz" .
          tar -tzf "$RUNNER_TEMP/quickly-confenge-bundle.tgz" >/dev/null

      - name: Configure pinned SSH identity
        env:
          NETCUP_DEPLOY_HOST: ${{ secrets.NETCUP_DEPLOY_HOST }}
          NETCUP_DEPLOY_PORT: ${{ vars.NETCUP_DEPLOY_PORT }}
          NETCUP_DEPLOY_USER: ${{ secrets.NETCUP_DEPLOY_USER }}
          NETCUP_SSH_PRIVATE_KEY: ${{ secrets.NETCUP_SSH_PRIVATE_KEY }}
          NETCUP_SSH_KNOWN_HOSTS: ${{ secrets.NETCUP_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$NETCUP_DEPLOY_HOST"
          test -n "$NETCUP_DEPLOY_PORT"
          test -n "$NETCUP_DEPLOY_USER"
          test -n "$NETCUP_SSH_PRIVATE_KEY"
          test -n "$NETCUP_SSH_KNOWN_HOSTS"
          install -d -m 0700 "$RUNNER_TEMP/quickly-ssh"
          printf '%s\n' "$NETCUP_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/quickly-ssh/id_ed25519"
          printf '%s\n' "$NETCUP_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/quickly-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/quickly-ssh/id_ed25519" "$RUNNER_TEMP/quickly-ssh/known_hosts"
          known_host="$NETCUP_DEPLOY_HOST"
          if [ "$NETCUP_DEPLOY_PORT" != "22" ]; then
            known_host="[$NETCUP_DEPLOY_HOST]:$NETCUP_DEPLOY_PORT"
          fi
          ssh-keygen -F "$known_host" -f "$RUNNER_TEMP/quickly-ssh/known_hosts" >/dev/null

      - name: Create secret environment file without logging values
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
          QUICKLY_ADMIN_PASSWORD: ${{ secrets.QUICKLY_ADMIN_PASSWORD }}
          QUICKLY_ENCRYPTION_KEY: ${{ secrets.QUICKLY_ENCRYPTION_KEY }}
          QUICKLY_POSTGRES_PASSWORD: ${{ secrets.QUICKLY_POSTGRES_PASSWORD }}
          QUICKLY_SECRET_KEY: ${{ secrets.QUICKLY_SECRET_KEY }}
        run: |
          set -euo pipefail
          for required in IMAGE_REF QUICKLY_ADMIN_PASSWORD QUICKLY_ENCRYPTION_KEY QUICKLY_POSTGRES_PASSWORD QUICKLY_SECRET_KEY; do
            test -n "${!required}" || { echo "missing required value: $required" >&2; exit 1; }
            [[ "${!required}" != *$'\n'* && "${!required}" != *$'\r'* ]] || {
              echo "invalid newline in $required" >&2
              exit 1
            }
          done
          umask 077
          {
            printf 'QUICKLY_IMAGE=%s\n' "$IMAGE_REF"
            printf '%s\n' 'BASE_URL=https://campanhas.confenge.com.br'
            printf '%s\n' 'CORS_ORIGINS=https://campanhas.confenge.com.br'
            printf '%s\n' 'POSTGRES_DB=quickly'
            printf '%s\n' 'POSTGRES_USER=quickly'
            printf 'POSTGRES_PASSWORD=%s\n' "$QUICKLY_POSTGRES_PASSWORD"
            printf 'QUICKLY_SECRET_KEY=%s\n' "$QUICKLY_SECRET_KEY"
            printf 'QUICKLY_ENCRYPTION_KEY=%s\n' "$QUICKLY_ENCRYPTION_KEY"
            printf '%s\n' 'QUICKLY_BOOTSTRAP_ADMIN_USERNAME=tiago.sasaki'
            printf '%s\n' 'QUICKLY_BOOTSTRAP_ADMIN_EMAIL=tiago.sasaki@confenge.com.br'
            printf 'QUICKLY_BOOTSTRAP_ADMIN_PASSWORD=%s\n' "$QUICKLY_ADMIN_PASSWORD"
          } > "$RUNNER_TEMP/quickly.env"
          chmod 0600 "$RUNNER_TEMP/quickly.env"

      - name: Upload bundle and sealed environment file
        env:
          NETCUP_DEPLOY_HOST: ${{ secrets.NETCUP_DEPLOY_HOST }}
          NETCUP_DEPLOY_PORT: ${{ vars.NETCUP_DEPLOY_PORT }}
          NETCUP_DEPLOY_USER: ${{ secrets.NETCUP_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh_options=(
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/quickly-ssh/known_hosts"
            -P "$NETCUP_DEPLOY_PORT" -i "$RUNNER_TEMP/quickly-ssh/id_ed25519"
          )
          target="$NETCUP_DEPLOY_USER@$NETCUP_DEPLOY_HOST"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/quickly-ssh/known_hosts" \
            -p "$NETCUP_DEPLOY_PORT" -i "$RUNNER_TEMP/quickly-ssh/id_ed25519" \
            "$target" 'test -d /opt/quickly-confenge && test -w /opt/quickly-confenge'
          scp "${ssh_options[@]}" "$RUNNER_TEMP/quickly-confenge-bundle.tgz" \
            "$RUNNER_TEMP/quickly.env" "$target:/opt/quickly-confenge/"

      - name: Deploy and bootstrap locally on the VPS
        env:
          NETCUP_DEPLOY_HOST: ${{ secrets.NETCUP_DEPLOY_HOST }}
          NETCUP_DEPLOY_PORT: ${{ vars.NETCUP_DEPLOY_PORT }}
          NETCUP_DEPLOY_USER: ${{ secrets.NETCUP_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh_options=(
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/quickly-ssh/known_hosts"
            -p "$NETCUP_DEPLOY_PORT" -i "$RUNNER_TEMP/quickly-ssh/id_ed25519"
          )
          ssh "${ssh_options[@]}" "$NETCUP_DEPLOY_USER@$NETCUP_DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          deploy_root=/opt/quickly-confenge
          cd "$deploy_root"
          test -f quickly-confenge-bundle.tgz
          test -f quickly.env
          tar --extract --gzip --file=quickly-confenge-bundle.tgz --no-same-owner
          install -m 0600 quickly.env .env
          rm -f quickly-confenge-bundle.tgz quickly.env
          install -d -m 0700 app-backups
          docker compose --project-name quickly-confenge --env-file .env -f compose.yml pull db app
          docker compose --project-name quickly-confenge --env-file .env -f compose.yml up -d
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error http://127.0.0.1:19080/api/auth/setup-status >/dev/null; then
              break
            fi
            test "$attempt" -lt 24 || { echo 'Quickly did not become ready on loopback.' >&2; exit 1; }
            sleep 5
          done
          ./scripts/bootstrap-admin.sh
          temp_env=$(mktemp .env.bootstrap.XXXXXX)
          awk '!/^QUICKLY_BOOTSTRAP_ADMIN_/' .env > "$temp_env"
          chmod 0600 "$temp_env"
          mv "$temp_env" .env
          docker compose --project-name quickly-confenge --env-file .env -f compose.yml up -d --force-recreate app
          app_id=$(docker compose --project-name quickly-confenge --env-file .env -f compose.yml ps -q app)
          test -n "$app_id"
          if docker inspect "$app_id" --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep -q '^QUICKLY_BOOTSTRAP_ADMIN_'; then
            echo 'Bootstrap credentials remained in the recreated container environment.' >&2
            exit 1
          fi
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error http://127.0.0.1:19080/api/auth/setup-status >/dev/null; then
              break
            fi
            test "$attempt" -lt 12 || { echo 'Quickly did not restart cleanly after bootstrap cleanup.' >&2; exit 1; }
            sleep 5
          done
          docker compose --project-name quickly-confenge --env-file .env -f compose.yml ps
          REMOTE
