name: quickly-netcup

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only Quickly/Netcup operation
        required: true
        default: inventory
        type: choice
        options:
          - inventory
          - root_probe

permissions:
  contents: read

concurrency:
  group: quickly-netcup-confenge
  cancel-in-progress: false

jobs:
  inventory:
    name: Read-only Netcup inventory
    if: inputs.operation == 'inventory'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: netcup-stage
    steps:
      - name: Configure pinned SSH identity
        env:
          NETCUP_DEPLOY_HOST: ${{ secrets.NETCUP_DEPLOY_HOST }}
          NETCUP_DEPLOY_PORT: ${{ vars.NETCUP_DEPLOY_PORT }}
          NETCUP_DEPLOY_USER: ${{ secrets.NETCUP_DEPLOY_USER }}
          NETCUP_SSH_PRIVATE_KEY: ${{ secrets.NETCUP_SSH_PRIVATE_KEY }}
          NETCUP_SSH_KNOWN_HOSTS: ${{ secrets.NETCUP_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$NETCUP_DEPLOY_HOST"
          test -n "$NETCUP_DEPLOY_PORT"
          test -n "$NETCUP_DEPLOY_USER"
          test -n "$NETCUP_SSH_PRIVATE_KEY"
          test -n "$NETCUP_SSH_KNOWN_HOSTS"
          install -d -m 0700 "$RUNNER_TEMP/quickly-ssh"
          printf '%s\n' "$NETCUP_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/quickly-ssh/id_ed25519"
          printf '%s\n' "$NETCUP_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/quickly-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/quickly-ssh/id_ed25519" "$RUNNER_TEMP/quickly-ssh/known_hosts"
          known_host="$NETCUP_DEPLOY_HOST"
          if [ "$NETCUP_DEPLOY_PORT" != "22" ]; then
            known_host="[$NETCUP_DEPLOY_HOST]:$NETCUP_DEPLOY_PORT"
          fi
          ssh-keygen -F "$known_host" -f "$RUNNER_TEMP/quickly-ssh/known_hosts" >/dev/null

      - name: Inspect host without changing it
        env:
          NETCUP_DEPLOY_HOST: ${{ secrets.NETCUP_DEPLOY_HOST }}
          NETCUP_DEPLOY_PORT: ${{ vars.NETCUP_DEPLOY_PORT }}
          NETCUP_DEPLOY_USER: ${{ secrets.NETCUP_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh_options=(
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/quickly-ssh/known_hosts"
            -p "$NETCUP_DEPLOY_PORT"
            -i "$RUNNER_TEMP/quickly-ssh/id_ed25519"
          )
          target="$NETCUP_DEPLOY_USER@$NETCUP_DEPLOY_HOST"
          ssh "${ssh_options[@]}" "$target" 'bash -se' <<'REMOTE'
          set -euo pipefail
          echo '=== identity ==='
          hostname
          date -Is
          id
          uname -a
          echo '=== capacity ==='
          df -h / /opt 2>/dev/null || df -h /
          free -h || true
          echo '=== tools ==='
          command -v docker || true
          docker --version 2>/dev/null || sudo -n docker --version 2>/dev/null || true
          docker compose version 2>/dev/null || sudo -n docker compose version 2>/dev/null || true
          command -v nginx || true
          command -v caddy || true
          command -v traefik || true
          echo '=== listeners ==='
          ss -lntup 2>/dev/null || ss -lnt 2>/dev/null || true
          echo '=== services ==='
          systemctl is-active docker nginx caddy traefik 2>/dev/null || true
          systemctl list-units --type=service --state=running --no-legend 2>/dev/null \
            | awk '{print $1}' \
            | grep -Ei 'docker|nginx|caddy|traefik|warmbly|extra|confenge|quickly' || true
          echo '=== opt directories ==='
          find /opt -maxdepth 2 -mindepth 1 -type d -printf '%p\n' 2>/dev/null | sort | head -n 250 || true
          echo '=== protected project presence ==='
          for path in /opt/confenge-web /opt/extra-consultoria /opt/warmbly-confenge /opt/quickly-confenge; do
            if [ -e "$path" ]; then
              printf 'present %s\n' "$path"
            else
              printf 'absent %s\n' "$path"
            fi
          done
          echo '=== compose projects ==='
          docker compose ls 2>/dev/null || sudo -n docker compose ls 2>/dev/null || true
          echo '=== containers ==='
          docker ps --format '{{.Names}}|{{.Image}}|{{.Status}}|{{.Ports}}' 2>/dev/null \
            || sudo -n docker ps --format '{{.Names}}|{{.Image}}|{{.Status}}|{{.Ports}}' 2>/dev/null \
            || true
          echo '=== networks ==='
          docker network ls --format '{{.Name}}|{{.Driver}}|{{.Scope}}' 2>/dev/null \
            || sudo -n docker network ls --format '{{.Name}}|{{.Driver}}|{{.Scope}}' 2>/dev/null \
            || true
          echo '=== volumes ==='
          docker volume ls --format '{{.Name}}|{{.Driver}}' 2>/dev/null \
            || sudo -n docker volume ls --format '{{.Name}}|{{.Driver}}' 2>/dev/null \
            || true
          echo '=== proxy configuration names ==='
          find /etc/nginx /etc/caddy /opt -maxdepth 3 -type f \
            \( -name '*.conf' -o -name 'Caddyfile' -o -name 'docker-compose.yml' -o -name 'compose.yml' \) \
            -printf '%p\n' 2>/dev/null | sort | head -n 250 || true
          echo '=== proxy validation ==='
          sudo -n nginx -t 2>&1 || nginx -t 2>&1 || true
          echo '=== noninteractive sudo rules ==='
          sudo -n -l 2>&1 || true
          REMOTE

  root_probe:
    name: Probe authorized root SSH
    if: inputs.operation == 'root_probe'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: netcup-stage
    steps:
      - name: Configure pinned SSH identity
        env:
          NETCUP_DEPLOY_HOST: ${{ secrets.NETCUP_DEPLOY_HOST }}
          NETCUP_DEPLOY_PORT: ${{ vars.NETCUP_DEPLOY_PORT }}
          NETCUP_SSH_PRIVATE_KEY: ${{ secrets.NETCUP_SSH_PRIVATE_KEY }}
          NETCUP_SSH_KNOWN_HOSTS: ${{ secrets.NETCUP_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/quickly-ssh"
          printf '%s\n' "$NETCUP_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/quickly-ssh/id_ed25519"
          printf '%s\n' "$NETCUP_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/quickly-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/quickly-ssh/id_ed25519" "$RUNNER_TEMP/quickly-ssh/known_hosts"

      - name: Test root identity without changing the host
        env:
          NETCUP_DEPLOY_HOST: ${{ secrets.NETCUP_DEPLOY_HOST }}
          NETCUP_DEPLOY_PORT: ${{ vars.NETCUP_DEPLOY_PORT }}
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/quickly-ssh/known_hosts" \
            -p "$NETCUP_DEPLOY_PORT" \
            -i "$RUNNER_TEMP/quickly-ssh/id_ed25519" \
            "root@$NETCUP_DEPLOY_HOST" 'id -u; hostname; test -d /opt'
