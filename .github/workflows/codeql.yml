name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 7 * * 1"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # The analysis is fail-closed even while branch protection keeps the two
    # stable product gates as its required contexts (#408).
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          category: "/language:${{ matrix.language }}"
