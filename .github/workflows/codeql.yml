name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 7 * * 1"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # The analysis is fail-closed even while branch protection keeps the two
    # stable product gates as its required contexts (#408).
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
