name: controlled production contact proof

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact published main commit to verify
        required: true
        type: string
      verify_email:
        description: Send one identified QA notification to the configured company inbox
        required: true
        default: false
        type: boolean
      scenario:
        description: Fixed proof journey; priority aditivo is the no-email production proof
        required: true
        default: priority-aditivo
        type: choice
        options:
          - priority-aditivo
          - legacy-sst

permissions:
  contents: read

concurrency:
  group: confenge-controlled-contact-proof
  cancel-in-progress: false

jobs:
  contact-proof:
    runs-on: ubuntu-latest
    environment: netcup-production
    timeout-minutes: 5
    steps:
      - name: Require exact main revision and explicit proof mode
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
          VERIFY_EMAIL: ${{ inputs.verify_email }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          set -euo pipefail
          test "$RELEASE_REF" = refs/heads/main
          case "$VERIFY_EMAIL" in
            true|false) ;;
            *) echo "verify_email must be true or false" >&2; exit 1 ;;
          esac
          case "$SCENARIO:$VERIFY_EMAIL" in
            priority-aditivo:false|legacy-sst:true) ;;
            *) echo "priority-aditivo forbids email; legacy-sst requires explicit email opt-in" >&2; exit 1 ;;
          esac
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$RELEASE_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: Install locked probe parser dependencies
        run: npm ci --ignore-scripts
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        id: setup-chrome
      - name: Capture fixed proof journey without submitting
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          set -euo pipefail
          mkdir -p build/reports
          case "$SCENARIO" in
            priority-aditivo)
              node scripts/site/synthetic_priority_aditivo_journey.mjs https://confenge.com.br > build/reports/controlled-contact-journey.json
              ;;
            legacy-sst)
              node scripts/site/synthetic_contact_journey.mjs https://confenge.com.br > build/reports/controlled-contact-journey.json
              ;;
            *) echo "unsupported proof scenario" >&2; exit 1 ;;
          esac
      - name: Prove persistence, safe handoff and optional isolated QA email
        env:
          LEAD_PROBE_SECRET: ${{ secrets.LEAD_PROBE_SECRET }}
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VERIFY_EMAIL: ${{ inputs.verify_email }}
          SCENARIO: ${{ inputs.scenario }}
          PROBE_BROWSER_CONTEXT_FILE: build/reports/controlled-contact-journey.json
        run: |
          set -euo pipefail
          case "$VERIFY_EMAIL" in
            true) export PROBE_VERIFY_EMAIL=1 ;;
            false) export PROBE_VERIFY_EMAIL=0 ;;
            *) echo "verify_email must be true or false" >&2; exit 1 ;;
          esac
          case "$SCENARIO" in
            priority-aditivo) export PROBE_SCENARIO=priority-aditivo PROBE_PAGE_PATH=/aditivos-obras-publicas/ ;;
            legacy-sst) export PROBE_SCENARIO=legacy-sst PROBE_PAGE_PATH=/ ;;
            *) echo "unsupported proof scenario" >&2; exit 1 ;;
          esac
          mkdir -p build/reports
          node scripts/site/synthetic_lead_probe.mjs https://confenge.com.br > build/reports/controlled-contact-proof.json
          cat build/reports/controlled-contact-proof.json
      - name: Preserve sanitized transport evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: controlled-contact-proof-${{ github.sha }}
          path: |
            build/reports/controlled-contact-journey.json
            build/reports/controlled-contact-proof.json
          if-no-files-found: error
          retention-days: 30
