<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Checklist de reequilíbrio | CONFENGE</title><meta name="description" content="Prontidão documental com bloqueadores centrais."/>
<link rel="canonical" href="https://confenge.com.br/ferramentas/checklist-reequilibrio/"/><link rel="stylesheet" href="/styles.css"/><link rel="stylesheet" href="/styles-tools.css"/>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Checklist de reequilíbrio","url":"https://confenge.com.br/ferramentas/checklist-reequilibrio/","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"}}</script>
</head><body>
<header class="site-header"><div class="container header-inner"><a class="brand" href="/"><img alt="CONFENGE" src="/assets/logo-confenge.png" width="800" height="208"/></a>
<nav class="desktop-nav" aria-label="principal"><a href="/conteudos/">Conteúdos</a><a href="/ferramentas/" aria-current="true">Ferramentas</a></nav></div></header>
<main id="conteudo"><header class="tool-page-hero"><div class="container tool-shell"><h1>Checklist de reequilíbrio</h1>
<p class="content-lead">Bloqueadores centrais impedem prontidão alta. Urgência ordena a correção.</p></div></header>
<div class="container tool-shell"><form id="f" class="tool-form"><div id="root"></div>
<div class="tool-grid"><div class="tool-field"><label>Urgência</label><select id="urg"><option value="baixa">Baixa</option><option value="media" selected>Média</option><option value="alta">Alta</option></select></div>
<div class="tool-field"><label>Materialidade</label><select id="mat"><option value="nao_informada">Não informar</option><option value="baixa">Baixa</option><option value="media">Média</option><option value="alta">Alta</option></select></div></div>
<p class="tool-privacy-note">Só neste navegador. Não substitui análise do contrato.</p>
<div class="tool-actions"><button class="button button-primary tool-run" type="submit">Diagnosticar</button><button type="button" class="button button-secondary" id="rst" data-tool-reset>Apagar</button></div></form>
<div id="out" class="tool-result-panel" hidden tabindex="-1" aria-live="polite"></div>
<div class="tool-actions" id="ra" hidden><button type="button" class="button button-secondary" id="cp" data-tool-copy>Copiar</button><button type="button" class="button button-secondary" id="dl" data-tool-download>Baixar</button></div>
<div class="tool-cta-contextual" id="cta" hidden></div></div></main>
<script src="/assets/js/tools-common.js"></script><script src="/assets/js/tool-compute.js"></script><script src="/script.js" defer></script>
<script>(function(){var T=window.ConfengeTools,C=window.ConfengeToolCompute,TOOL="checklist-reequilibrio",last="";
if(T.bindToolLifecycle)T.bindToolLifecycle({tool:TOOL});
var root=document.getElementById("root"),h="";
Object.keys(C.REEQ_CATEGORIES).forEach(function(cid){var cat=C.REEQ_CATEGORIES[cid];h+="<section class=\"tool-category\"><h3>"+cat.label+"</h3>";
cat.items.forEach(function(it){h+="<div class=\"tool-req\" data-key=\""+it.key+"\"><div class=\"tool-req-label\">"+it.label+"</div><div class=\"tool-req-states\">";
[["met","Atendido"],["missing","Pendente"],["na","N/A"]].forEach(function(o){h+="<label><input type=radio name=st-"+it.key+" value="+o[0]+" data-req> "+o[1]+"</label>";});
h+="</div></div>";});h+="</section>";});root.innerHTML=h;
document.getElementById("f").onsubmit=function(e){e.preventDefault();var st={};root.querySelectorAll(".tool-req").forEach(function(el){var k=el.getAttribute("data-key"),c=el.querySelector("input:checked");st[k]=c?c.value:"missing";});
var r=C.computeReequilibrio(st,{urgencia:document.getElementById("urg").value,materialidade:document.getElementById("mat").value});
var out=document.getElementById("out");out.hidden=false;out.className="tool-result-panel "+r.level;
out.innerHTML="<p class=\"tool-result-summary\"><strong>"+r.readinessLabel+"</strong>"+r.synthesis+"</p><ul class=\"tool-evidence-list\"><li>Cobertura: "+r.score_pct+"%</li><li>Bloqueadores: "+r.missingBlockers.length+"</li></ul><p class=\"tool-disclaimer\">Orientativo. Não significa direito ao reequilíbrio.</p>";
last=T.buildReport([{title:"Reequilíbrio",body:r.synthesis}]);document.getElementById("ra").hidden=false;T.focusResult(out);
document.getElementById("cta").hidden=false;document.getElementById("cta").innerHTML=r.hasCentralBlocker?"<p>Há bloqueadores. Organize o dossiê.</p><a class=\"button button-primary\" data-tool-to-form href=\"/#contato\">Contato</a>":"<a data-tool-to-content href=\"/reequilibrio-obras-publicas/\">Pilar reequilíbrio</a>";
T.track("tool_complete",{tool:TOOL,readiness:r.readiness,blockers:r.missingBlockers.length,urgencia:r.urgencia,materialidade:r.materialidade});};
document.getElementById("dl").onclick=function(){T.downloadText("reeq.txt",last);};document.getElementById("cp").onclick=function(){T.copyText(last);};
document.getElementById("rst").onclick=function(){if(confirm("Apagar?")){root.querySelectorAll("input").forEach(function(i){i.checked=false;});document.getElementById("out").hidden=true;}};
})();</script></body></html>
