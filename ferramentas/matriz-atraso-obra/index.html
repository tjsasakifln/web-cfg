<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Matriz de atraso de obra | CONFENGE</title><meta name="description" content="Eventos com hipóteses preliminares, sem veredito por contagem."/>
<link rel="canonical" href="https://confenge.com.br/ferramentas/matriz-atraso-obra/"/><link rel="stylesheet" href="/styles.css"/><link rel="stylesheet" href="/styles-tools.css"/>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Matriz de atraso de obra","url":"https://confenge.com.br/ferramentas/matriz-atraso-obra/","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"}}</script>
</head><body>
<header class="site-header"><div class="container header-inner"><a class="brand" href="/"><img alt="CONFENGE" src="/assets/logo-confenge.png" width="800" height="208"/></a>
<nav class="desktop-nav" aria-label="principal"><a href="/conteudos/">Conteúdos</a><a href="/ferramentas/" aria-current="true">Ferramentas</a></nav></div></header>
<main id="conteudo"><header class="tool-page-hero"><div class="container tool-shell"><h1>Matriz de atraso de obra</h1>
<p class="content-lead">Eventos com período e prova. Hipóteses preliminares apenas.</p></div></header>
<div class="container tool-shell"><form id="f" class="tool-form"><div id="events" class="tool-event-list"></div>
<div class="tool-actions"><button type="button" class="button button-secondary" id="add">Adicionar evento</button></div>
<p class="tool-privacy-note">Só neste navegador. Não emite laudo.</p>
<div class="tool-actions"><button class="button button-primary tool-run" type="submit">Montar hipóteses</button><button type="button" class="button button-secondary" id="rst" data-tool-reset>Apagar</button></div></form>
<div id="out" class="tool-result-panel" hidden tabindex="-1" aria-live="polite"></div>
<div class="tool-actions" id="ra" hidden><button type="button" class="button button-secondary" id="cp" data-tool-copy>Copiar</button><button type="button" class="button button-secondary" id="dl" data-tool-download>Baixar</button></div>
<div class="tool-cta-contextual" id="cta" hidden></div></div></main>
<script src="/assets/js/tools-common.js"></script><script src="/assets/js/tool-compute.js"></script><script src="/script.js" defer></script>
<script>(function(){var T=window.ConfengeTools,C=window.ConfengeToolCompute,TOOL="matriz-atraso",n=0,last="",root=document.getElementById("events");
if(T.bindToolLifecycle)T.bindToolLifecycle({tool:TOOL});
function card(){n++;var el=document.createElement("div");el.className="tool-event-card";el.innerHTML="<div class=\"tool-grid\"><div class=\"tool-field\" style=\"grid-column:1/-1\"><label>Causa</label><input data-f=\"causa\" required/></div><div class=\"tool-field\"><label>Parte</label><select data-f=\"parte\"><option value=\"indefinida\">Indefinida</option><option value=\"administracao\">Administração</option><option value=\"contratado\">Contratado</option><option value=\"compartilhado\">Compartilhada</option></select></div><div class=\"tool-field\"><label>Comunicação?</label><select data-f=\"com\"><option value=\"nao\">Não</option><option value=\"sim\">Sim</option></select></div><div class=\"tool-field\"><label>Documento?</label><select data-f=\"doc\"><option value=\"nao\">Não</option><option value=\"sim\">Sim</option></select></div><div class=\"tool-field\"><label>Atividade</label><input data-f=\"atv\"/></div><div class=\"tool-field\"><label>Crítico</label><select data-f=\"crit\"><option value=\"incerto\">Incerto</option><option value=\"sim\">Sim</option><option value=\"nao\">Não</option></select></div><div class=\"tool-field\"><label>Início</label><input type=date data-f=\"di\"/></div><div class=\"tool-field\"><label>Fim</label><input type=date data-f=\"df\"/></div></div>";return el;}
root.appendChild(card());document.getElementById("add").onclick=function(){root.appendChild(card());};
document.getElementById("f").onsubmit=function(e){e.preventDefault();var ev=[];root.querySelectorAll(".tool-event-card").forEach(function(c){var g=function(f){var el=c.querySelector("[data-f="+f+"]");return el?el.value:"";};ev.push({causa:g("causa"),parte:g("parte"),comunicacaoContemporanea:g("com")==="sim",documentoDisponivel:g("doc")==="sim",atividadeAfetada:g("atv"),impactoCaminhoCritico:g("crit"),dataInicio:g("di"),dataFim:g("df"),concorrencia:false});});
var r=C.computeMatrizEventos(ev.filter(function(x){return x.causa;}));var out=document.getElementById("out");
if(!r.ok){out.hidden=false;out.innerHTML="<p>Adicione um evento.</p>";return;}
out.hidden=false;out.className="tool-result-panel hypothesis";
var s=r.summary;out.innerHTML="<p class=\"tool-result-summary\"><strong>Hipóteses preliminares</strong>"+r.synthesis+"</p><ul class=\"tool-evidence-list\"><li>Eventos: "+s.totalEventos+"</li><li>Sem prova: "+s.semProvaContemporanea+"</li><li>Sem período: "+s.semPeriodoDefinido+"</li></ul><ul>"+r.events.map(function(ev){return "<li><strong>"+ev.causa+"</strong>: "+ev.hipotese+"</li>";}).join("")+"</ul><p class=\"tool-disclaimer\">"+r.disclaimer+"</p>";
last=T.buildReport([{title:"Matriz",body:r.synthesis}]);document.getElementById("ra").hidden=false;T.focusResult(out);
document.getElementById("cta").hidden=false;document.getElementById("cta").innerHTML=s.semProvaContemporanea?"<a class=\"button button-primary\" data-tool-to-form href=\"/#contato\">Analisar prova</a>":"<a data-tool-to-content href=\"/conteudos/como-provar-atraso-obra-publica/\">Como provar atraso</a>";
T.track("tool_complete",{tool:TOOL,events:s.totalEventos,sem_prova:s.semProvaContemporanea,level:"hypothesis"});};
document.getElementById("dl").onclick=function(){T.downloadText("matriz.txt",last);};document.getElementById("cp").onclick=function(){T.copyText(last);};
document.getElementById("rst").onclick=function(){if(confirm("Apagar?")){root.innerHTML="";root.appendChild(card());document.getElementById("out").hidden=true;}};
})();</script></body></html>
