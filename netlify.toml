# Single deterministic build: validate snapshot → generate pSEO pages/hubs/sitemaps
# → public manifest → assemble isolated _site → SEO/attribution gates.
# Netlify must not call the private DB. Publish ONLY the public artifact.
# Redirect rules live in `_redirects` (copied into _site).
[build]
  command = "npm run build:site"
  publish = "_site"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  PYTHON_VERSION = "3.12"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Keep Blobs client unbundled so Netlify can inject NETLIFY_BLOBS_CONTEXT at runtime
  external_node_modules = ["@netlify/blobs"]
  # Private GSC insights for authenticated ops?action=gsc_insights (not public static)
  included_files = ["netlify/functions/data/**", "data/ops/**", "data/conversion/**", "data/offers/**", "scripts/offers/**", "docs/contracts/intent-action/**", "data/site/editorial-policy.json", "data/bofu-dominance/core/gsc-live-overlay.v1.json"]

[functions."search-observation-tick"]
  schedule = "30 11 * * *"

# Optional: keep host rule here as belt-and-suspenders for domain-level match.
# _redirects already contains the same rule first (processed before toml).
[[redirects]]
  from = "https://confenge.netlify.app/*"
  to = "https://confenge.com.br/:splat"
  status = 301
  force = true
