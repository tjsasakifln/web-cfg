# Build only. Redirect rules live in `_redirects` (publish root) so Deploy
# summary always processes them. Do not duplicate path redirects here.
[build]
  publish = "."

# Optional: keep host rule here as belt-and-suspenders for domain-level match.
# _redirects already contains the same rule first (processed before toml).
[[redirects]]
  from = "https://confenge.netlify.app/*"
  to = "https://confenge.com.br/:splat"
  status = 301
  force = true
