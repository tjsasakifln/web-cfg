[build]
  publish = "."

# --- Host canonization (must be first; force so existing files do not shadow) ---
[[redirects]]
  from = "https://confenge.netlify.app/*"
  to = "https://confenge.com.br/:splat"
  status = 301
  force = true

# --- Canonical path normalization ---
[[redirects]]
  from = "/conteudos"
  to = "/conteudos/"
  status = 301

[[redirects]]
  from = "/privacidade"
  to = "/privacidade/"
  status = 301

[[redirects]]
  from = "/privacidade.html"
  to = "/privacidade/"
  status = 301
  force = true

[[redirects]]
  from = "/termos-de-uso"
  to = "/termos-de-uso/"
  status = 301

[[redirects]]
  from = "/obrigado"
  to = "/obrigado.html"
  status = 200

